<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#fbfaf6">
<title>日志 · 知识导图</title>
<link rel="stylesheet" href="mind-elixir.css">
<style>
:root{
  --paper:#fbfaf6; --ink:#1b1d1c; --mut:#6b6f6d; --line:#e6e4dc; --green:#0e7a52;
  --hd: calc(56px + env(safe-area-inset-top));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
body{overflow:hidden;overscroll-behavior:none}
.hd{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(251,250,246,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ic{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;
  font-size:15px;line-height:1;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.ttl{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
.ttl b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-size:10px;color:var(--mut);letter-spacing:.02em}
.acts{display:flex;gap:6px;flex:0 0 auto}
.acts button{border:1px solid var(--line);background:#fff;color:#3c403e;border-radius:9px;
  font-size:11.5px;height:30px;padding:0 9px;cursor:pointer}
.acts button:active{transform:scale(.97)}
#qbar{position:fixed;left:0;right:0;top:var(--hd);z-index:55;display:flex;gap:6px;align-items:center;
  padding:7px 10px;background:rgba(251,250,246,.97);border-bottom:1px solid var(--line)}
#qbar[hidden]{display:none}
#q{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:9px;padding:0 10px;
  font-size:13px;background:#fff;color:var(--ink);outline:none}
#q:focus{border-color:#b9d8c9}
#qres{font-size:11px;color:var(--mut);min-width:44px;text-align:center}
#qbar button{height:32px;width:32px;border:1px solid var(--line);background:#fff;border-radius:9px;
  color:var(--mut);font-size:13px;cursor:pointer}
.tip{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:50;font-size:10.5px;color:var(--mut);background:rgba(251,250,246,.9);border:1px solid var(--line);
  border-radius:99px;padding:4px 12px;pointer-events:none;white-space:nowrap}
#map{position:fixed;top:0;right:0;bottom:0;left:0;padding-top:var(--hd)}
#mindex{width:100%;height:100%}
.map-container{background:var(--paper)!important;
  --bgcolor:var(--paper); --color:#1b1d1c; --main-color:#0e7a52;
  --main-bgcolor:#eef5f1; --main-border:1px solid #cfe3d9;
  --root-color:#fff; --root-bgcolor:#0e7a52; --root-border-color:#0e7a52;
  --root-radius:12px; --main-radius:10px; --topic-padding:5px 9px;
  --node-gap-x:22px; --node-gap-y:5px; --main-gap-x:54px; --main-gap-y:26px;
  --map-padding:60px 80px 120px;
  font-size:14px;
}
.map-container me-root me-tpc{font-size:20px;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 18px rgba(14,122,82,.18)}
.map-container me-parent me-tpc{line-height:1.55;white-space:normal;max-width:30em}
.map-container me-tpc .text{max-width:30em}
.map-container b,.map-container strong{font-weight:700}
.map-container mark{background:#fff0b8;color:inherit;padding:0 2px;border-radius:3px}
.map-container u{text-decoration:underline;text-underline-offset:2px}
.map-container .mm-note{display:block;margin-top:5px;padding:3px 0 1px 7px;border-left:2px solid #d9d6cb;
  color:#6f736f;font-size:11.5px;line-height:1.5;white-space:pre-wrap}
.map-container .mm-tbl{display:block;margin-top:6px;max-width:360px;overflow-x:auto}
.map-container table{border-collapse:collapse;font-size:11px;line-height:1.4;background:#fff}
.map-container th,.map-container td{border:1px solid #e2e2da;padding:3px 6px;text-align:left;vertical-align:top}
.map-container th{background:#f6f4ec;font-weight:600}
.map-container .mm-img{border-radius:8px;margin-top:4px;max-width:100%;display:block;
  pointer-events:auto;cursor:zoom-in}
.map-container me-epd{transform:scale(1.15)}
.me-hit{outline:2px solid #f0b429!important;outline-offset:3px;border-radius:6px}
/* 图片灯箱 */
.lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;background:rgba(12,14,13,.96);
  display:flex;flex-direction:column;opacity:0;transition:opacity .18s ease}
.lb.on{opacity:1}
.lb[hidden]{display:none}
.lb-top{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.lb-top span{flex:1;min-width:0;color:#cfd6d1;font-size:11.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.lb-top button{height:30px;min-width:34px;padding:0 8px;border:1px solid rgba(255,255,255,.18);
  background:transparent;color:#e8eae8;border-radius:8px;font-size:11.5px;cursor:pointer}
.lb-stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.lb-stage:active{cursor:grabbing}
.lb-stage img{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;
  will-change:transform;user-select:none;-webkit-user-drag:none}
.lb-tip{text-align:center;color:rgba(255,255,255,.4);font-size:10.5px;
  padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
/* 文档视图 */
#doc{position:fixed;top:var(--hd);left:0;right:0;bottom:0;overflow:auto;background:var(--paper);
  padding:18px 16px calc(48px + env(safe-area-inset-bottom));display:none;--dstep:16px}
#doc.on{display:block}
#doc[hidden]{display:none}
.doc-inner{max-width:760px;margin:0 auto;font-size:14.5px;line-height:1.75}
.doc-root{font-family:"Songti SC","Noto Serif SC",serif;font-size:21px;font-weight:700;
  padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
#doc details{margin:0}
#doc summary{list-style:none;cursor:pointer;border-radius:7px;position:relative;
  padding:4px 8px 4px calc(10px + var(--d,0) * var(--dstep));line-height:1.65}
#doc summary:hover{background:#f5f3ec}
#doc summary::-webkit-details-marker{display:none}
#doc summary:before{content:"▸";position:absolute;left:calc(var(--d,0) * var(--dstep) - 1px);top:5px;
  font-size:10px;color:#9aa39d;transition:transform .15s}
#doc details[open]>summary:before{transform:rotate(90deg)}
#doc summary:hover{background:#f2f0e8}
#doc .dleaf{padding:3px 4px 3px calc(14px + var(--d,0) * var(--dstep));position:relative}
#doc .dleaf:before{content:"";position:absolute;left:calc(4px + var(--d,0) * var(--dstep));top:12px;width:4px;height:4px;
  border-radius:50%;background:#c9cec9}
#doc details details summary{font-weight:500}
#doc .dtext img{display:block;max-width:min(100%,340px);border-radius:8px;margin:6px 0}
#doc .mm-note{display:block;margin:4px 0 2px;padding:3px 0 1px 8px;border-left:2px solid #d9d6cb;
  color:#6f736f;font-size:12.5px;line-height:1.65;white-space:pre-wrap}
#doc mark{background:#fff0b8;color:inherit;padding:0 2px;border-radius:3px}
#doc u{text-decoration:underline;text-underline-offset:2px}
#doc code{background:#f1efe6;padding:1px 4px;border-radius:4px;font-size:12.5px}
#doc table{border-collapse:collapse;font-size:12px;margin:6px 0;background:#fff}
#doc th,#doc td{border:1px solid #e2e2da;padding:4px 7px;text-align:left;vertical-align:top}
#doc th{background:#f6f4ec}
#doc a{color:#1d4ed8}
#doc .mm-tbl{display:block;max-width:100%;overflow-x:auto}
@media(max-width:520px){#doc{padding:14px 12px 60px;--dstep:13px}.doc-inner{font-size:14px}}
#doc summary.lv1{font-size:18px;font-weight:700;margin-top:16px;color:#14181a;
  border-bottom:1px solid var(--line);padding-bottom:6px}
#doc summary.lv2{font-size:16px;font-weight:650;margin-top:8px;color:#1b1f1d}
#doc summary.lv3{font-size:14.5px;font-weight:600;color:#2a2f2c}
#doc .dleaf.lv3{font-size:14px}
#doc .dleaf.lv4,#doc .dleaf.lv5{font-size:13.5px;color:#3a3f3c}
#doc img{cursor:zoom-in}
.dsearch{position:sticky;top:0;z-index:12;display:flex;gap:6px;align-items:center;
  padding:8px 0 10px;background:linear-gradient(var(--paper) 80%,transparent);max-width:760px;margin:0 auto}
.dsearch input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:9px;
  padding:0 10px;font-size:13px;background:#fff;outline:none}
.dsearch input:focus{border-color:#b9d8c9}
.dsearch span{font-size:10.5px;color:var(--mut);min-width:46px;text-align:center}
.dsearch button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;
  color:var(--mut);font-size:12px;cursor:pointer}
#doc mark.dhit{background:#ffe58a;color:inherit;border-radius:2px}
#doc mark.dhit.cur{background:#f5b942}
.dt-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.dt-head h3{margin:0}
#docTocClose{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;
  font-size:16px;color:var(--mut);cursor:pointer}
#docTocBtn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:130;
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;
  box-shadow:0 6px 18px rgba(20,30,25,.12);color:#3c403e;font-size:11px;cursor:pointer;display:none}
#docTocBtn.on{display:block}
#docMask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,14,12,.35);z-index:140;
  display:none}
#docMask.on{display:block}
#docToc{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:330px;background:#fff;z-index:150;
  transform:translateX(102%);transition:transform .22s ease;overflow:auto;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
  box-shadow:-12px 0 30px rgba(0,0,0,.12)}
#docToc.on{transform:none}
#docToc h3{font-size:13px;margin:0 0 10px;color:var(--mut);font-weight:600;letter-spacing:.04em}
.toc-i{display:block;padding:7px 6px;border-radius:7px;text-decoration:none;color:#22282a;
  font-size:13px;line-height:1.45}
.toc-i:hover{background:#f4f2ea}
.toc-i.t2{padding-left:20px;font-size:12.5px;color:#3d4441}
.toc-i.t3{padding-left:34px;font-size:12px;color:#5b625e}
@media(max-width:520px){#doc{padding:14px 12px 60px}.doc-inner{font-size:14px}}
@media (max-width:520px){
  .acts button{padding:0 7px;font-size:11px}
  .map-container{font-size:13px;--map-padding:40px 46px 96px;--main-gap-x:44px}
  .map-container me-root me-tpc{font-size:18px}
  .tip{display:none}
}
</style>
</head>
<body>
<div class="hd">
  <button class="ic" id="back" aria-label="返回">←</button>
  <div class="ttl"><b>日志</b><small>幕布导图 · 155 个节点</small></div>
  <div class="acts">
    <button id="viewToggle">文档</button>
    <button id="qbtn">搜索</button>
    <button id="fit">适应</button>
    <button id="docOpen" hidden>展开</button>
    <button id="docClose" hidden>收起</button>
  </div>
</div>
<div id="qbar" hidden>
  <input id="q" placeholder="搜索节点内容…" autocomplete="off" enterkeyhint="search">
  <span id="qres"></span>
  <button id="qprev" aria-label="上一个">↑</button>
  <button id="qnext" aria-label="下一个">↓</button>
  <button id="qclose" aria-label="关闭搜索">×</button>
</div>
<div id="map"><div id="mindex"></div></div>
<div id="doc">
  <div id="dbar" hidden><div class="dsearch"><input id="dq" placeholder="在本文档中搜索…" autocomplete="off"><span id="dqc"></span><button id="dqprev" type="button">↑</button><button id="dqnext" type="button">↓</button><button id="dqclose" type="button">×</button></div></div>
  <div class="doc-inner" id="docInner"></div>
</div>
<button id="docTocBtn" type="button">目录</button>
<div id="docMask"></div>
<aside id="docToc"><div class="dt-head"><h3>本篇目录</h3><button id="docTocClose" type="button" aria-label="关闭目录">×</button></div><nav id="docTocList"></nav></aside>
<div class="tip">单指拖动 · 双指缩放 · 双击图片放大 · 点圆点收起/展开</div>
<div class="lb" id="lb" hidden>
  <div class="lb-top"><span id="lbname"></span>
    <button id="lbfit" type="button">适应</button>
    <button id="lb1x" type="button">1:1</button>
    <button id="lbclose" type="button" aria-label="关闭">×</button></div>
  <div class="lb-stage" id="lbstage"><img id="lbimg" alt=""></div>
  <div class="lb-tip">双指缩放 · 拖动移动 · 双击复位</div>
</div>
<script src="mind-elixir.iife.js"></script>
<script type="application/json" id="data">{"title": "日志", "data": {"id": "root", "topic": "<b>日志<\/b><span class=\"mm-note\">MYSQL日志有：<b>undo log（回滚日志）、redo log（重做日志） 、binlog （归档日志）<\/b><\/span>", "children": [{"id": "n1", "topic": "<b>undo log（回滚日志）<\/b>：是 Innodb 存储引擎层生成的日志，实现了事务中的<b>原子性<\/b>，主要<b>用于事务回滚和 MVCC<\/b>。", "children": []}, {"id": "n2", "topic": "<b>redo log（重做日志）<\/b>：是 Innodb 存储引擎层生成的日志，实现了事务中的<b>持久性<\/b>，主要<b>用于掉电等故障恢复<\/b>；", "children": []}, {"id": "n3", "topic": "<b>binlog （归档日志）<\/b>：是 Server 层生成的日志，主要<b>用于数据备份和主从复制<\/b>；", "children": []}, {"id": "n4", "topic": "<b>1.为何需要undo log？<\/b><span class=\"mm-note\">undo log <b>两大作用<\/b>：<\/span>", "children": [{"id": "n5", "topic": "<b>实现事务回滚，保障事务的原子性<\/b>。事务处理过程中，如果出现了错误或者用户执 行了 ROLLBACK 语句，MySQL 可以利用 undo log 中的历史数据将数据恢复到事务开始之前的状态。<span class=\"mm-note\">每当 InnoDB 引擎对一条记录进行操作（修改、删除、新增）时，<b>要把回滚时需要的信息都记录到 undo<\/b> <b>log<\/b> 里，比如：<\/span>", "children": [{"id": "n6", "topic": "在<b>插入<\/b>一条记录时，要把这条记录的主键值记下来，这样之后回滚时只需要把这个主键值对应的记录<b>删掉<\/b>就好了；", "children": []}, {"id": "n7", "topic": "在<b>删除<\/b>一条记录时，要把这条记录中的内容都记下来，这样之后回滚时再把由这些内容组成的记录<b>插入<\/b>到表中就好了；", "children": []}, {"id": "n8", "topic": "在<b>更新<\/b>一条记录时，要把被更新的列的旧值记下来，这样之后回滚时再把这些列<b>更新为旧值<\/b>就好了。", "children": []}]}, {"id": "n9", "topic": "<b>实现 MVCC（多版本并发控制）关键因素之一<\/b>。MVCC 是通过 <b>ReadView + undo log<\/b> 实现的。<span class=\"mm-note\">undo log 为每条记录保存多份历史数据，MySQL 在执行快照读（普通 select 语句）的时候，会根据事务的 Read View 里的信息，顺着 <b>undo log 的版本链<\/b>找到满足其可见性的记录。 <img class=\"mm-img\" src=\"fl-6c4a3836ba6c87.jpg\" style=\"width:320px;height:216px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}]}, {"id": "n10", "topic": "<b>2.为何需要Buffer Pool(缓冲池)<\/b>", "children": [{"id": "n11", "topic": "主要目的：来<b>提高数据库的读写性能<\/b>", "children": []}, {"id": "n12", "topic": "分析：<span class=\"mm-note\">MySQL 的数据都是存在磁盘中的，那么我们要更新一条记录的时候，得先要从磁盘读取该记录，然后在内存中修改这条记录。那修改完这条记录是选择直接写回到磁盘，还是选择缓存起来呢？ 当然是缓存起来好，这样下次有查询语句命中了这条记录，<b>直接读取缓存中的记录，就不需要从磁盘获取数据<\/b>了。<\/span>", "children": []}, {"id": "n13", "topic": "有了Buffer Pool的好处：", "children": [{"id": "n14", "topic": "当<b>读取数据<\/b>时，如果数据存在于 Buffer Pool 中，客户端就会直接读取 Buffer Pool 中的数据，否则再去磁盘中读取。", "children": []}, {"id": "n15", "topic": "当<b>修改数据<\/b>时，如果数据存在于 Buffer Pool 中，那<b>直接修改 Buffer Pool 中数据所在的页<\/b>，然后<b>将其页设置为脏页<\/b>（该页的内存数据和磁盘上的数据已经不一致），为了减少磁盘I/O，<b>不会立即将脏页写入磁盘<\/b>，后续由<b>后台线程选择一个合适的时机将脏页写入到磁盘<\/b>。", "children": []}]}, {"id": "n16", "topic": "<b>Buffer Pool缓存什么<\/b>？", "children": [{"id": "n17", "topic": "Buffer Pool 同样需要<b>按「页」来划分<\/b>。", "children": []}, {"id": "n18", "topic": "在 MySQL 启动的时候，<b>InnoDB 会为 Buffer Pool 申请一片连续的内存空间，然后按照默认的<code>16KB<\/code>的大小划分出一个个的页， Buffer Pool 中的页就叫做缓存页<\/b>。", "children": []}, {"id": "n19", "topic": "缓存内容：Buffer Pool 除了缓存「<b>索引页<\/b>」和「<b>数据页<\/b>」，还包括了 <b>Undo 页<\/b>，<b>插入缓存<\/b>、<b>自适应哈希索引<\/b>、<b>锁信息<\/b>等等。<span class=\"mm-note\"><img class=\"mm-img\" src=\"fl-3ca9d8f0a3c806.jpg\" style=\"width:320px;height:150px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}, {"id": "n20", "topic": "<b>Undo页记录<\/b>什么？<span class=\"mm-note\">开启事务后，<b>InnoDB 层更新记录前，首先要记录相应的 undo log<\/b>，如果是更新操作，<b>需要把被更新的列的旧值记下来<\/b>，也就是要生成一条 undo log链，undo log 会写入 Buffer Pool 中的 Undo 页面。<\/span>", "children": []}, {"id": "n21", "topic": "<b>查询一条记录，就只需要缓冲一条记录吗<\/b>？<span class=\"mm-note\"><b>不是<\/b>的。 当我们查询一条记录时，<b>InnoDB 是会把整个页的数据加载到 Buffer Pool 中<\/b>，将页加载到 Buffer Pool 后，再通过页里的「页目录」去定位到某条具体的记录。<\/span>", "children": []}]}]}, {"id": "n22", "topic": "<b>3.为何需要redo log？<\/b><span class=\"mm-note\">为什么需要 redo log 这个问题我们有两个答案：<\/span>", "children": [{"id": "n23", "topic": "<b>实现事务的持久性，让 MySQL 有 crash-safe 的能力<\/b>，能够保证 MySQL 在任何时间段突然崩溃，重启后之前已提交的记录都不会丢失；", "children": []}, {"id": "n24", "topic": "<b>将写操作从「随机写」变成了「顺序写」<\/b>，提升 MySQL 写入磁盘的性能。", "children": []}, {"id": "n25", "topic": "<b>内存总是不可靠<\/b>，为了防止断电故障等导致数据丢失，就需要用到redo log。", "children": []}, {"id": "n26", "topic": "当有一条记录需要更新的时候，InnoDB 引擎就会先更新内存（同时标记为脏页），然后将本次对这个页的修改以 redo log 的形式记录下来，<b>这个时候更新就算完成了<\/b>。", "children": []}, {"id": "n27", "topic": "后续，InnoDB 引擎会在适当的时候，由后台线程将缓存在 Buffer Pool 的脏页刷新到磁盘里，这就是 <b>WAL （Write-Ahead Logging）技术<\/b>。<span class=\"mm-note\"><b>WAL 技术指的是， MySQL 的写操作并不是立刻写到磁盘上，而是先写日志，然后在合适的时间再写到磁盘上<\/b>。 <img class=\"mm-img\" src=\"fl-7bfca34ddb0a7b.jpg\" style=\"width:320px;height:249px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}, {"id": "n28", "topic": "<b>什么是redo log？<\/b><span class=\"mm-note\">redo log 是<b>物理日志<\/b>，记录了某个数据页做了什么修改，比如<b>对 XXX 表空间中的 YYY 数据页 ZZZ 偏移量的地方做了AAA 更新<\/b>，每当执行一个事务就会产生这样的一条或者多条物理日志。 在事务提交时，<b>只要先将 redo log 持久化到磁盘<\/b>即可，可以<b>不需要等到将缓存在 Buffer Pool 里的脏页数据持久化到磁盘<\/b>。 当系统崩溃时，虽然脏页数据没有持久化，但是 redo log 已经持久化，接着 MySQL 重启后，可以根据 redo log 的内容，将所有数据恢复到最新的状态。<\/span>", "children": []}, {"id": "n29", "topic": "<b>被修改 Undo 页面，需要记录对应 redo log 吗<\/b>？<span class=\"mm-note\"><b>需要<\/b>的。 开启事务后，InnoDB 层更新记录前，首先要记录相应的 undo log，如果是更新操作，需要把被更新的列的旧值记下来，也就是要生成一条 undo log，undo log 会写入 Buffer Pool 中的 Undo 页面。 不过，<b>在内存修改该 Undo 页面后，需要记录对应的 redo log<\/b>。<\/span>", "children": []}, {"id": "n30", "topic": "<b>redo log 和 undo log 区别在哪？<\/b><span class=\"mm-note\">这两种日志是属于 InnoDB 存储引擎的日志，它们的区别在于：<\/span>", "children": [{"id": "n31", "topic": "redo log 记录了此次事务「<b>完成后<\/b>」的数据状态，记录的是更新<b>之后<\/b>的值；", "children": []}, {"id": "n32", "topic": "undo log 记录了此次事务「<b>开始前<\/b>」的数据状态，记录的是更新<b>之前<\/b>的值；<span class=\"mm-note\">事务提交之前发生了崩溃，重启后会通过 <b>undo log 回滚事务，保证原子性；<\/b>事务提交之后发生了崩溃，重启后会通过 <b>redo log 恢复事务，保证持久性。<\/b><\/span>", "children": []}]}, {"id": "n33", "topic": "<b>1.redo log 要写到磁盘，数据也要写磁盘，为什么要多此一举？<\/b><span class=\"mm-note\"><b>写入 redo log 的方式使用了追加操作<\/b>， 所以磁盘操作是<b>顺序写<\/b>，而写入数据需要先找到写入位置，然后才写到磁盘，所以磁盘操作是<b>随机写<\/b>。 磁盘的<b>「顺序写 」比「随机写」 高效的多<\/b>，因此 redo log 写入磁盘的开销更小。<\/span>", "children": []}, {"id": "n34", "topic": "<b>2.Redo log什么时候刷盘？<\/b><span class=\"mm-note\">缓存在 redo log buffer 里的 redo log 还是在内存中，它什么时候刷新到磁盘？ 主要有下面几个时机：<\/span>", "children": [{"id": "n35", "topic": "<b>MySQL 正常关闭时<\/b>；", "children": []}, {"id": "n36", "topic": "当 <b>redo log buffer 中记录的写入量大于 redo log buffer 内存空间的一半<\/b>时，会触发落盘；", "children": []}, {"id": "n37", "topic": "InnoDB 的<b>后台线程每隔 1 秒<\/b>，将 redo log buffer 持久化到磁盘。", "children": []}, {"id": "n38", "topic": "<b>每次事务提交时都将缓存在 redo log buffer 里的 redo log 直接持久化到磁盘<\/b>（这个策略可由 <b>innodb_flush_log_at_trx_commit 参数控制<\/b>，下面会说）。<span class=\"mm-note\">除此之外，InnoDB 还提供了另外两种策略，由参数 <code>innodb_flush_log_at_trx_commit<\/code> 参数控制，可取的值有：0、1、2，默认值为 1，这三个值分别代表的策略如下：<\/span>", "children": []}, {"id": "n39", "topic": "当设置该<b>参数为 0 时<\/b>，表示每次事务提交时 ，还是<b>将 redo log 留在 redo log buffer 中<\/b> ，该模式下<b>在事务提交时不会主动触发<\/b>写入磁盘的操作。", "children": []}, {"id": "n40", "topic": "当设置该<b>参数为 1 时<\/b>，表示<b>每次事务提交时，都将缓存在 redo log buffer 里的 redo log 直接持久化到磁盘<\/b>，这样可以保证 MySQL 异常重启之后数据不会丢失。", "children": []}, {"id": "n41", "topic": "当设置该<b>参数为 2 时<\/b>，表示每次事务提交时，都只是缓存在 redo log buffer 里的 redo log <b>写到 redo log 文件，注意写入到「 redo log 文件」并不意味着写入到了磁盘<\/b>，因为操作系统的文件系统中有个 Page Cache，Page Cache 是专门用来缓存文件数据的，所以写入「 redo log文件」意味着写入到了操作系统的文件缓存。", "children": []}]}]}, {"id": "n42", "topic": "<b>4.为何需要binlog？<\/b><span class=\"mm-note\">undo log 和 redo log 这两个日志都是 Innodb 存储引擎生成的 MySQL 在完成一条更新操作后，<b>Server 层还会生成一条 binlog<\/b>，等之后事务提交的时候，会将该事物执行过程中产生的所有 binlog 统一写 入 binlog 文件。 💡 从整个架构的角度去看待，MySQL会分为<b>Server层<\/b>和<b>引擎层<\/b>。 Server层主要包含连接器、分析器、优化器、执行器，还有各种函数之类的东西等等。 而引擎层就是用来真正处理数据，比如保存数据，提供读写接口供Server使用。 <b>引擎层是可插拔的<\/b>，就是说我们可以使用各种类型的引擎，比如最常见的InnoDB引擎 binlog 文件是**记录<\/span>", "children": [{"id": "n43", "topic": "逻辑日志：可以简单理解为记录的就是<b>sql语句<\/b>。", "children": []}, {"id": "n44", "topic": "物理日志：因为mysql数据最终是保存在数据页中的，<b>物理日志记录的就是数据页变更。<\/b>", "children": []}, {"id": "n45", "topic": "<b>1.为什么有了 binlog， 还要有 redo log？<\/b><span class=\"mm-note\">这个问题跟 MySQL 的时间线有关系。 最开始 MySQL 里并没有 InnoDB 引擎，MySQL 自带的引擎是 MyISAM，但是 MyISAM 没有 crash-safe 的能力，<b>binlog 日志只能用于归档<\/b>。 而 InnoDB 是另一个公司以插件形式引入 MySQL 的，既然只依靠 binlog 是没有 crash-safe 能力的，所以 InnoDB 使用 redo log 来实现 crash-safe 能力。 尽管 Binlog 和 Redo log 在功能上都可以用来实现数据库的持久性和恢复功能，但它们的设计目的和实现方式有所不同，各自有着不同的优势和适用场景。<\/span>", "children": []}, {"id": "n46", "topic": "<b>2.Redo log和binlog的区别<\/b><span class=\"mm-note\">这两个日志有<b>四个区别<\/b>。<\/span>", "children": [{"id": "n47", "topic": "*适<b>用对象不同<\/b>：*", "children": [{"id": "n48", "topic": "binlog 是 MySQL 的 Server 层实现的日志，<b>所有存储引擎都可以使用<\/b>；", "children": []}, {"id": "n49", "topic": "redo log 是 Innodb 存储引擎实现的日志；", "children": []}]}, {"id": "n50", "topic": "<b>*文件格式不同<\/b>：*", "children": [{"id": "n51", "topic": "<b>binlog 是逻辑日志，有 3 种格式类型<\/b>，分别是 Statement（默认格式）、ROW、 MIXED，区别如下：<span class=\"mm-note\"><img class=\"mm-img\" src=\"fl-e0b9242230bf05.jpg\" style=\"width:320px;height:68px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}, {"id": "n52", "topic": "r<b>edo log 是物理日志<\/b>，记录的是在某个数据页做了什么修改，比如对 XXX 表空间中的 YYY 数据页 ZZZ 偏移量的地方做了AAA 更新；", "children": []}]}, {"id": "n53", "topic": "<b>*写入方式不同：<\/b>*", "children": [{"id": "n54", "topic": "binlog 是<b>追加写<\/b>，写满一个文件，就创建一个新的文件继续写，不会覆盖以前的日志，<b>保存的是全量的日志<\/b>。", "children": []}, {"id": "n55", "topic": "redo log 是<b>循环写<\/b>，日志空间大小是固定，全部写满就从头开始，<b>保存未被刷入磁盘的脏页日志<\/b>。", "children": []}]}, {"id": "n56", "topic": "<b>*用途不同：<\/b>*", "children": [{"id": "n57", "topic": "binlog 用于<b>备份恢复、主从复制<\/b>；", "children": []}, {"id": "n58", "topic": "redo log 用于<b>掉电等故障恢复<\/b>。", "children": []}]}]}, {"id": "n59", "topic": "<b>3.如果不小心整个数据库的数据被删除了，能使用 redo log 文件恢复数据吗？<\/b><span class=\"mm-note\"><b>不可以<\/b>使用 redo log 文件恢复，<b>只能使用 binlog 文件恢复<\/b>。 因为 redo log 文件是循环写，是会边写边擦除日志的，只记录未被刷入磁盘的数据的物理日志，已经刷入磁盘的数据都会从 redo log 文件里擦除。 <b>binlog 文件保存的是全量的日志<\/b>，也就是<b>保存了所有数据变更的情况<\/b>，理论上只要记录在 binlog 上的数据，都可以恢复，所以如果不小心整个数据库的数据被删除了，得用 binlog 文件恢复数据.<\/span>", "children": []}]}, {"id": "n60", "topic": "<b>5.主从复制如何实现？<\/b><span class=\"mm-note\">MySQL 的<b>主从复制依赖于 binlog<\/b> ，也就是记录 MySQL 上的所有变化并以二进制形式保存在磁盘上。 复制的过程就是<b>将 binlog 中的数据从主库传输到从库上<\/b>。 这个过程一般是<b>异步<\/b>的，也就是主库上执行事务操作的线程不会等待复制 binlog 的线程同步完成。 MySQL 集群的主从复制过程梳理成 3 个阶段：<\/span>", "children": [{"id": "n61", "topic": "<b>写入 Binlog<\/b>：主库写 binlog 日志，提交事务，并更新本地存储数据。", "children": []}, {"id": "n62", "topic": "<b>同步 Binlog<\/b>：把 binlog 复制到所有从库上，每个从库把 binlog 写到暂存日志中。", "children": []}, {"id": "n63", "topic": "<b>回放 Binlog<\/b>：回放 binlog，并更新存储引擎中的数据。<span class=\"mm-note\">具体详细过程如下：<\/span>", "children": []}, {"id": "n64", "topic": "MySQL 主库在收到客户端提交事务的请求之后，会先写入 binlog，再提交事务，更新存储引擎中的数据，事务提交完成后，返回给客户端“操作成功”的响应。", "children": []}, {"id": "n65", "topic": "从库会创建一个专门的 I/O 线程，连接主库的 log dump 线程，来接收主库的 binlog 日志，再把 binlog 信息写入 relay log 的中继日志里，再返回给主库“复制成功”的响应。", "children": []}, {"id": "n66", "topic": "从库会创建一个用于回放 binlog 的线程，去读 relay log 中继日志，然后回放 binlog 更新存储引擎中的数据，最终实现主从的数据一致性。", "children": []}, {"id": "n67", "topic": "<b>MYSQL主从复制还有什么模型？<\/b><span class=\"mm-note\">主要有三种：<\/span>", "children": [{"id": "n68", "topic": "<b>同步复制<\/b>：MySQL 主库提交事务的线程要等待所有从库的复制成功响应，才返回客户端结果。这种方式在实际项目中，基本上没法用，原因有两个：一是性能很差，因为要复制到所有节点才返回响应；二是可用性也很差，主库和所有从库任何一个数据库出问题，都会影响业务。", "children": []}, {"id": "n69", "topic": "<b>异步复制<\/b>（默认模型）：MySQL 主库提交事务的线程并不会等待 binlog 同步到各从库，就返回客户端结果。这种模式一旦主库宕机，数据就会发生丢失。", "children": []}, {"id": "n70", "topic": "<b>半同步复制<\/b>：MySQL 5.7 版本之后增加的一种复制方式，介于两者之间，事务线程不用等待所有的从库复制成功响应，只要一部分复制成功响应回来就行，比如一主二从的集群，只要数据成功复制到任意一个从库上，主库的事务线程就可以返回给客户端。这种<b>半同步复制的方式，兼顾了异步复制和同步复制的优点，即使出现主库宕机，至少还有一个从库有最新的数据，不存在数据丢失的风险<\/b>。", "children": []}]}]}, {"id": "n71", "topic": "<b>6.binlog什么时候刷盘？<\/b><span class=\"mm-note\">事务执行过程中，<b>先把日志写到 binlog cache<\/b>（Server 层的 cache），事务提交的时候，<b>再把 binlog cache 写到 binlog 文件中<\/b>。<\/span>", "children": [{"id": "n72", "topic": "<b>一个事务的 binlog 是不能被拆开的<\/b>，因此无论这个事务有多大，也要保证一次性写入。<span class=\"mm-note\">这是因为有一个线程只能同时有一个事务在执行的设定，所以每当执行一个 begin/start transaction 的时候，就会默认提交上一个事务，这样如果一个事务的 binlog 被拆开的时候，在备库执行就会被当做多个事务分段自行，这样破坏了原子性，是有问题的。 MySQL 给<b>每个线程分配了一片内存<\/b>用于缓冲 binlog ，该内存叫 <b>binlog cache。<\/b> 在<b>事务提交的时候<\/b>，执行器<b>把 binlog cache 里的完整事务写入到 binlog 文件中<\/b>，并清空 binlog cache。 虽然每个线程有自己 binlog cache，但是<b>最终都写到同一个 binlog 文件。<\/b> ![img]<\/span>", "children": []}, {"id": "n73", "topic": "图中的 <b>write<\/b>，指的就是指<b>把日志写入到 binlog 文件<\/b>，但是<b>并没有把数据持久化到磁盘<\/b>，因为数据还缓存在文件系统的 <b>page cache<\/b> 里，write 的写入速度还是比较快的，因为不涉及磁盘 I/O。", "children": []}, {"id": "n74", "topic": "图中的 <b>fsync<\/b>，才是<b>将数据持久化到磁盘<\/b>的操作，这里就会涉及磁盘 I/O，所以频繁的 fsync 会导致磁盘的 I/O 升高。<span class=\"mm-note\">MySQL提供一个 <b>sync_binlog 参数<\/b>来<b>控制数据库的 binlog 刷到磁盘上的频率<\/b>：<\/span>", "children": []}, {"id": "n75", "topic": "sync_binlog = <b>0<\/b> 的时候，表示每次提交事务都<b>只 write，不 fsync<\/b>，后续交由操作系统决定何时将数据持久化到磁盘；=》默认设置", "children": []}, {"id": "n76", "topic": "sync_binlog = <b>1<\/b> 的时候，表示<b>每次提交事务都会 write，然后马上执行 fsync<\/b>；", "children": []}, {"id": "n77", "topic": "sync_binlog =<b>N(N&gt;1)<\/b> 的时候，表示<b>每次提交事务都 write，但累积 N 个事务后才 fsync<\/b>。<span class=\"mm-note\">在MySQL中系统默认的设置是 sync_binlog = 0，也就是不做任何强制性的磁盘刷新指令，这时候的性能是最好的，但是风险也是最大的。因为一旦主机发生异常重启，还没持久化到磁盘的数*-据就会丢失。 而当 sync_binlog 设置为 1 的时候，是最安全但是性能损耗最大的设置。因为当设置为 1 的时候，即使主机发生异常重启，最多丢失一个事务的 binlog，而已经持久化到磁盘的数据就不会有影响，不过就是<b>对写入性能影响太大<\/b>。 如果能容少量事务的 binlog 日志丢失的风险，为了提高写入的性能，一般会 sync_binlog 设置为 100~1000 中的某个数值。<\/span>", "children": []}]}, {"id": "n78", "topic": "<b>7.为什么需要两阶段提交？<\/b><span class=\"mm-note\">总结：<b>为了避免出现两份日志之间的逻辑不一致的问题。<\/b> 事务提交后，<b>redo log 和 binlog 都要持久化到磁盘<\/b>，但是这两个是独立的逻辑，可能出现半成功的状态，这样就造成两份日志之间的逻辑不一致。 即以下两种情况：<\/span>", "children": [{"id": "n79", "topic": "<b>在将 redo log 刷入到磁盘之后， MySQL 突然宕机了，而 binlog 还没有来得及写入<\/b>。", "children": []}, {"id": "n80", "topic": "<b>在将 binlog 刷入到磁盘之后， MySQL 突然宕机了，而 redo log 还没有来得及写入。<\/b><span class=\"mm-note\">在持久化 redo log 和 binlog 这两份日志的时候，如果出现半成功的状态，就会<b>造成主从环境的数据不一致性<\/b>。这是因为 <b>redo log 影响主库的数据，binlog 影响从库的数据<\/b>，所以 redo log 和 binlog 必须保持一致才能保证主从数据一致。 <b>MySQL 为了避免出现两份日志之间的逻辑不一致的问题，使用了「两阶段提交」来解决<\/b>，两阶段提交其实是分布式事务一致性协议，它可以保证多个逻辑操作要不全部成功，要不全部失败，不会出现半成功的状态。 <b>两阶段提交把单个事务的提交拆分成了 2 个阶段，分别是「准备（Prepare）阶段」和「提交（Commit）阶段」<\/b>，每个阶段都由**协调者（C<\/span>", "children": []}, {"id": "n81", "topic": "<b>准备阶段<\/b>：裁判（协调者）会依次询问两位拳击手（参与者）是否准备好了，然后拳击手听到后做出应答，如果觉得自己准备好了，就会跟裁判说准备好了；如果没有自己还没有准备好（比如拳套还没有带好），就会跟裁判说还没准备好。", "children": []}, {"id": "n82", "topic": "<b>提交阶段<\/b>：如果两位拳击手（参与者）都回答准备好了，裁判（协调者）宣布比赛正式开始，两位拳击手就可以直接开打；如果任何一位拳击手（参与者）回答没有准备好，裁判（协调者）会宣布比赛暂停，对应事务中的回滚操作", "children": []}, {"id": "n83", "topic": "<b>两阶段提交的过程是怎样的？<\/b><span class=\"mm-note\">在 MySQL 的 InnoDB 存储引擎中，开启 binlog 的情况下，MySQL 会同时维护 binlog 日志与 InnoDB 的 redo log，为了保证这两个日志的一致性，MySQL 使用了<b>内部 XA 事务。<\/b> 内部 XA 事务由： <b>binlog 作为协调者<\/b>，<b>存储引擎是参与者<\/b>。 当客户端执行 commit 语句或者在自动提交的情况下，MySQL 内部开启一个 XA 事务，<b>分两阶段来完成 XA 事务的提交<\/b>，如下图： <img class=\"mm-img\" src=\"fl-cfa5f14d6e9cd4.jpg\" style=\"width:320px;height:213px\" loading=\"lazy\" decoding=\"async\"> 从图中可看出，事务的提交过程有两个阶段，就是**将 redo log 的写入拆成了两个步骤：prepare 和 com<\/span>", "children": [{"id": "n84", "topic": "<b>prepare 阶段<\/b>：将 XID（内部 XA 事务的 ID） 写入到 redo log，同时将 redo log 对应的事务状态设置为 prepare，然后将 redo log 持久化到磁盘（innodb_flush_log_at_trx_commit = 1 的作用）；", "children": []}, {"id": "n85", "topic": "<b>commit 阶段<\/b>：把 XID 写入到 binlog，然后将 binlog 持久化到磁盘（sync_binlog = 1 的作用），接着调用引擎的提交事务接口，将 redo log 状态设置为 commit，此时该状态并不需要持久化到磁盘，只需要 write 到文件系统的 page cache 中就够了，因为只要 binlog 写磁盘成功，就算 redo log 的状态还是 prepare 也没有关系，一样会被认为事务已经执行成功；", "children": []}]}, {"id": "n86", "topic": "<b>两阶段提交有什么问题？<\/b><span class=\"mm-note\">两阶段提交虽然保证了两个日志文件的数据一致性，但是<b>性能很差<\/b>，主要有两个方面的影响：<\/span>", "children": [{"id": "n87", "topic": "<b>磁盘 I/O 次数高<\/b>：对于“双1”配置，每个事务提交都会进行两次 fsync（刷盘），一次是 redo log 刷盘，另一次是 binlog 刷盘。<span class=\"mm-note\">Q1：<b>为什么两阶段提交的磁盘 I/O 次数会很高<\/b>？ binlog 和 redo log 在内存中都对应的缓存空间，binlog 会缓存在 binlog cache，redo log 会缓存在 redo log buffer，它们持久化到磁盘的时机分别由下面这两个参数控制。一般我们为了避免日志丢失的风险，会将这两个参数设置为 1：<\/span>", "children": [{"id": "n88", "topic": "当 sync_binlog = 1 的时候，表示每次提交事务都会将 binlog cache 里的 binlog 直接持久到磁盘；", "children": []}, {"id": "n89", "topic": "当 innodb_flush_log_at_trx_commit = 1 时，表示每次事务提交时，都将缓存在 redo log buffer 里的 redo log 直接持久化到磁盘；<span class=\"mm-note\">可以看到，如果 sync_binlog 和 当 innodb_flush_log_at_trx_commit 都设置为 1，那么在每个事务提交过程中， 都会<b>至少调用 2 次刷盘操作<\/b>，一次是 redo log 刷盘，一次是 binlog 落盘，所以这会成为性能瓶颈。<\/span>", "children": []}]}, {"id": "n90", "topic": "<b>锁竞争激烈<\/b>：两阶段提交虽然能够保证「单事务」两个日志的内容一致，但在「多事务」的情况下，却不能保证两者的提交顺序一致，因此，在两阶段提交的流程基础上，还需要加一个锁来保证提交的原子性，从而保证多事务的情况下，两个日志的提交顺序一致。<span class=\"mm-note\">Q1：<b>为什么锁竞争激烈？<\/b> 在早期的 MySQL 版本中，通过使用 prepare_commit_mutex 锁来保证事务提交的顺序，在一个事务获取到锁时才能进入 prepare 阶段，一直到 commit 阶段结束才能释放锁，下个事务才可以继续进行 prepare 操作。 通过加锁虽然完美地解决了顺序一致性的问题，但在并发量较大的时候，就会导致对锁的争用，性能不佳。<\/span>", "children": []}]}]}, {"id": "n91", "topic": "<b>8.MySQL 磁盘 I/O 很高，有什么优化的方法？<\/b><span class=\"mm-note\">现在我们知道事务在提交的时候，需要将 binlog 和 redo log 持久化到磁盘，那么如果出现 MySQL 磁盘 I/O 很高的现象，我们可以通过<b>控制以下参数<\/b>，来 <b>“延迟” binlog 和 redo log 刷盘的时机，从而降低磁盘 I/O 的频率<\/b>：<\/span>", "children": [{"id": "n92", "topic": "设置组提交的两个参数： binlog_group_commit_sync_delay 和 binlog_group_commit_sync_no_delay_count 参数，延迟 binlog 刷盘的时机，从而减少 binlog 的刷盘次数。这个方法是基于“额外的故意等待”来实现的，因此可能会增加语句的响应时间，但即使 MySQL 进程中途挂了，也没有丢失数据的风险，因为 binlog 早被写入到 page cache 了，只要系统没有宕机，缓存在 page cache 里的 binlog 就会被持久化到磁盘。", "children": []}, {"id": "n93", "topic": "<b>将 sync_binlog 设置为大于 1 的值<\/b>（比较常见是 100~1000），表示每次提交事务都 write，但累积 N 个事务后才 fsync，相当于延迟了 binlog 刷盘的时机。但是这样做的风险是，主机掉电时会丢 N 个事务的 binlog 日志。", "children": []}, {"id": "n94", "topic": "<b>将 innodb_flush_log_at_trx_commit 设置为 2<\/b>。表示每次事务提交时，都只是缓存在 redo log buffer 里的 redo log 写到 redo log 文件，注意写入到「 redo log 文件」并不意味着写入到了磁盘，因为操作系统的文件系统中有个 Page Cache，专门用来缓存文件数据的，所以写入「 redo log文件」意味着写入到了操作系统的文件缓存，然后交由操作系统控制持久化到磁盘的时机。但是这样做的风险是，主机掉电的时候会丢数据。", "children": []}]}, {"id": "n95", "topic": "<b>9.具体更新一条记录的流程如下：<\/b><span class=\"mm-note\"><code>UPDATE t_user SET name = &#x27;xiaolin&#x27; WHERE id = 1;<\/code><\/span>", "children": [{"id": "n96", "topic": "执行器负责具体执行，会调用存储引擎的接口，<b>通过主键索引树搜索获取 id = 1<\/b> 这一行记录：", "children": [{"id": "n97", "topic": "如果 id=1 这一行所在的数据页本来就在 buffer pool 中，就直接返回给执行器更新；", "children": []}, {"id": "n98", "topic": "如果记录不在 buffer pool，将数据页从磁盘读入到 buffer pool，返回记录给执行器。", "children": []}]}, {"id": "n99", "topic": "执行器得到聚簇索引记录后，<b>会看一下更新前的记录和更新后的记录是否一样<\/b>：", "children": [{"id": "n100", "topic": "如果一样的话就不进行后续更新流程；", "children": []}, {"id": "n101", "topic": "如果不一样的话就把更新前的记录和更新后的记录都当作参数传给 InnoDB 层，让 InnoDB 真正的执行更新记录的操作；", "children": []}]}, {"id": "n102", "topic": "<b>开启事务， InnoDB 层更新记录前，首先要记录相应的 undo log<\/b>，因为这是更新操作，需要把被更新的列的旧值记下来，也就是要生成一条 undo log，undo log 会写入 Buffer Pool 中的 Undo 页面，不过在内存修改该 Undo 页面后，需要记录对应的 redo log。", "children": []}, {"id": "n103", "topic": "InnoDB 层<b>开始更新记录，会先更新内存（同时标记为脏页），然后将记录写到 redo log 里面<\/b>，这个时候更新就算完成了。为了减少磁盘I/O，不会立即将脏页写入磁盘，后续由后台线程选择一个合适的时机将脏页写入到磁盘。这就是 <b>WAL 技术<\/b>，MySQL 的写操作并不是立刻写到磁盘上，而是先写 redo 日志，然后在合适的时间再将修改的行数据写到磁盘上。", "children": []}, {"id": "n104", "topic": "至此，一条记录更新完了。", "children": []}, {"id": "n105", "topic": "在一条更新语句执行完成后，然后<b>开始记录该语句对应的 binlog，此时记录的 binlog 会被保存到 binlog cache，<\/b>并没有刷新到硬盘上的 binlog 文件，在事务提交时才会统一将该事务运行过程中的所有 binlog 刷新到硬盘。", "children": []}, {"id": "n106", "topic": "事务提交（为了方便说明，这里不说组提交的过程，只说两阶段提交）：", "children": [{"id": "n107", "topic": "<b>prepare 阶段<\/b>：将 redo log 对应的事务状态设置为 prepare，然后将 redo log 刷新到硬盘；", "children": []}, {"id": "n108", "topic": "<b>commit 阶段<\/b>：将 binlog 刷新到磁盘，接着调用引擎的提交事务接口，将 redo log 状态设置为 commit（将事务设置为 commit 状态后，刷入到磁盘 redo log 文件）；", "children": []}]}, {"id": "n109", "topic": "至此，一条更新语句执行完成。", "children": []}]}, {"id": "n110", "topic": "<b>10.慢查询日志(slow query log)<\/b>", "children": [{"id": "n111", "topic": "<b>1.慢查询日志的作用：<\/b><span class=\"mm-note\"><img class=\"mm-img\" src=\"fl-8aed8636e2789b.jpg\" style=\"width:320px;height:68px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": [{"id": "n112", "topic": "<b>查看慢查询日志是否开启<\/b>：<span class=\"mm-note\"><img class=\"mm-img\" src=\"fl-d26816f0290ecc.jpg\" style=\"width:320px;height:126px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}, {"id": "n113", "topic": "<b>开启慢查询日志<\/b>：", "children": []}, {"id": "n114", "topic": "<b>查看并更改long_query_time:<\/b><span class=\"mm-note\"><img class=\"mm-img\" src=\"fl-b211e39aba18c7.jpg\" style=\"width:320px;height:212px\" loading=\"lazy\" decoding=\"async\"> <img class=\"mm-img\" src=\"fl-ac84dba3445747.jpg\" style=\"width:320px;height:29px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}]}, {"id": "n115", "topic": "<b>2.如何查询当前慢查询语句的个数？<\/b><span class=\"mm-note\">MYSQL中专门有一个变量记录当前慢查询语句的个数：<b>Slow_queries<\/b> <img class=\"mm-img\" src=\"fl-7454f93717b631.jpg\" style=\"width:320px;height:123px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}, {"id": "n116", "topic": "<b>3.如何优化慢SQL？<\/b><span class=\"mm-note\"><b>EXPLAIN命令+慢查询日志、<\/b> <img class=\"mm-img\" src=\"fl-29270e1a2f751c.jpg\" style=\"width:320px;height:135px\" loading=\"lazy\" decoding=\"async\"> 具体优化看如下文章：密码cnk4 <a href=\"https://www.yuque.com/snailclimb/mf2z3k/abc2sv\" target=\"_blank\" rel=\"noopener\">https://www.yuque.com/snailclimb/mf2z3k/abc2sv<\/a><\/span>", "children": []}, {"id": "n117", "topic": "<b>4.常见的MYSQL优化方法<\/b>", "children": [{"id": "n118", "topic": "<b>1.避免使用Select *<\/b><span class=\"mm-note\">原因：<\/span>", "children": [{"id": "n119", "topic": "<b>无法使用<\/b>MYSQL优化器<b>覆盖索引<\/b>的优化", "children": []}, {"id": "n120", "topic": "<b>无用字段<\/b>增加网络带宽资源消耗，<b>增加数据IO传输时间<\/b>", "children": []}, {"id": "n121", "topic": "<b>select&lt;字段列表&gt;<\/b>的方式，可以<b>减少表结构变更带来的影响<\/b>。", "children": []}]}, {"id": "n122", "topic": "<b>2.深度分页优化<\/b><span class=\"mm-note\">普通分页在数据量小时耗费的时间比较短。 但数据量变大时，普通的分页耗费的时间就比较长了。 这种查询<b>偏移量过大的场景<\/b>我们称为：<b>深度分页<\/b><\/span>", "children": [{"id": "n123", "topic": "<b>1.为何深度分页很慢？<\/b><span class=\"mm-note\"><b>深度分页SQL变慢原因有两个<\/b>：<\/span>", "children": [{"id": "n124", "topic": "limit语句会先扫描offset+n行，然后再丢弃掉前offset行，返回后n行数据。也就是说<code>limit 100000,10<\/code>，就会扫描100010行，而<code>limit 0,10<\/code>，只扫描10行。", "children": []}, {"id": "n125", "topic": "<code>limit 100000,10<\/code> <b>扫描更多的行数<\/b>，也意味着<b>回表<\/b>更多的次数。<span class=\"mm-note\">如下这条SQL语句，它不仅会读第1000000-1000010条数据，也是<b>会扫描前1000000条数据的<\/b>，那么<b>这么多条数据进行回表扫描<\/b>，时间耗费是很高的。<\/span>", "children": []}]}, {"id": "n126", "topic": "<b>2.优化思路与具体操作<\/b><span class=\"mm-note\">那么<b>如何优化<\/b>呢？<\/span>", "children": [{"id": "n127", "topic": "<b>核心思路<\/b>就是：<b>把查询条件转移到主键索引树<\/b>，<b>减少回表次数<\/b>。", "children": []}, {"id": "n128", "topic": "那<b>具体该怎么做<\/b>呢？转移到主键索引树查询的话，<b>查询条件得改为<code>主键id<\/code><\/b>", "children": []}, {"id": "n129", "topic": "<b>实操方法：<\/b>", "children": [{"id": "n130", "topic": "<b>子查询优化<\/b>：将<b>上述的SQL语句修改为子查询<\/b>。<span class=\"mm-note\">分析：<b>先查出limit第一个参数对应的主键值<\/b>，再<b>根据这个主键值去过滤并limit取出数据<\/b>。首先在索引上拿到了聚集索引的主键ID,省去了回表操作，然后第二查询直接根据第一个查询的 ID往后再去查10个就可以了! <b>缺点：<\/b><\/span>", "children": [{"id": "n131", "topic": "但是，<b>子查询结果会产生一张新的临时表<\/b>，会影响性能，应尽量避免大量使用子查询。", "children": []}, {"id": "n132", "topic": "并且这种方法<b>只适合id为正序<\/b>。", "children": []}]}, {"id": "n133", "topic": "<b>INNER JOIN 延迟关联<\/b>：<span class=\"mm-note\">跟子查询的<b>优化思路其实是一样<\/b>的：都是把条件转移到主键索引树，然后减少回表。不同点是，<b>延迟关联使用了inner join代替子查询<\/b>。 查询思路：<b>先通过二级索引树查询到满足条件的主键ID<\/b>，再<b>与原表通过主键ID内连接<\/b>，这样<b>后面直接走了主键索引<\/b>了，同时也减少了回表。<\/span>", "children": []}]}]}]}, {"id": "n134", "topic": "<b>3.尽量避免多表做Join<\/b><span class=\"mm-note\">其实最主要的原因就是<b>join的效率比较低<\/b>。 MySQL是使用了<b>嵌套循环<\/b>（Nested-Loop Join）的方式来<b>实现关联查询<\/b>的，简单点说就是要通过两层循环，用第一张表做外循环，第二张表做内循环，外循环的每一条记录跟内循环中的记录作比较，符合条件的就输出。<\/span>", "children": []}, {"id": "n135", "topic": "<b>4.选择合适的字段<\/b>", "children": [{"id": "n136", "topic": "<b>非负型数据(自增id,IP地址、年龄)<\/b>，优先使用<b>无符号整型存储<\/b><span class=\"mm-note\">无符号相对于有符号，多出一倍的存储空间。<\/span>", "children": []}, {"id": "n137", "topic": "<b>小数值类型(<\/b>年龄、boolean),优先<b>tinyint<\/b>", "children": []}, {"id": "n138", "topic": "<b>日期类型<\/b>，<b>一定不要用字符串<\/b>，用：DateTime、TimeStamp", "children": []}, {"id": "n139", "topic": "<b>金额<\/b>用decimal", "children": []}, {"id": "n140", "topic": "<b>不用NULL作为列默认值<\/b><span class=\"mm-note\"><img class=\"mm-img\" src=\"fl-b8080ebe4a9360.jpg\" style=\"width:320px;height:130px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}]}, {"id": "n141", "topic": "<b>5.尽量使用批量操作<\/b><span class=\"mm-note\">尽量批量插入等，而不是一条条插入。 好处：<b>减少请求数据库的次数<\/b>，提高性能。 <img class=\"mm-img\" src=\"fl-2e18236f5a751e.jpg\" style=\"width:320px;height:66px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": []}, {"id": "n142", "topic": "<b>6.正确使用索引<\/b><span class=\"mm-note\">见索引篇<\/span>", "children": []}]}, {"id": "n143", "topic": "<b>5.MYSQL表数据太多如何优化？<\/b>", "children": []}, {"id": "n144", "topic": "<b>6.如何分区分表<\/b><span class=\"mm-note\">分区分表是一种数据库水平拆分的策略，用于解决单表数据量过大、性能下降的问题。 在分区分表的方案中，数据会被分散存储到多个表或多个分区中，从而降低了单个表的数据量，提高了数据库的性能和可扩展性。 通常，分区分表可以通过以下几种方式实现：<\/span>", "children": [{"id": "n145", "topic": "<b>按时间分区<\/b>：", "children": [{"id": "n146", "topic": "将数据按时间范围进行分区，例如按月份、按年份等。这种方式适合于需要定期归档历史数据的场景，可以在查询时只查询特定时间范围内的数据表，减少了需要扫描的数据量。", "children": []}]}, {"id": "n147", "topic": "<b>按地理位置分区<\/b>：", "children": [{"id": "n148", "topic": "将数据按地理位置进行分区，例如按国家、按省份、按城市等。这种方式适合于具有地理属性的数据，可以根据用户的地理位置快速定位到对应的数据表，提高了查询效率。", "children": []}]}, {"id": "n149", "topic": "<b>按业务分区<\/b>：", "children": [{"id": "n150", "topic": "将数据按业务特性进行分区，例如按产品类型、按用户类型等。这种方式适合于具有明显业务分类的场景，可以根据业务特性将数据存储到不同的数据表中，提高了查询效率。", "children": []}]}, {"id": "n151", "topic": "<b>按哈希值分区<\/b>：", "children": [{"id": "n152", "topic": "将数据按哈希算法进行分区，例如取数据的某个字段的哈希值作为分区依据。这种方式可以将数据均匀地分散到多个数据表中，避免了单一数据表的数据热点问题。", "children": []}]}, {"id": "n153", "topic": "<b>按数据量分区<\/b>：", "children": [{"id": "n154", "topic": "将数据按数据量大小进行分区，例如按数据的前缀或者后缀进行分区。这种方式可以将数据平均地分布到多个数据表中，避免了单表数据量过大的问题。", "children": []}]}]}]}], "expanded": true}}</script>
<script>
(function(){
  var ME = window.MindElixir && (window.MindElixir.default || window.MindElixir);
  var raw = JSON.parse(document.getElementById('data').textContent);
  var data = raw.data, title = raw.title;
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  var mind = new ME({
    el: '#mindex',
    direction: 1,
    editable: false,
    contextMenu: false,
    toolBar: false,
    keypress: false,
    allowUndo: false,
    scaleMin: 0.2,
    scaleMax: 2.4,
    markdown: function(t){ return t; },
    theme: {
      name: 'MubuPaper',
      palette: ['#0e7a52','#1d4ed8','#c2410c','#7c3aed','#b45309','#0f766e','#be123c','#4d7c0f'],
      cssVar: {}
    }
  });
  mind.init({ nodeData: data, direction: 1 });
  // ---- 自由平移：mind-elixir 自带 move() 会把容器中心限制在内容范围内，
  //      手机上表现为「拖到边界就卡住」。这里改成无边界平移。 ----
  var canvas = mind.map;
  var mapEl = document.getElementById('mindex');
  function xyOf(tr){
    var m = /translate3d\((-?[\d.]+)px,\s*(-?[\d.]+)px/.exec(tr || '');
    return { x: m ? parseFloat(m[1]) : 0, y: m ? parseFloat(m[2]) : 0 };
  }
  function applyT(x, y, s){
    canvas.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) scale(' + s + ')';
  }
  // mind-elixir 的 transform-origin 在根节点 X + 画布 50% Y，缩放/居中必须带上它
  function originPx(){
    var o = (canvas.style.transformOrigin || '50% 50%').split(' ');
    function px(v, total){
      if (!v) return total / 2;
      if (v.indexOf('%') > 0) return parseFloat(v) / 100 * total;
      return parseFloat(v) || 0;
    }
    return { x: px(o[0], canvas.offsetWidth), y: px(o[1], canvas.offsetHeight) };
  }
  function contentOf(vx, vy){
    var o = originPx(), p = xyOf(canvas.style.transform), s = mind.scaleVal || 1;
    return { x: o.x + (vx - p.x - o.x) / s, y: o.y + (vy - p.y - o.y) / s };
  }
  mind.move = function(dx, dy){
    var p = xyOf(canvas.style.transform);
    applyT(p.x + dx, p.y + dy, mind.scaleVal);
    return true;
  };

  var userTouched = false;
  // 首屏：保持可读比例，对准根节点；图片加载会改变高度，多点校正几次
  function focusRoot(force){
    var _d = document.getElementById('doc');
    if (_d && _d.classList.contains('on')) return;
    if (userTouched && !force) return;
    var s = window.innerWidth < 520 ? 0.9 : 1;
    try {
      var el = mind.findEle(data.id) || document.querySelector('me-root');
      if (!el) return;
      var c = mind.container.getBoundingClientRect();
      var r = el.getBoundingClientRect();
      var pt = contentOf(r.left + r.width / 2 - c.left, r.top + r.height / 2 - c.top);
      var o = originPx();
      var nx = c.width / 2 - o.x - (pt.x - o.x) * s;
      var ny = c.height / 2 - o.y - (pt.y - o.y) * s;
      mind.scaleVal = s;
      applyT(nx, ny, s);
    } catch(e){}
  }
  setTimeout(focusRoot, 80);
  setTimeout(focusRoot, 500);
  setTimeout(focusRoot, 1500);
  window.addEventListener('resize', function(){ setTimeout(focusRoot, 120); });
  ['pointerdown','wheel'].forEach(function(ev){
    mapEl.addEventListener(ev, function(){ userTouched = true; }, {passive:true});
  });

  // ---- 以双指中点为锚缩放（自带 scale() 的偏移算法在 WebView 里会跳） ----
  function zoomAt(newS, cx, cy){
    newS = Math.max(0.2, Math.min(2.4, newS));
    var c = mind.container.getBoundingClientRect();
    var p = xyOf(canvas.style.transform);
    var k = newS / mind.scaleVal;
    var o = originPx();
    var x = cx - c.left, y = cy - c.top;
    applyT(x - o.x - (x - p.x - o.x) * k, y - o.y - (y - p.y - o.y) * k, newS);
    mind.scaleVal = newS;
  }

  // 返回：优先浏览器返回，直接打开时回 App 知识页
  document.getElementById('back').onclick = function(){
    if (history.length > 1 && document.referrer) { history.back(); }
    else { location.href = '/app/#kb'; }
  };
  document.getElementById('fit').onclick = function(){ mind.scaleFit(); };

  // 折叠 / 展开（数据级操作，保留原折叠状态）
  function setExpand(minDepth, open){
    var d = clone(data);
    (function walk(n, depth){
      if (depth >= minDepth && (n.children||[]).length) n.expanded = open;
      (n.children||[]).forEach(function(c){ walk(c, depth+1); });
    })(d, 0);
    mind.refresh({ nodeData: d, direction: 1 });
    setTimeout(function(){ focusRoot(true); }, 80);
  }
  var acts = document.querySelector('.acts');
  var bFold = document.createElement('button'); bFold.textContent = '收起'; bFold.onclick = function(){ setExpand(2, false); };
  var bOpen = document.createElement('button'); bOpen.textContent = '展开'; bOpen.onclick = function(){ setExpand(0, true); };
  acts.insertBefore(bFold, document.getElementById('fit'));
  acts.insertBefore(bOpen, document.getElementById('fit'));

  // 搜索
  var qbar = document.getElementById('qbar'), q = document.getElementById('q'),
      qres = document.getElementById('qres'), hits = [], idx = -1, last = '';
  document.getElementById('qbtn').onclick = function(){
    if (isDocView) {
      var db = document.getElementById('dbar');
      db.hidden = !db.hidden;
      if (!db.hidden) document.getElementById('dq').focus();
      return;
    }
    qbar.hidden = !qbar.hidden;
    if (!qbar.hidden) { q.focus(); }
  };
  document.getElementById('qclose').onclick = function(){ qbar.hidden = true; clearHit(); };

  function textOf(html){
    var d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function collect(){
    var arr = [];
    (function walk(n, path){
      arr.push({ id: n.id, text: textOf(n.topic).toLowerCase(), path: path.concat(n.id) });
      (n.children||[]).forEach(function(c){ walk(c, path.concat(n.id)); });
    })(data, []);
    return arr;
  }
  var ALL = collect();
  function clearHit(){
    document.querySelectorAll('.me-hit').forEach(function(e){ e.classList.remove('me-hit'); });
  }
  function jump(i){
    if (!hits.length) return;
    idx = (i + hits.length) % hits.length;
    clearHit();
    var hit = hits[idx];
    var d = clone(data);
    (function walk(n){
      if (hit.path.indexOf(n.id) >= 0) n.expanded = true;
      (n.children||[]).forEach(walk);
    })(d);
    mind.refresh({ nodeData: d, direction: 1 });
    setTimeout(function(){
      try {
        var el = mind.findEle(hit.id);
        if (el) {
          mind.scrollIntoView(el, true);
          var t = el.querySelector('me-tpc') || el;
          t.classList.add('me-hit');
        }
      } catch(e) {}
      qres.textContent = (idx + 1) + '/' + hits.length;
    }, 40);
  }
  function search(){
    var kw = q.value.trim().toLowerCase();
    if (!kw) { hits = []; idx = -1; qres.textContent = ''; clearHit(); return; }
    if (kw !== last) { last = kw; hits = ALL.filter(function(n){ return n.text.indexOf(kw) >= 0; }); idx = -1; }
    qres.textContent = hits.length ? ('0/' + hits.length) : '无结果';
    if (hits.length) jump(0);
  }
  q.addEventListener('input', function(){ last = ''; search(); });
  q.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); search(); } });
  document.getElementById('qnext').onclick = function(){ if (hits.length) jump(idx + 1); };
  document.getElementById('qprev').onclick = function(){ if (hits.length) jump(idx - 1); };

  // 触摸手势：完全用 touch 事件接管（部分 App WebView 不派发 PointerEvent，
  // 会导致「双指能缩放、单指拖不动」，这里统一走 touch，兼容性最好）
  var pinch = null, drag = null;
  function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
  mapEl.addEventListener('touchstart', function(e){
    userTouched = true;
    if (e.touches.length === 2) {
      drag = null;
      pinch = { d: dist(e.touches), s: mind.scaleVal,
                x: (e.touches[0].clientX+e.touches[1].clientX)/2,
                y: (e.touches[0].clientY+e.touches[1].clientY)/2 };
      // 清掉 mind-elixir 的单指拖拽状态，避免双指时画面被它带着跳
      try { mind.panHelper && mind.panHelper.clear(); } catch(err){}
    } else if (e.touches.length === 1) {
      drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, started: false };
    }
  }, {passive:true});
  mapEl.addEventListener('touchmove', function(e){
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      var mx = (e.touches[0].clientX+e.touches[1].clientX)/2;
      var my = (e.touches[0].clientY+e.touches[1].clientY)/2;
      zoomAt(pinch.s * (dist(e.touches) / pinch.d), mx, my);
    } else if (drag && e.touches.length === 1) {
      var t = e.touches[0];
      var dx = t.clientX - drag.x, dy = t.clientY - drag.y;
      if (!drag.started) {
        if (Math.sqrt(dx*dx + dy*dy) < 6) return;
        drag.started = true;
      }
      e.preventDefault();
      mind.move(dx, dy);
      drag.x = t.clientX;
      drag.y = t.clientY;
    }
  }, {passive:false});
  mapEl.addEventListener('touchend', function(e){
    if (e.touches.length === 0) drag = null;
    if (e.touches.length < 2) pinch = null;
  }, {passive:true});
  // 屏蔽触摸产生的 pointer 事件，避免新旧两套平移同时生效（会双倍速/打架）
  ['pointerdown','pointermove','pointerup','pointercancel'].forEach(function(ev){
    mapEl.addEventListener(ev, function(e){
      if (e.pointerType === 'touch') e.stopPropagation();
    }, true);
  });

  // ---- 图片放大：双击节点图片 → 全屏灯箱（带惯性、动画、手势锚点） ----
  var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'),
      lbstage = document.getElementById('lbstage'), lbname = document.getElementById('lbname');
  var lbt = { s: 1, x: 0, y: 0 }, lbFit = 1, lbW = 1, lbH = 1;
  var lbAnim = 0, lbPending = 0, lbClosing = 0;
  var lbRect = { left: 0, top: 0, width: 1, height: 1 };
  function lbMeasure(){
    var r = lbstage.getBoundingClientRect();
    lbRect = { left: r.left, top: r.top, width: r.width, height: r.height };
  }

  function lbDraw(){
    lbimg.style.transform = 'translate3d(' + lbt.x + 'px,' + lbt.y + 'px,0) scale(' + lbt.s + ')';
  }
  function lbApply(){
    if (lbPending) return;
    lbPending = requestAnimationFrame(function(){ lbPending = 0; lbDraw(); });
  }
  function lbStopAnim(){
    if (lbAnim) { cancelAnimationFrame(lbAnim); lbAnim = 0; }
  }
  function lbClamp(){
    var r = lbRect;
    var w = lbW * lbt.s, h = lbH * lbt.s, pad = 72;
    lbt.x = Math.min(r.width - pad, Math.max(pad - w, lbt.x));
    lbt.y = Math.min(r.height - pad, Math.max(pad - h, lbt.y));
  }
  function lbAnimateTo(t, dur){
    lbStopAnim();
    var f = { s: lbt.s, x: lbt.x, y: lbt.y }, t0 = performance.now();
    function step(now){
      var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      lbt.s = f.s + (t.s - f.s) * e;
      lbt.x = f.x + (t.x - f.x) * e;
      lbt.y = f.y + (t.y - f.y) * e;
      lbDraw();
      if (p < 1) lbAnim = requestAnimationFrame(step); else lbAnim = 0;
    }
    lbAnim = requestAnimationFrame(step);
  }
  function lbFitTarget(){
    var r = lbRect;
    lbW = lbimg.naturalWidth || 1; lbH = lbimg.naturalHeight || 1;
    lbFit = Math.min(r.width / lbW, r.height / lbH) * 0.96;
    return { s: lbFit, x: (r.width - lbW * lbFit) / 2, y: (r.height - lbH * lbFit) / 2 };
  }
  function lbZoomAt(ns, px, py, animate){
    ns = Math.max(lbFit * 0.4, Math.min(lbFit * 10, ns));
    var k = ns / lbt.s;
    var t = { s: ns, x: px - (px - lbt.x) * k, y: py - (py - lbt.y) * k };
    if (animate) lbAnimateTo(t, 180);
    else { lbt = t; lbApply(); }
  }
  function lbOpen(src, name, fromRect){
    lbStopAnim();
    lbimg.src = src;
    lbname.textContent = name || '';
    lb.hidden = false;
    lbClosing = 0;
    document.body.style.overflow = 'hidden';
    lbMeasure();
    requestAnimationFrame(function(){ lb.classList.add('on'); });
    function start(){
      var fit = lbFitTarget(), r = lbstage.getBoundingClientRect();
      if (fromRect && fromRect.width > 8) {
        var s0 = fromRect.width / lbW;
        lbt = { s: s0, x: fromRect.left - r.left, y: fromRect.top - r.top };
        lbDraw();
        lbAnimateTo(fit, 260);
      } else {
        lbt = fit; lbDraw();
      }
    }
    if (lbimg.complete && lbimg.naturalWidth) start();
    else lbimg.onload = start;
  }
  function lbClose(){
    if (lbClosing) return;
    clearTimeout(lbTapTimer); lbTapTimer = 0; lbLastTap = 0;
    lbClosing = 1;
    lbStopAnim();
    lb.classList.remove('on');
    setTimeout(function(){
      lb.hidden = true;
      lbimg.removeAttribute('src');
      document.body.style.overflow = '';
      lbClosing = 0;
    }, 170);
  }
  document.getElementById('lbclose').onclick = lbClose;
  document.getElementById('lbfit').onclick = function(){ lbAnimateTo(lbFitTarget(), 240); };
  document.getElementById('lb1x').onclick = function(){
    lbZoomAt(1, lbRect.width / 2, lbRect.height / 2, true);
  };
  /* 单击图片 = 关闭；双击 = 缩放（2026-11-24 用户反馈：单击打开后无法返回） */
  var lbTapTimer = 0, lbLastTap = 0, lbLastX = 0, lbLastY = 0, lbTouchAt = 0;
  function lbZoomToggle(x, y){
    var nearFit = Math.abs(lbt.s - lbFit) < lbFit * 0.08;
    lbZoomAt(nearFit ? lbFit * 2.5 : lbFit, x - lbRect.left, y - lbRect.top, true);
  }
  function lbTap(x, y){
    var now = Date.now();
    if (now - lbLastTap < 300 && Math.abs(x - lbLastX) < 32 && Math.abs(y - lbLastY) < 32) {
      clearTimeout(lbTapTimer); lbTapTimer = 0; lbLastTap = 0;
      lbZoomToggle(x, y);
      return;
    }
    lbLastTap = now; lbLastX = x; lbLastY = y;
    clearTimeout(lbTapTimer);
    lbTapTimer = setTimeout(function(){ lbTapTimer = 0; lbClose(); }, 300);
  }
  lbstage.addEventListener('click', function(e){
    if (Date.now() - lbTouchAt < 700) return;   /* 触摸已处理，忽略合成 click */
    if (e.target && e.target.closest && e.target.closest('button')) return;
    lbTap(e.clientX, e.clientY);
  });
  lbstage.addEventListener('wheel', function(e){
    e.preventDefault();
    lbStopAnim();
    lbZoomAt(lbt.s * (e.deltaY < 0 ? 1.15 : 0.87), e.clientX - lbRect.left, e.clientY - lbRect.top, false);
  }, {passive:false});

  var lbDrag = null, lbPinch = null, lbMomentum = 0, lbTapStart = null;
  function lbStopMomentum(){ if (lbMomentum) { cancelAnimationFrame(lbMomentum); lbMomentum = 0; } }
  lbstage.addEventListener('touchstart', function(e){
    lbStopAnim(); lbStopMomentum();
    lbTouchAt = Date.now();
    if (e.touches.length === 1) {
      var t = e.touches[0];
      lbDrag = { x: t.clientX, y: t.clientY, lx: t.clientX, ly: t.clientY, lt: performance.now(), vx: 0, vy: 0 };
      lbPinch = null;
      lbTapStart = { x: t.clientX, y: t.clientY, t: Date.now(), moved: false };
    } else if (e.touches.length === 2) {
      lbDrag = null;
      lbPinch = { d: dist(e.touches), s: lbt.s };
      clearTimeout(lbTapTimer); lbTapTimer = 0;
      if (lbTapStart) lbTapStart.moved = true;
    }
  }, {passive:true});
  lbstage.addEventListener('touchmove', function(e){
    e.preventDefault();
    if (lbPinch && e.touches.length === 2) {
      var r = lbRect;
      var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
      var my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
      lbZoomAt(lbPinch.s * (dist(e.touches) / lbPinch.d), mx, my, false);
    } else if (lbDrag && e.touches.length === 1) {
      var t = e.touches[0], now = performance.now();
      var dx = t.clientX - lbDrag.x, dy = t.clientY - lbDrag.y;
      if (lbTapStart && !lbTapStart.moved &&
          Math.hypot(t.clientX - lbTapStart.x, t.clientY - lbTapStart.y) > 10) {
        lbTapStart.moved = true;
      }
      lbt.x += dx; lbt.y += dy;
      lbDrag.x = t.clientX; lbDrag.y = t.clientY;
      var dt = Math.max(1, now - lbDrag.lt);
      lbDrag.vx = (t.clientX - lbDrag.lx) / dt;
      lbDrag.vy = (t.clientY - lbDrag.ly) / dt;
      lbDrag.lx = t.clientX; lbDrag.ly = t.clientY; lbDrag.lt = now;
      lbApply();
    }
  }, {passive:false});
  lbstage.addEventListener('touchend', function(e){
    if (e.touches.length === 0) {
      var tap = lbTapStart;
      lbTapStart = null;
      if (lbDrag) {
        lbClamp();
        var speed = Math.hypot(lbDrag.vx, lbDrag.vy);
        if (speed > 0.25) {
          var vx = lbDrag.vx * 16, vy = lbDrag.vy * 16;
          (function fling(){
            vx *= 0.94; vy *= 0.94;
            lbt.x += vx; lbt.y += vy;
            var r = lbRect;
            var w = lbW * lbt.s, h = lbH * lbt.s, pad = 72;
            if (lbt.x > r.width - pad) { lbt.x = r.width - pad; vx = 0; }
            if (lbt.x < pad - w) { lbt.x = pad - w; vx = 0; }
            if (lbt.y > r.height - pad) { lbt.y = r.height - pad; vy = 0; }
            if (lbt.y < pad - h) { lbt.y = pad - h; vy = 0; }
            lbApply();
            if (Math.abs(vx) + Math.abs(vy) > 0.3) lbMomentum = requestAnimationFrame(fling);
            else lbMomentum = 0;
          })();
        }
      }
      lbDrag = null; lbPinch = null;
      if (tap && !tap.moved && Date.now() - tap.t < 500) {
        var tt = e.changedTouches[0];
        lbTap(tt.clientX, tt.clientY);
      }
    } else if (e.touches.length < 2) lbPinch = null;
  }, {passive:true});
  lb.addEventListener('click', function(e){ if (e.target === lb) lbClose(); });
  window.addEventListener('resize', function(){ if (!lb.hidden) { lbMeasure(); lbAnimateTo(lbFitTarget(), 180); } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !lb.hidden) lbClose(); });

  // 双击节点图片打开灯箱
  var lastTap = 0, lastX = 0, lastY = 0, lastSrc = '';
  function tapImage(el){
    var img = el && el.closest ? el.closest('.mm-img') : null;
    if (!img) return null;
    var host = img.closest('me-tpc');
    var name = host ? (host.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40) : '';
    return { src: img.getAttribute('src'), name: name, rect: img.getBoundingClientRect() };
  }
  mapEl.addEventListener('dblclick', function(e){
    var hit = tapImage(e.target);
    if (hit) { e.preventDefault(); e.stopPropagation(); lbOpen(hit.src, hit.name, hit.rect); }
  }, true);
  mapEl.addEventListener('touchend', function(e){
    if (e.touches.length) return;
    var hit = tapImage(e.target);
    if (!hit) return;
    var t = e.changedTouches[0], now = Date.now();
    if (now - lastTap < 330 && Math.abs(t.clientX - lastX) < 30 &&
        Math.abs(t.clientY - lastY) < 30 && lastSrc === hit.src) {
      lastTap = 0;
      lbOpen(hit.src, hit.name, hit.rect);
    } else {
      lastTap = now; lastX = t.clientX; lastY = t.clientY; lastSrc = hit.src;
    }
  }, true);

  // ---- 文档视图（与思维导图同源，可一键切换） ----
  var docEl = document.getElementById('doc'), docInner = document.getElementById('docInner');
  var viewBtn = document.getElementById('viewToggle');
  var docOpen = document.getElementById('docOpen'), docClose = document.getElementById('docClose');
  var mapElWrap = document.getElementById('map'), tipEl = document.querySelector('.tip');
  var tocBtn = document.getElementById('docTocBtn'), tocBox = document.getElementById('docToc'),
      tocMask = document.getElementById('docMask'), tocList = document.getElementById('docTocList');
  var docBuilt = false, isDocView = false, tocData = [], docHTML = '';

  function docNode(n, depth, ctr, toc){
    var kids = n.children || [];
    var id = 'dn' + (ctr.v++);
    var lv = Math.min(depth, 5);
    var head = '<span class="dt" id="' + id + '">' + (n.topic || '') + '</span>';
    var plain = '';
    if (depth <= 3 && kids.length) {
      var tmp = document.createElement('div'); tmp.innerHTML = n.topic || '';
      [].forEach.call(tmp.querySelectorAll('.mm-note, img, table'), function(e){ e.remove(); });
      plain = (tmp.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 56);
      if (plain) toc.push({ id: id, text: plain, lv: depth });
    }
    var dv = ' style="--d:' + depth + '"';
    if (!kids.length) return '<div class="dleaf lv' + lv + '"' + dv + '>' + head + '</div>';
    var inner = kids.map(function(c){ return docNode(c, depth + 1, ctr, toc); }).join('');
    return '<details open><summary class="lv' + lv + '"' + dv + '>' + head + '</summary>' + inner + '</details>';
  }
  function buildDoc(){
    var ctr = { v: 0 }; tocData = [];
    var html = '<div class="doc-root">' + (data.topic || title) + '</div>';
    html += (data.children || []).map(function(c){ return docNode(c, 1, ctr, tocData); }).join('');
    docHTML = html;
    docInner.innerHTML = html;
    tocList.innerHTML = tocData.map(function(t){
      return '<a class="toc-i t' + t.lv + '" href="#' + t.id + '">' + t.text + '</a>';
    }).join('') || '<p style="font-size:12px;color:#8a918c">本篇没有分级标题</p>';
  }
  function tocJump(id){
    var el = document.getElementById(id);
    if (!el) return;
    var p = el.parentElement;
    while (p && p !== docInner) {
      if (p.tagName === 'DETAILS') p.open = true;
      p = p.parentElement;
    }
    setTimeout(function(){ el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 30);
    tocBox.classList.remove('on'); tocMask.classList.remove('on');
  }
  tocList.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a.toc-i') : null;
    if (!a) return;
    e.preventDefault();
    tocJump(a.getAttribute('href').slice(1));
  });
  function openToc(){
    if (tocBox.classList.contains('on')) return;
    tocBox.classList.add('on'); tocMask.classList.add('on');
    if (!(history.state && history.state.toc)) history.pushState({ toc: 1 }, '');
  }
  function closeToc(){
    tocBox.classList.remove('on'); tocMask.classList.remove('on');
    if (history.state && history.state.toc) history.back();
  }
  tocBtn.onclick = openToc;
  tocMask.onclick = closeToc;
  var tocX = document.getElementById('docTocClose');
  if (tocX) tocX.onclick = closeToc;
  window.addEventListener('popstate', function(){
    if (tocBox.classList.contains('on')) {
      tocBox.classList.remove('on'); tocMask.classList.remove('on');
    }
  });
  var tocSx = null;
  tocBox.addEventListener('touchstart', function(e){ tocSx = e.touches[0].clientX; }, {passive:true});
  tocBox.addEventListener('touchmove', function(e){
    if (tocSx !== null && e.touches[0].clientX - tocSx > 55) { tocSx = null; closeToc(); }
  }, {passive:true});
  tocBox.addEventListener('touchend', function(){ tocSx = null; }, {passive:true});

  function setView(v){
    isDocView = v === 'doc';
    if (isDocView && !docBuilt) { buildDoc(); docBuilt = true; }
    docEl.classList.toggle('on', isDocView);
    mapElWrap.style.display = isDocView ? 'none' : '';
    tipEl.hidden = isDocView;
    tocBtn.classList.toggle('on', isDocView);
    if (!isDocView) { tocBox.classList.remove('on'); tocMask.classList.remove('on'); }
    viewBtn.textContent = isDocView ? '导图' : '文档';
    document.getElementById('qbtn').hidden = false;
    document.getElementById('fit').hidden = isDocView;
    bFold.hidden = isDocView;
    bOpen.hidden = isDocView;
    docOpen.hidden = !isDocView;
    docClose.hidden = !isDocView;
    if (isDocView) {
      var qb=document.getElementById('qbar'); if(qb) qb.hidden = true;
      document.getElementById('dbar').hidden = true;
    } else {
      document.getElementById('dbar').hidden = true;
      document.getElementById('dq').value = '';
      if (docBuilt) docClear();
      setTimeout(function(){ try { focusRoot(true); } catch(e){} }, 40);
    }
  }
  viewBtn.onclick = function(){ setView(isDocView ? 'map' : 'doc'); };
  docOpen.onclick = function(){ docInner.querySelectorAll('details').forEach(function(d){ d.open = true; }); };
  docClose.onclick = function(){
    var all = docInner.querySelectorAll('details');
    all.forEach(function(d, i){ d.open = i < 3; });
  };
  // 文档里单击图片 → 放大查看
  docEl.addEventListener('click', function(e){
    var img = e.target && e.target.tagName === 'IMG' ? e.target : null;
    if (!img) return;
    e.preventDefault(); e.stopPropagation();
    var host = img.closest('summary, .dleaf, details');
    var name = host ? (host.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40) : '';
    lbOpen(img.getAttribute('src'), name, img.getBoundingClientRect());
  }, true);
  // 文档内搜索
  var dq = document.getElementById('dq'), dqc = document.getElementById('dqc');
  var dHits = [], dIdx = -1;
  function docClear(){ docInner.innerHTML = docHTML; dHits = []; dIdx = -1; dqc.textContent = ''; }
  function docJump(i){
    if (!dHits.length) return;
    dIdx = (i + dHits.length) % dHits.length;
    dHits.forEach(function(m){ m.classList.remove('cur'); });
    var m = dHits[dIdx];
    m.classList.add('cur');
    var p = m.parentElement;
    while (p && p !== docInner) { if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement; }
    setTimeout(function(){ m.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 20);
    dqc.textContent = (dIdx + 1) + '/' + dHits.length;
  }
  function docSearch(){
    var kw = dq.value.trim().toLowerCase();
    if (!kw) { docClear(); return; }
    if (!docHTML) return;
    docInner.innerHTML = docHTML;
    dHits = []; dIdx = -1;
    var walker = document.createTreeWalker(docInner, NodeFilter.SHOW_TEXT, null), node;
    var nodes = [];
    while ((node = walker.nextNode())) nodes.push(node);
    nodes.forEach(function(nd){
      var text = nd.nodeValue || '';
      var low = text.toLowerCase();
      var idx = low.indexOf(kw), last = 0;
      if (idx < 0) return;
      var frag = document.createDocumentFragment();
      while (idx >= 0) {
        if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
        var m = document.createElement('mark');
        m.className = 'dhit';
        m.textContent = text.substr(idx, kw.length);
        frag.appendChild(m);
        last = idx + kw.length;
        idx = low.indexOf(kw, last);
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      nd.parentNode.replaceChild(frag, nd);
    });
    dHits = [].slice.call(docInner.querySelectorAll('mark.dhit'));
    dqc.textContent = dHits.length ? ('0/' + dHits.length) : '无结果';
    if (dHits.length) docJump(0);
  }
  dq.addEventListener('input', docSearch);
  dq.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); docJump(dIdx + 1); } });
  document.getElementById('dqprev').onclick = function(){ docJump(dIdx - 1); };
  document.getElementById('dqnext').onclick = function(){ docJump(dIdx + 1); };
  document.getElementById('dqclose').onclick = function(){ dq.value = ''; docClear(); dq.blur(); };

  // 默认进入文档视图
  setTimeout(function(){ setView('doc'); }, 80);

  // 超大图初始折叠，避免首屏卡顿
  var _total = (function c(n){ return 1 + (n.children || []).reduce(function(a, b){ return a + c(b); }, 0); })(data);
  if (_total > 500) {
    setTimeout(function(){
      setExpand(2, false);
      tipEl.textContent = '节点较多，已折叠到 2 层 · 点「展开」查看全部';
      tipEl.hidden = false;
      setTimeout(function(){ tipEl.hidden = true; }, 5200);
    }, 1400);
  }
  window.__mind = mind;
  window.__mm = { zoomAt: zoomAt, focusRoot: focusRoot, setView: setView };
})();
</script>
</body></html>
