(function(){
  var DATA=JSON.parse(document.getElementById('mmdata').textContent);
  var cur=[], crumb=document.getElementById('crumb'), listing=document.getElementById('listing');
  function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function card(d){
    return '<a class="card" href="'+d.url+'"><b>'+esc(d.title)+'</b><span>'+d.count+' 个节点</span></a>';
  }
  function render(){
    var folders={}, files=[];
    DATA.forEach(function(d){
      var p=d.path||[];
      if(p.length<cur.length) return;
      for(var i=0;i<cur.length;i++){ if(p[i]!==cur[i]) return; }
      if(p.length===cur.length) files.push(d);
      else { var k=p[cur.length]; folders[k]=(folders[k]||0)+1; }
    });
    var ch='<a href="#" data-i="0">全部</a>';
    cur.forEach(function(t,i){ ch+='<span>›</span><a href="#" data-i="'+(i+1)+'">'+esc(t)+'</a>'; });
    crumb.innerHTML=ch;
    var h='';
    Object.keys(folders).sort(function(a,b){return a.localeCompare(b,'zh');}).forEach(function(f){
      h+='<button class="folder" data-f="'+esc(f)+'"><span>'+esc(f)+'</span><em>'+folders[f]+' 张</em></button>';
    });
    files.sort(function(a,b){return a.title.localeCompare(b.title,'zh');}).forEach(function(d){ h+=card(d); });
    listing.innerHTML=h||'<p class="empty">这个目录下还没有导图</p>';
    window.scrollTo(0,0);
  }
  listing.addEventListener('click', function(e){
    var b=e.target.closest?e.target.closest('.folder'):null;
    if(!b) return;
    cur.push(b.getAttribute('data-f')); render();
  });
  crumb.addEventListener('click', function(e){
    var a=e.target.closest?e.target.closest('a'):null;
    if(!a) return;
    e.preventDefault();
    cur=cur.slice(0, parseInt(a.getAttribute('data-i'),10)); render();
  });
  render();
})();
</script>
<script>
(function(){
  var q=document.getElementById('q'), qc=document.getElementById('qc');
  if(!q) return;
  function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var dataEl=document.getElementById('mmdata');
  var DATA=dataEl?JSON.parse(dataEl.textContent):null;
  q.addEventListener('input', function(){
    var kw=q.value.trim().toLowerCase(), n=0;
    if (DATA) {
      var home=document.getElementById('home'), box=document.getElementById('results');
      if(!kw){ box.hidden=true; box.innerHTML=''; if(home)home.hidden=false; qc.textContent=''; return; }
      var hits=DATA.filter(function(d){return (d.kw||'').indexOf(kw)>=0;});
      if(home)home.hidden=true;
      box.hidden=false;
      box.innerHTML=hits.slice(0,80).map(function(d){
        return '<a class="card" href="'+d.url+'"><b>'+esc(d.title)+'</b>'
          +'<span>'+esc(d.folder)+' · '+d.count+' 个节点</span></a>';
      }).join('');
      qc.textContent=hits.length+' 个结果';
      return;
    }
    document.querySelectorAll('.card').forEach(function(c){
      var hit=!kw || (c.getAttribute('data-kw')||'').indexOf(kw)>=0;
      c.hidden=!hit;
      if(hit) n++;
    });
    document.querySelectorAll('.grp').forEach(function(g){
      g.hidden = !g.querySelector('.card:not([hidden])');
    });
    document.querySelectorAll('section.sec').forEach(function(s){
      s.hidden = !s.querySelector('.card:not([hidden])');
    });
    qc.textContent = kw ? (n + ' 个结果') : '';
  });
})();
</script>
