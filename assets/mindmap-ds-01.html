async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-2d4acfdc4b9a1e.jpg\" style=\"width:260px;height:84px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}]}]}]}, {"id": "mQMSCMVuo24", "topic": "<b>6、B树的删除<\/b><span class=\"mm-note\">在删除时，如果节点中的<b>关键字个数 &lt; m/2(向上取整)-1<\/b> 时,那就要涉及到<b>结点的合并问题<\/b>，因此会有一些麻烦。<\/span>", "expanded": true, "children": [{"id": "mluqkLoouZx", "topic": "<b>情况1：<\/b><span style=\"color:#7c3aed\"><b><span>被删关键字在非终端结点<\/span><\/b><br><img class=\"mm-img\" src=\"mm-4238ae32092d8a.jpg\" style=\"width:260px;height:27px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">那么就可以直接使用<b>直接前驱或者直接后继<\/b>来代替被删除的关键字(与BST的删除异曲同工)，就<b>转化为：对终端结点的删除操作。<\/b><\/span>", "expanded": true, "children": [{"id": "mwdOL0vTP49", "topic": "示例1(删除80)：用<b>直接前驱替换<\/b>被删除结点<br><img class=\"mm-img\" src=\"mm-3ab59c5e5cd332.jpg\" style=\"width:260px;height:106px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-6f0e4efa54f53e.jpg\" style=\"width:260px;height:86px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">可以看到：此时80的直接前驱就是77(左孩子最右下的关键字)。\n那么在此时，如果此次删除导致终端结点不符合定义要求，那么就需要进行情况2的处理了。<\/span>", "expanded": true}, {"id": "mS48MfGbqVp", "topic": "示例2(删除77)：用<b>直接后继替换<\/b>被删除结点<br><img class=\"mm-img\" src=\"mm-450b6e146b930e.jpg\" style=\"width:260px;height:92px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-e6c411ad36c093.jpg\" style=\"width:260px;height:83px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">可以看到：用77的直接后继82替换掉了77，并且<b>将剩下的关键字依次前移<\/b>。<\/span>", "expanded": true}]}, {"id": "mWgmAkyarq9", "topic": "<b>情况2：<\/b><span style=\"color:#7c3aed\"><b><span>被删除结点在终端结点中<\/span><\/b><b>(三种情况<\/b><span style=\"color:#7c3aed\"><b><span>)<\/span><\/b>", "expanded": true, "children": [{"id": "mgLkfqtGjDU", "topic": "<b>1、删除该关键字后，结点中关键字个数依旧满足定义<\/b><span class=\"mm-note\">即：删除该结点后，结点中关键字的个数依旧在区间<b>[m/2(向上取整)-1,m-1]<\/b>内。\n那就<b>直接删除即可<\/b>，反正又不破坏B树的定义。<\/span>", "expanded": true}, {"id": "my0sUqlyaVK", "topic": "<b>2、<\/b><span style=\"color:#0e7a52\"><b><span>兄弟够借：<\/span><\/b><b>那就借<\/b><span class=\"mm-note\">顾名思义，就是从<b>左右兄弟结点中借关键字，调整该结点、左/右兄弟结点、父结点(父子换位法)，<\/b>来达到新的平衡。\n\n<b>本质<\/b>：保证<b>永远保持B树的特性<\/b>。<\/span>", "expanded": true, "children": [{"id": "mZKHuMiiiKZ", "topic": "<b>(1)借右兄弟：用当前结点的后继、后继的后继填补<\/b><br><img class=\"mm-img\" src=\"mm-e2313d6dbd1b88.jpg\" style=\"width:260px;height:80px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-242c4cf9931595.jpg\" style=\"width:260px;height:113px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-d8a0f8d9167b98.jpg\" style=\"width:260px;height:127px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">此时：删除38。\n可以发现：第一个终端结点关键字个数不满足定义，而它的右兄弟的关键字个数绰绰有余，因此<b>从右兄弟那里借一个关键字过来<\/b>(右兄弟中的第一个关键字70)。\n\n但是<b>注意<\/b>：\n       借过来之后，并不是将70直接放到25的后边，而是要<b>根据父结点进行调整(父\n       子换位法)。\n<\/b>       此时<b>25的后继<\/b>：49；<b>25后继的后继<\/b>：70。\n       因此用49和70来进行替换操作。\n       可以看到，上图中是将70放到父结点的对应位置，然后将父结点的第一个关键\n       字49放到原结点处。\n\n这样是为了<b>满足B树有序性<\/b>的特性。<\/span>", "expanded": true}, {"id": "mOmJc3WPUpe", "topic": "<b>(2)借左兄弟：用当前结点的前驱、前驱的前驱填补<\/b><br><img class=\"mm-img\" src=\"mm-0711b8a26779bb.jpg\" style=\"width:260px;height:115px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-d6695c39d2a20a.jpg\" style=\"width:260px;height:120px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">此时，在上边的基础上，再删除关键字90。\n可以看到：92所在结点的右兄弟结点不宽裕，而做兄弟结点很宽裕，因此考虑<b>从左兄弟借关键字。<\/b>\n\n且<b>：92的前驱<\/b>：88；<b>92前驱的前驱<\/b>：87。\n因此：将88放到92之后，再将87放到父结点的对应位置即可。<\/span>", "expanded": true}]}, {"id": "mjCove9ZPUb", "topic": "<b>3、<\/b><span style=\"color:#0e7a52\"><b><span>兄弟不够借：<\/span><\/b><b><mark>合并<\/mark><\/b><br><img class=\"mm-img\" src=\"mm-ad9eebe22165a8.jpg\" style=\"width:260px;height:116px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">左右兄弟都不够借了，那就将：<b>关键字删除后结点+左/右兄弟结点+父结点中的特定关键字<\/b>合并。\n\n父结点中的特定关键字：\n          就是处于<b> 删除后结点<\/b> 与 <b>左/右兄弟结点中间<\/b>的那个关键字。<\/span>", "expanded": true, "children": [{"id": "mz1Rq1CFsFT", "topic": "①：合并1<br><img class=\"mm-img\" src=\"mm-6cc67ada520a29.jpg\" style=\"width:260px;height:82px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-fa446d0b169ca3.jpg\" style=\"width:260px;height:81px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">可以看到，此时父结点中的特定关键字为：70，因此有上述的合并结果。\n\n并且合并后发现，73所在结点也违反了定义，因此继续进行合并。<\/span>", "expanded": true}, {"id": "mWHGjttPo2S", "topic": "②：合并2:<br><img class=\"mm-img\" src=\"mm-22a33b06746e6b.jpg\" style=\"width:260px;height:120px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">可以看到：合并后，原根节点为空，因此可以直接原根节点删除。\n\n​因此可知：在合并过程中，双亲节点中的关键字个数会减1。若双亲节点是根节点且关键字的个数减少至0，直接将根节点删除即可。<\/span>", "expanded": true}]}]}]}, {"id": "mlMieNM5vQs", "topic": "知识点回顾：<br><img class=\"mm-img\" src=\"mm-0073ac03996d75.jpg\" style=\"width:260px;height:140px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mqAa3ktd3JE", "topic": "<b>五、B+树<\/b><span class=\"mm-note\">应<b>数据库所需<\/b>而出现的一种B树变形树。\n并且注意：<b>B+树中的叶子结点与B树中的叶子结点有所不同\n即：\n<\/b>          B树中的叶结点：指<b>最后一层虚拟的NULL结点<\/b>，不包含关键字。\n          B+树的叶结点：指<b>最后一层包含关键字的结点<\/b>。(见下图中的绿色块)\n\n<b>既<\/b>支持<b>顺序查找<\/b>，<b>又<\/b>支持<b>多路随机查找<\/b>。<\/span>", "expanded": true, "children": [{"id": "mBzeLToOE3L", "topic": "<b>1、定义(m阶B+树)：<\/b><br><img class=\"mm-img\" src=\"mm-76f614cba9c927.jpg\" style=\"width:260px;height:142px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-ad5b6de119d98b.jpg\" style=\"width:260px;height:133px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\"><b>五个条件：\n<\/b>\n1、每个分支节点最多有m棵子树(孩子结点)\n\n2、<b>非叶根节点<\/b>至少有2棵子树，其它每个<b>分支结点至少有m/2(向上取整)<\/b>棵子树。\n                                原因：依旧是为了追求绝对平衡，与B树一样。\n\n3、<b>结点的子树个数与关键字的个数相等\n<\/b>                                原因：与第5个条件相关，因此有几个子树就有几个关键字，并且关键字都\n                                               是子树中的最大值。\n<b>\n<\/b>4、所有<b>叶结点包含全部的关键字<\/b>和<b>指向相应实际记录的指针<\/b>，叶结点中将<b>关键字按大小顺序排列<\/b>，且使用一个<b>指针(p)将相邻叶结点按大小顺序链接起来<\/b>。\n                                原因：因为B+树是为了数据库设计，在上图中可以看到，叶结点下有关键\n                                               字所指向的指针(记录)，<b>该指针指向的地址才是存储实际信息的地\n                                               方<\/b>。且我们可以从p指针开始，按照顺序遍历完所有叶结点(即：所\n                                               有关键字)，因此：<b>B+树支持顺序查找<\/b>。\n\n5、所有<b>分支结点<\/b>中<b>仅包含<\/b>它的各个<b>子结点中关键字的最大值<\/b>及<b>指向其子结点的指针<\/b>。\n                               解释：与分块查找类似。<\/span>", "expanded": true}, {"id": "mP4KhDoizc8", "topic": "<b>2、B+树的查找：<\/b><span style=\"color:#7c3aed\"><b><span>无论成功与否，都要查到最下边一层的叶结点<\/span><\/b><span class=\"mm-note\">与B树不同的是，B+树的查找，<b>无论成功与否，都要查到最下边一层的叶结点。\n\n<\/b>因为：<b>B+树的分支结点<\/b> 中 <b>仅包含<\/b>它的<b>各个子结点中关键字的最大值。<\/b>而<b>只有在最后一层叶结点保存了指向记录的指针。\n<\/b>也就是说：只有到最后一层，才能找到实际信息的存放地址。<b>\n<\/b><\/span>", "expanded": true, "children": [{"id": "mS2grkD4BcX", "topic": "<b>1、多路查找：<\/b><br><img class=\"mm-img\" src=\"mm-6d483f2179ab0c.jpg\" style=\"width:260px;height:136px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-bae86f6c82ec90.jpg\" style=\"width:260px;height:145px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">就是从<b>根节点出发<\/b>，<b>逐层向下<\/b>查找。<\/span>", "expanded": true}, {"id": "mKP4ONZkbbC", "topic": "<b>2、顺序查找：<\/b><br><img class=\"mm-img\" src=\"mm-4a9b87af7f1a79.jpg\" style=\"width:260px;height:130px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">就是使用<b>指针P<\/b>，直接顺序查找。\n因为：最下边一层的叶结点是使用指针p链接起来了的，相当于一个有序链表。<\/span>", "expanded": true}]}, {"id": "mqeIGxnn7l6", "topic": "<b>3、<\/b><b><mark>B+ 树 VS B树 <\/mark><\/b><b>(<\/b><span style=\"color:#d92d20\"><b><span>重点<\/span><\/b><b>)<\/b>", "expanded": true, "children": [{"id": "mO9vMwGF9bR", "topic": "<b>1、结点中<\/b><span style=\"color:#7c3aed\"><b><span>关键字与子树的数量关系<\/span><\/b><b>不同<\/b><span class=\"mm-note\">B树：<b>n个关键字对应n+1棵子树<\/b>；B+树：<b>n个关键字对应n棵子树<\/b>。\n核心原因：\n      B树：用<b>n个关键字分成了n+1个区间<\/b>，<b>每个区间一颗子树，<\/b>因此对应n+1棵子树。\n      B+树：<b>每一个关键字对应一棵子树<\/b>，因此对应n棵子树。<\/span>", "expanded": true}, {"id": "mhhZTkdtksi", "topic": "<b>2、<\/b><span style=\"color:#7c3aed\"><b><span>结点中关键字的个数<\/span><\/b><b>有所不同<\/b><br><img class=\"mm-img\" src=\"mm-cc91b6f076474f.jpg\" style=\"width:260px;height:111px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-429f7d256da0e0.jpg\" style=\"width:260px;height:72px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\"><b>m阶B树<\/b>中：\n      ①<b>根节点<\/b>关键字数：<b>[1,m-1]<\/b>\n      ②<b>非根节点<\/b>关键字数：<b>[m/2(向上取整)-1,m-1]\n\nm阶B+树<\/b>中<b>：\n      <\/b>①<b>根节点<\/b>关键字数<b>：[1,m]\n      <\/b>②<b>非根节点<\/b>关键字数<b>：[m/2(向上取整),m]\n\n本质原因：\n    <\/b>  B树中m个关键字对应m+1个分支；B+树中m个关键字对应m个分支。<b>\n    <\/b><\/span>", "expanded": true}, {"id": "mxUD9wytm2J", "topic": "<b>3、<\/b><span style=\"color:#7c3aed\"><b><span>关键字的重复性<\/span><\/b><br><img class=\"mm-img\" src=\"mm-289f0d68d35634.jpg\" style=\"width:260px;height:22px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-28ebdeda28f478.jpg\" style=\"width:260px;height:45px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\"><b>B+树<\/b>：叶结点包含了全部的关键字，因此在非叶结点中，<b>关键字会重复出现<\/b>。\n<b>B树<\/b>：各结点中，<b>关键字不重复出现<\/b>。\n​<\/span>", "expanded": true}, {"id": "m91NkH33k6i", "topic": "<b>4、<\/b><span style=\"color:#7c3aed\"><b><span>结点是否存储实际信息(<\/span><\/b><span style=\"color:#d92d20\"><b><span>核心！！！<\/span><\/b><span style=\"color:#7c3aed\"><b><span>)<\/span><\/b><br><img class=\"mm-img\" src=\"mm-b521196a8066ed.jpg\" style=\"width:260px;height:32px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-cc1fa1c1ff2131.jpg\" style=\"width:260px;height:36px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">B树：所有结点中都包含了关键字对应的记录的存储地址。\nB+树：<b>只有叶结点包含<\/b>关键字对应的记录的<b>存储地址，<\/b>其它<b>分支节点<\/b>只起一个<b>索引作用<\/b>。<\/span>", "expanded": true}]}, {"id": "mzABJqzojoS", "topic": "<b>4、B+树的设计原理：<\/b><span style=\"color:#b45309\"><b><span>为何B+的分支结点不含关键字对应记录的存储地址？<\/span><\/b><br><img class=\"mm-img\" src=\"mm-d2ddec746fcb9d.jpg\" style=\"width:260px;height:149px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">答：为了<b>使树高更矮<\/b>，OS<b>读磁盘次数减少<\/b>，<b>查找速度加快<\/b>。\n\n分析：\n        因为其实B+树是为了数据库而设计，因此主要涉及数据的读取。B+树在实际使用中，每一个结点都是一个<b>磁盘块<\/b>，操作系统在读取数据时，<b>以块为单位<\/b>，会先将目标块(根节点)从磁盘读取到内存中，然后根据读  \n        取到的信息，在磁盘上查找下一个目标块，以此类推....\n        而<b>OS读取磁盘的速度是很慢<\/b>的，且<b>每一个块(簇)的大小是有限的。\n<\/b>        因此：为了减少磁盘的读取，那就<b>尽量在块中保存尽可能多的关键字<\/b>，因此，就不会保存关键字对应记录的存储地址。<\/span>", "expanded": true}]}]}, {"id": "mj7dHJ3hgQw", "topic": "<b>四、散列查找<\/b>", "expanded": true, "children": [{"id": "mlnCrTAOh4t", "topic": "<b>1、基本概念<\/b>", "expanded": true, "children": [{"id": "mgNRHutuJ3g", "topic": "<b>1、散列表(Hash Table)：建立了<\/b><b><mark>关键字和存储地址的直接映射关系<\/mark><\/b><span style=\"color:#7c3aed\"><b><span>。<\/span><\/b><span class=\"mm-note\">因此可以通过关键字直接访问数据。\n因此：<b>带有随机性的函数不能成为散列函数<\/b>。<\/span>", "expanded": true}, {"id": "mp3bj6MACPC", "topic": "<b>2、散列函数：<\/b><span style=\"color:#7c3aed\"><b><span>Hash(key)=Addr<\/span><\/b><span class=\"mm-note\">将查找表中的关键字映射成该关键字对应的地址。\nAddr可以是：数组下标、索引、内存地址........<\/span>", "expanded": true}, {"id": "mOzaaFtDAFL", "topic": "<b>3、<\/b><span style=\"color:#b45309\"><b><span>冲突<\/span><\/b><b>：将两个或两个以上的不同关键字映射到同一地址。<\/b><span class=\"mm-note\">冲突不可避免，在之后会有处理冲突的方法。<\/span>", "expanded": true}, {"id": "mxgiBXTJ0RR", "topic": "<b>4、<\/b><span style=\"color:#b45309\"><b><span>同义词<\/span><\/b><b>：发生碰撞的不同关键字。<\/b>", "expanded": true}, {"id": "mC8zuO7Ili5", "topic": "定义：<br><img class=\"mm-img\" src=\"mm-aa481fb451906c.jpg\" style=\"width:260px;height:157px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mW78L2dCQvP", "topic": "<b>2、散列查找<\/b><span class=\"mm-note\">这里以<b>拉链法<\/b>为例。<\/span>", "expanded": false, "children": [{"id": "mEHvCaTh5Bp", "topic": "1、<b>查找长度<\/b>：在查找运算中，<b>需要对比关键字的次数<\/b>", "expanded": false, "children": [{"id": "m6LWxKtUbNV", "topic": "<br><img class=\"mm-img\" src=\"mm-6ce3462b5f2efd.jpg\" style=\"width:260px;height:127px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">这是大多数学校的计算方法。\n即：比如在散列查找的拉链法中，如果查找到的指针为空，那么查找次数为0次(<b>不将判断指针为空的操作计入在内<\/b>)。\n\n当然，有的教材还是会将判断指针为空的操作计入在内。(视具体情况而定)<\/span>", "expanded": true}]}, {"id": "mrXQ8Dk7cW8", "topic": "<b>2、平均查找长度(ASL)<\/b>", "expanded": false, "children": [{"id": "mJaiXe7z6zQ", "topic": "<b>查找成功<\/b>的ASL：<br><img class=\"mm-img\" src=\"mm-6c8cc096b32860.jpg\" style=\"width:260px;height:152px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-1128ec2dc240e3.jpg\" style=\"width:260px;height:114px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">可以看到：\n      计算方法1： 查找长度为1的共有6个元素(第一层蓝色)、查找长度为2的有4个元素(第二层蓝).......\n                                  以此类推，就得到上图中的查找成功 ASL。\n      计算方法2：\n                                 将每个元素的比较次数累加即可。<\/span>", "expanded": true}, {"id": "m89Co2CegU3", "topic": "<b>冲突越多，查找效率就会越低<\/b>", "expanded": true}, {"id": "mm4eIJ4FdaN", "topic": "<b>查找失败<\/b>的ASL：<br><img class=\"mm-img\" src=\"mm-4d819dc09de905.jpg\" style=\"width:260px;height:133px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">计算思路：\n     下标0处比较0次、下标1处比较4次、下标2处比较0次..........以此类推，其实就是<b>计算出\n      该哈希表中的记录个数，<\/b>且每个元素的查找概率一致均为1/13，就有如上所示的结果。<\/span>", "expanded": true}, {"id": "m5S5r949W6X", "topic": "注意事项：每个元素查找失败和查找成功的查找概率不同：<b>查找成功时是除元素个数(12)，查找失败时是除表长(13)<\/b>。", "expanded": true}]}, {"id": "m6AKLqTao7O", "topic": "<b><mark>装填因子(α)<\/mark><\/b><mark> <\/mark><b><mark>= 表中记录数(n)/散列表长度(m)<\/mark><\/b><span class=\"mm-note\">装填因子<b>越大<\/b>，散列表装得<b>越满<\/b>。\n装填因子<b>直接影响<\/b>散列表的<b>查找效率<\/b>。越大越慢。<\/span>", "expanded": true}]}, {"id": "mAI9Wn3jvJP", "topic": "<b>3、常见的散列函数<\/b><span class=\"mm-note\">构建散列函数时，注意以下几点：\n1、散列函数的<b>定义域<\/b>必须<b>包含全部需要存储的关键字<\/b>，而值域的范围则依赖于散列表的大小或地址范围。\n2、散列函数计算出来的地址尽可能<b>等概率、均匀地分布在整个地址空间<\/b>，<b>减少冲突的发生<\/b>。\n3、散列函数<b>尽可能简单<\/b>，在较短时间内计算出任意一个关键字对应的散列地址。<\/span>", "expanded": true, "children": [{"id": "mvb7H3Btt1m", "topic": "<b>1、除留余数法 — <\/b><b><mark>H(key) = key % p<\/mark><\/b><span class=\"mm-note\">就是直接取余，但是对谁取余，是有讲究的哦~<\/span>", "expanded": true, "children": [{"id": "mBKShqw2GLU", "topic": "<br><img class=\"mm-img\" src=\"mm-b709f922c336b1.jpg\" style=\"width:260px;height:144px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mIF66o2M3eI", "topic": "<b>关键：<\/b><span style=\"color:#d92d20\"><b><span>选p<\/span><\/b> <b>—取一个<\/b><b><mark>不大于m<\/mark><\/b><span style=\"color:#0e7a52\"><b><span>但<\/span><\/b><b><mark>最接近或等于m<\/mark><\/b><span style=\"color:#0e7a52\"><b><span>的质数<\/span><\/b><span class=\"mm-note\">m：<b>散列表表长<\/b>为m。\n\n为什么要这样选P？\n解释：\n     一般来说，用<b>质数取模<\/b>，<b>分布会更加均匀<\/b>，<b>冲突也会更少<\/b>。\n\n但是在实际运用中，还是需要具体调整选择p，不用太死板。<\/span>", "expanded": true}]}, {"id": "mdCLflNceFK", "topic": "<b>2、直接定址法 — <\/b><b><mark>H(key) = key<\/mark><\/b><b>   或<\/b>  <b><mark>H(key) = a*key + b<\/mark><\/b><span class=\"mm-note\">即：直接取关键字的某个<b>线性函数<\/b>为散列地址。\n优点：<b>简单<\/b> 且 <b>不会产生冲突。<\/b>但是这需要事先知道关键字的分布情况。<b>\n<\/b><\/span>", "expanded": true, "children": [{"id": "mKjkCb53qXQ", "topic": "<br><img class=\"mm-img\" src=\"mm-98770afa7d2083.jpg\" style=\"width:260px;height:116px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mkHX6DbCVlm", "topic": "<b>适合：<\/b><span style=\"color:#0e7a52\"><b><span>关键字分布连续且查找表较小<\/span><\/b><span class=\"mm-note\">限制较高，因此实际中不常用。<\/span>", "expanded": true}]}, {"id": "mZmaFxDiiPB", "topic": "<b>3、数字分析法<\/b>", "expanded": true, "children": [{"id": "meYmPpG5qW3", "topic": "<br><img class=\"mm-img\" src=\"mm-c06593aecc7848.jpg\" style=\"width:260px;height:134px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">即：\n若关键字是位数较多的数字，且这些数字<b>部分存在某些规律<\/b>，则可以采用<b>抽取剩余不同规律部分<\/b>作为<b>散列地址<\/b>。<b>\n\n<\/b>比如手机号前三位是接入号，中间四位是 HLR 识别号，只有后四位才是真正的用户号\n也就是说，如果手机号作为关键字，那么极有可能前 7 位是相同的\n此时我们选择后四位作为散列地址就是不错的选择。\n<b>\n<\/b>同时，对于抽取出来的数字，还可以<b>再进行反转、右环位移、左环位移等操作\n\n<\/b>数字分析法通常<b>适合处理关键字位数比较大的情况。\n\n<\/b>适用于<b>：已知关键字集合的情况<\/b>。若换了关键字，那就需要重新构建对应的散列函数。<b>\n\n​<\/b><\/span>", "expanded": true}]}, {"id": "mUVlzHbTyIQ", "topic": "<b>4、平方取中法—取<\/b><b><mark>关键字平方值的中间几位<\/mark><\/b><b>作为散列地址<\/b>", "expanded": true, "children": [{"id": "mSHS1eptdyM", "topic": "<br><img class=\"mm-img\" src=\"mm-6356821d73e9a4.jpg\" style=\"width:260px;height:143px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">即：取<b>关键字平方的中间位数<\/b>作为<b>散列地址<\/b>\n比如假设关键字是 4321，那么它的平方就是 18671041，抽取中间的 3 位就可以是 671，也可以是 710，用做散列地址\n平方取中法比较<b>适合<\/b>于<b>不知道关键字的分布<\/b>，而<b>位数又不是很大<\/b>的情况。\n如：\n       身份证号。<\/span>", "expanded": true}]}]}, {"id": "m3INhH59j4x", "topic": "<b>4、处理冲突的方法：<\/b>", "expanded": true, "children": [{"id": "m34nIcIdDMP", "topic": "<b>1、拉链法(<\/b><b><mark>开散列<\/mark><\/b><b>)：<\/b><span class=\"mm-note\">即：数组元素中存储的是一个链表，在这个<b>链表中<\/b>，<b>存储了所有的同义词<\/b>。\n(<b>将所有关键字为同义词的结点链接在同一个单链表中)<\/b>。\n​\n在实际应用中较广，像Java中的HashMap等，其实底层都是拉链法。<\/span>", "expanded": true, "children": [{"id": "mr6oUklKFez", "topic": "<br><img class=\"mm-img\" src=\"mm-8fbd30230558be.jpg\" style=\"width:260px;height:173px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mtxOwkQQers", "topic": "<b>拉链法的小优化：<\/b><span style=\"color:#0e7a52\"><b><span>插入新元素时，保持关键字有序<\/span><\/b><br><img class=\"mm-img\" src=\"mm-9017b4af211b0b.jpg\" style=\"width:260px;height:171px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">可以稍微提高查找效率，至于为何，其实就是顺序查找的第一种优化方式，可以<b>将有序单链表转化为树<\/b>，提高查找效率。<\/span>", "expanded": true}]}, {"id": "mbx0ZRIaw2n", "topic": "<b>2、开放定址法：<\/b><b><mark>Hi = (H(key) + di) % m<\/mark><\/b><span class=\"mm-note\">即：\n          一旦产生了冲突(该地址已经有其它元素)，就按照<b>某种规则<\/b>去<b>寻找另一空地址<\/b>。\n<b>di：增量序列；\nm：表长；\ni：第i次发生冲突。\nH(key)：散列函数。\nHi：冲突处理函数。<\/b>\n\n根据对<b>di的不同取值序列<\/b>，有了下列几种不同的处理冲突的方法：<\/span>", "expanded": true, "children": [{"id": "mL23NViDbSL", "topic": "<b>1、<\/b><b><mark>线性探测<\/mark><\/b><span style=\"color:#d92d20\"><b><span>再散列法(重点！！！)<\/span><\/b><b>：发生冲突时，按增量<\/b><span style=\"color:#7c3aed\"><b><span>顺序查看下一个单元，直到找到一个空闲单元<\/span><\/b>", "expanded": true, "children": [{"id": "mrMafXukci3", "topic": "<b>1、查找元素：<\/b><span style=\"color:#1d4ed8\"><b><span>效率较低<\/span><\/b><br><img class=\"mm-img\" src=\"mm-69a52664382956.jpg\" style=\"width:260px;height:135px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-a5e521812a7692.jpg\" style=\"width:260px;height:133px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-a46a4cf9dd947d.jpg\" style=\"width:260px;height:124px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">如上图：\n\n     1、 查找27(图1)：从位置1开始顺序向后，共发生了4次冲突，并且同义词和非 \n                                           同义词都需要比较，效率极低。\n\n     2、查找21(图2)：从位置8开始，一直查找到位置13发现为空，总计查找长度为\n                                           6(<b>空位置的判断也是一次比较，<\/b>与<b>拉链法中空指针的比较不计\n                                          入<\/b>作<b>对比<\/b>记忆)\n\n    3、查找21(图3)：可以看到位置10中为空，那么在线性探测查找时，查找到位置\n                                          10时，就会发现没有元素，那么就会直接判定表中无21，查找结束，此时的查找效率就会高。\n                (那么<b>这种查找特性也导致了下边所讲的删除操作<\/b>)<\/span>", "expanded": true}, {"id": "mkJPOaPPF4m", "topic": "<b>2、删除元素：<\/b><b><mark>逻辑删除<\/mark><\/b><br><img class=\"mm-img\" src=\"mm-535ab793cd9d39.jpg\" style=\"width:260px;height:151px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-f31f884ef051b2.jpg\" style=\"width:260px;height:137px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">在开放定址法中，<b>不能随便物理删除表中已有的元素<\/b>。\n因为若删除元素，则会<b>截断其他具有相同散列地址的元素的查找地址。\n\n<\/b>但这样做的一个<b>弊端<\/b>就是：<b>\n         <\/b>在执行多次删除后，<b>表面上看起来散列表很满<\/b>，<b>实际<\/b>上是<b>有许多位置未利用<\/b>的，因此需<b>要定期维护散列表<\/b>，将删除标记的元素物理删除。<\/span>", "expanded": true}, {"id": "mv2pZOzWeLu", "topic": "<b>3、查找效率(ASL):<\/b>", "expanded": true, "children": [{"id": "my2rFD9Nbyx", "topic": "<b>查找成功：<\/b><br><img class=\"mm-img\" src=\"mm-7ac68ceebef44e.jpg\" style=\"width:260px;height:142px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">共有12个元素，各元素的查找概率均为1/12，再将每一个元素根据线性探测法查找的查找次数累加，后相乘，就得到ASL。<\/span>", "expanded": true, "children": [{"id": "m8nmOM800gG", "topic": "<b>查找成功ASL计算思路：<\/b><span style=\"color:#1d4ed8\"><b><span>算出所有元素的查找成功次数，累加<\/span><\/b><b>，最后<\/b><span style=\"color:#1d4ed8\"><b><span>除以所有元素的个数<\/span><\/b><b>。<\/b>", "expanded": true}]}, {"id": "m2qsPOp0BEz", "topic": "<b>查找失败：<\/b><br><img class=\"mm-img\" src=\"mm-715f5a3e185700.jpg\" style=\"width:260px;height:144px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">考虑方式：\n           哈希函数是对13取余，即：<b>H(key) = 0~ 12，<\/b>即<b>查找失败时对应的地址有13个<\/b>，且<b>每种情\n           况发生的概率是相同的<\/b>，因此均为<b>1/13<\/b>。再<b>将每一个元素查找失败的次数累加，<\/b>最后相乘，即可得到查找失败ASL。\n\n如上图：\n           位置<b>0为空<\/b>，因此查找<b>比较次数为1<\/b>(第一次探查就找到其位置为空)。\n           位置<b>1不为空<\/b>，因此根据线性探测，依次顺序向下查找，直到查找到位置13查找失败，才会停止，<b>共比 较13次<\/b>..........以此类推。\n           位置<b>2不为空<\/b>，依次向下进行线性探测，<b>共比较12次<\/b>。就得到了上边的失败ASL。\n           位置<b>3不为空<\/b>，依次向下...........，共<b>比较11次<\/b>。\n                      ....................\n           位置<b>12不为空<\/b>，向下线性探测，共<b>比较2次<\/b>。\n\n​综上，将所有查找失败的次数累加，再除以13。<\/span>", "expanded": true, "children": [{"id": "meihHeQeERK", "topic": "<b>查找失败ASL计算思路：<\/b>", "expanded": true, "children": [{"id": "mYQVLJ9sqfF", "topic": "① 根据散列函数取余的m，观察<b>：查找失败可能对应的地址有几个<\/b><span class=\"mm-note\">如果散列函数为：H(key) = key%7,那么此时查找失败可能对应的地址有0~6，共7个。<\/span>", "expanded": true}, {"id": "mdsThY1lL5d", "topic": "② <b>算出所有地址查找失败时的比较次数。最后再<\/b><span style=\"color:#1d4ed8\"><b><span>除以失败地址的个数<\/span><\/b><b>。（<\/b>假设概率相等<b>）<\/b><span class=\"mm-note\">根据当前散列表，计算这0~6地址，确定查找失败时的比较次数。<\/span>", "expanded": true}]}]}, {"id": "mEI2zPA8NtU", "topic": "<b>查找失败ASL  VS  查找成功ASL：<\/b>", "expanded": true, "children": [{"id": "mgzdKJA0zTl", "topic": "<b>1.<\/b> <span style=\"color:#b45309\"><b><span>元素个数不同<\/span><\/b>", "expanded": true, "children": [{"id": "mQMFEkJPI3v", "topic": "① <b>查找成功<\/b>是计算：<span style=\"color:#1d4ed8\"><b><span>散列表中所有元素<\/span><\/b>，根据散列函数与线性探测，<b>查找成功时的比较次数<\/b>。", "expanded": true}, {"id": "mX8Ba8i1Rcy", "topic": "② <b>查找失败<\/b>是计算：<b>根据取余数m，得到<\/b><span style=\"color:#1d4ed8\"><b><span>失败元素地址个数<\/span><\/b>后，对所有可能失败地址，根据散列函数与线性探测，<b>确定查找失败时的比较次数<\/b>。<span class=\"mm-note\">例如：H(key) = key%7 --&gt; 可能失败为：0 ~ 6 （总计7个）\n               H(key)= key%13 --&gt; 可能失败地址为：0 ~ 12（总计13个）<\/span>", "expanded": true}]}, {"id": "mSLWKOfA86n", "topic": "<b>2. <\/b><span style=\"color:#b45309\"><b><span>比较次数计算方式不同<\/span><\/b>", "expanded": true, "children": [{"id": "m0Btfm8CI0C", "topic": "① 查找成功是计算：散列表中每一个元素，根据散列函数+线性探测，<b>看<\/b><span style=\"color:#1d4ed8\"><b><span>比较几次后可以找到该元素<\/span><\/b><b>。<\/b>", "expanded": true}, {"id": "mEolJP5JeRL", "topic": "② 查找失败是计算：所有可能失败地址，要<span style=\"color:#1d4ed8\"><b><span>比较多少次才能确定查找失败<\/span><\/b>。<span class=\"mm-note\">实质：<b>从失败地址开始，线性向后探测，需要比较几次才能找到空位<\/b>。\n因为，如果地址不空，那就可能本该存在这里的元素，为了解决冲突，根据线性探测法存在后边的的位置了，因此还不能确定查找失败。\n​那就继续向后寻找，重复此过程，直到找到一个空位，这样才能保证，确实查找失败了！！！<\/span>", "expanded": true}]}]}, {"id": "mVoqQzbFhbr", "topic": "<b>查找效率较低的原因：<\/b><b><mark>\"堆积\"问题<\/mark><\/b><br><img class=\"mm-img\" src=\"mm-7221795b403161.jpg\" style=\"width:260px;height:144px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">线性探测法：可能<b>使第i个散列地址的同义词存入第i+1个散列地址<\/b>，这样第i+1个散列地址的元素就争夺第i+2个散列地址元素的地址.......从而造成大量元素在相邻的散列地址上的<b>堆积<\/b>，大大降低查找效率。<\/span>", "expanded": true}]}, {"id": "muioEwEu3lt", "topic": "<br><img class=\"mm-img\" src=\"mm-a54df149691a0a.jpg\" style=\"width:260px;height:135px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-6d583ddc2846ea.jpg\" style=\"width:260px;height:139px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\"><b>di = 0,1,2,3,4........m-1<\/b>\n当探测到表尾地址m-1时，下一个探测地址是表首地址0.\n\n上图可以看到：\n           放入1时，H(1)=1%13=1,而此时下标为1的位置有了14，冲突。因此再次\n           H(1+d1)%16 = 2，就将1放到了下标为2的位置。<b>\n\n<\/b>因此可以看出(图2)：\n           <b>哈希函数的值域为[0,12]；冲突处理函数的值域为[0,15]。<\/b>\n           两者值域有所区别，Hi能到达H到不了的地方。\n          (<b>根本原因<\/b>在于：两个取余的数字不同，一个是不大于表长m的最大质数，一个是表长m。)<\/span>", "expanded": true}, {"id": "mVJgjv8qNfs", "topic": "<b>公式：<\/b><b><mark>Hi=(H(key)+di)%m<\/mark><\/b><span class=\"mm-note\">一定注意：\n         在<b>初始散列函数<\/b>中，是<b>对P取余数<\/b>；\n         在<b>发生冲突<\/b>后，使用线性探测法时，是对<b>表长m取余<\/b>。<\/span>", "expanded": true}, {"id": "mLsLYeKDrfQ", "topic": "<b><mark>特别注意<\/mark><\/b><b>：<\/b><span style=\"color:#d92d20\"><b><span>发生冲突后<\/span><\/b><b>，线性探测再散列时，<\/b><span style=\"color:#1d4ed8\"><b><span>是利用冲突处理函数，将元素散列到整个散列表中<\/span><\/b><b>，是<\/b><span style=\"color:#d92d20\"><b><span>对表长取余<\/span><\/b><b>。而不是对散列函数中的p(小于表长的最大素数)取余。<\/b><span class=\"mm-note\">也就是说：这里<b>特别注意一个细节！！！！！！<\/b>：\n          在初始散列函数中，对1哈希的时候，是根据<b>散列函数(H(key))<\/b>，<b>对13取余<\/b>；\n          但是在<b>发生冲突后<\/b>，就要根据<b>冲突处理函数Hi，对16取余。<\/b><\/span>", "expanded": true}]}, {"id": "m3B9Fh4nZtC", "topic": "<b>2、平方探测法(<\/b><b><mark>二次探测<\/mark><\/b><b>法)：<\/b><span class=\"mm-note\"><b>di = 0²,1²,-1²,2².-2²,3²,-3²........k²,-k²<\/b>。（<b>k&lt; = m/2<\/b>）\n\n相比于线性探测法，这个可以<b>避免出现“堆积问题”。\n缺点：\n      不能探测<\/b>到散列表上的<b>所有单元<\/b>，但<b>至少能探测<\/b>到<b>一半<\/b>单元。<\/span>", "expanded": true, "children": [{"id": "mo5qg4B2VIW", "topic": "<br><img class=\"mm-img\" src=\"mm-3b83df54a93305.jpg\" style=\"width:260px;height:143px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mvylFpbN7PR", "topic": "<b><mark>此外<\/mark><\/b><b>：m(表长)必须是一个可以表示为<\/b><span style=\"color:#1d4ed8\"><b><span>4k+3<\/span><\/b><b>的<\/b><span style=\"color:#1d4ed8\"><b><span>素数<\/span><\/b><b>，才能探测到所有位置<\/b><br><img class=\"mm-img\" src=\"mm-ea355309f68255.jpg\" style=\"width:260px;height:123px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">数学推导问题了属于是。<\/span>", "expanded": true}]}, {"id": "m8Z54Cb276o", "topic": "<b>3、伪随机序列法<\/b><span class=\"mm-note\"><b>di<\/b>：是一个伪随机序列。<\/span>", "expanded": true, "children": [{"id": "mZSIaiQpJwQ", "topic": "<br><img class=\"mm-img\" src=\"mm-aa472869c35cdf.jpg\" style=\"width:260px;height:94px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mDtD1lNmwpt", "topic": "<b>注意：这里<\/b><b><mark>取余的数m是表长！！！！<\/mark><\/b><span class=\"mm-note\">这里一定要与前边，散列函数中，“取余的数取不大于表长的最大素数” 区分开来。<\/span>", "expanded": true}, {"id": "mxgbomDnR5p", "topic": "<b>默认情况下，<\/b><span style=\"color:#1d4ed8\"><b><span>增量为1<\/span><\/b><b>.<\/b><br><img class=\"mm-img\" src=\"mm-e6b535391ce8ad.jpg\" style=\"width:260px;height:145px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mQ5TQlBnodY", "topic": "<b>3、再散列法：<\/b><span class=\"mm-note\">这种方法是同时构造<b>多个不同的哈希函数<\/b>：\n<b>Hi=RHi（key）         i=1，2，…，k\n<\/b>\n当哈希地址Hi=RH1（key）发生冲突时，再计算Hi=RH2（key）……，直到冲突不再产生。这种方法<b>不易产生聚集<\/b>，但<b>增加了计算时间<\/b>。<\/span>", "expanded": true, "children": [{"id": "mBFbeGH4iAM", "topic": "<br><img class=\"mm-img\" src=\"mm-a249ae99830b70.jpg\" style=\"width:260px;height:67px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mHihm2xFRwO", "topic": "（空节点）", "expanded": true}]}, {"id": "mjfgOrFZKro", "topic": "<b>5、查找效率：<\/b>", "expanded": true, "children": [{"id": "mhFbojXZIyf", "topic": "<b>1、散列表的查找效率取决于：<\/b><span style=\"color:#1d4ed8\"><b><span>散列函数、处理冲突的方法、装填因子<\/span><\/b>", "expanded": true}, {"id": "mNtBD4i9Ns9", "topic": "<b>2、<\/b><b><mark>平均查找长度与装填因子直接相关<\/mark><\/b><b>。<\/b><span class=\"mm-note\">散列表的<b>查找效率不直接依赖<\/b>于表中已有<b>表项个数(n)<\/b>或<b>表长(m)<\/b><\/span>", "expanded": true}]}, {"id": "m5bkws4cQvI", "topic": "<b>6、散列表中的删除<\/b>", "expanded": true, "children": [{"id": "mMu1mGk4Xiw", "topic": "<b>1、删除时，两点考虑：<\/b>", "expanded": true, "children": [{"id": "mFsWY6UHNil", "topic": "① 删除记录一定不能影响后边的检索", "expanded": true}, {"id": "mKCFgC1RNc8", "topic": "② 不希望让散列表中的位置由于记录删除而不再可用，释放的槽应该能为后来的插入操作所使用。", "expanded": true}]}, {"id": "mlwUN4VOUrR", "topic": "<b>2、删除策略：<\/b><b><mark>逻辑删除（懒惰策略）<\/mark><\/b><span class=\"mm-note\">就是：在<b>删除记录的位置上加一个特殊标记<\/b>，这个标记称为 <b>懒惰删除标记/墓碑<\/b><\/span>", "expanded": true}, {"id": "mVWC8CMUMEy", "topic": "<b>3、逻辑删除的<\/b><span style=\"color:#1d4ed8\"><b><span>缺点<\/span><\/b><b>：<\/b>", "expanded": true, "children": [{"id": "mSalDbp6Hw2", "topic": "1. <b>空间浪费<\/b>：由于删除的元素仍然占据着散列表的空间，可能导致空间的浪费。", "expanded": true}, {"id": "mj2HaEE3J8p", "topic": "2. <b>查找效率<\/b>： 查找操作需要考虑被标记的元素，这可能导致查找效率的降低。", "expanded": true}, {"id": "mVIR7FnP4QN", "topic": "3.<b>装载因子的计算<\/b>： 计算装载因子时，需要考虑被标记的元素，这可能影响重新散列的判定。", "expanded": true}, {"id": "mvaES6t472b", "topic": "<b>4.查找元素时，可能会陷入<\/b><span style=\"color:#1d4ed8\"><b><span>死循环<\/span><\/b>", "expanded": true}]}, {"id": "mhrNiq7NHlz", "topic": "<b>4、<\/b><span style=\"color:#1d4ed8\"><b><span>解决缺点<\/span><\/b><b>的思路：<\/b>", "expanded": true, "children": [{"id": "mozcs4TryKx", "topic": "1. <b>定期清理<\/b>：定期清理已被标记删除的元素，将它们从散列表中物理删除。这样可以避免空间的过度浪费。", "expanded": true}, {"id": "mtGyYtFa6Up", "topic": "2. <b>优化查找<\/b>： 在查找操作中，考虑优化以排除已被标记删除的元素。例如，<span style=\"color:#1d4ed8\"><b><span>当查找元素时，可以跳过标记删除的槽位，直接寻找下一个有效的槽位<\/span><\/b>。", "expanded": true}, {"id": "mA6ohcm0X3Y", "topic": "3. <b>合理设置装载因子<\/b>： 装载因子是散列表中存储元素的密度，设置合理的装载因子有助于平衡性能和空间利用率。根据具体情况，你可以<b><mark>调整装载因子的阈值<\/mark><\/b>，<b><mark>触发重新散列的时机<\/mark><\/b>。<span class=\"mm-note\">比如：在<b>计算装载因子时，同时计入带有懒惰删除标记的桶。<\/b><\/span>", "expanded": true}, {"id": "mwqCwEgRgFi", "topic": "4. 考虑使用<b>开放寻址法<\/b>：如果你的散列表使用了开放寻址法来解决冲突，那么在某些情况下，开放寻址法可能更容易适应懒惰删除，因为元素的删除并不会影响到其他元素的位置。", "expanded": true}]}]}, {"id": "mPiXwMTF4B8", "topic": "<span style=\"color:#d92d20\"><b><span>❤ <\/span><\/b><b>注意事项：<\/b>", "expanded": true, "children": [{"id": "mXkfmv7go9M", "topic": "<b>①分清楚<\/b><span style=\"color:#1d4ed8\"><b><span>H(key)<\/span><\/b> <b>与 <\/b><span style=\"color:#1d4ed8\"><b><span>Hi<\/span><\/b><b> 的区别<\/b>", "expanded": true, "children": [{"id": "mJ9VCWs1dqV", "topic": "<b>H(key)：<\/b><span style=\"color:#1d4ed8\"><b><span>散列函数<\/span><\/b><span class=\"mm-note\"><b>H(key) = key % p\np：小于等于表长m的最大素数。<\/b><\/span>", "expanded": true}, {"id": "mGrDS9qLBUC", "topic": "<b>Hi：<\/b><span style=\"color:#1d4ed8\"><b><span>冲突处理函数<\/span><\/b><span class=\"mm-note\"><b>Hi=(H(key) + di) % m \nm：表长    ；di：增量   <\/b><\/span>", "expanded": true}]}, {"id": "mg3QGkBQUx5", "topic": "<b>②<\/b> <span style=\"color:#1d4ed8\"><b><span>散列时<\/span><\/b><b>，是<\/b><span style=\"color:#d92d20\"><b><span>选择一个小于或等于表长的最大素数取余<\/span><\/b><b>；而在<\/b><span style=\"color:#1d4ed8\"><b><span>冲突处理线性探测再散列时<\/span><\/b><b>，是<\/b><span style=\"color:#d92d20\"><b><span>对表长取余！！！！！<\/span><\/b>", "expanded": true}, {"id": "m5qSSsaP8Nd", "topic": "<b>③<\/b> <span style=\"color:#1d4ed8\"><b><span>计算查找成功的ASL<\/span><\/b><b>，是根据<\/b><span style=\"color:#d92d20\"><b><span>表中的元素个数来计算<\/span><\/b><b>的。<\/b>", "expanded": true}, {"id": "mSg6Ehv2UMT", "topic": "<b>④ 但是在<\/b><span style=\"color:#1d4ed8\"><b><span>计算查找失败的ASL<\/span><\/b><b>时，既不是根据元素个数，也不是根据散列表长度，而是<\/b><span style=\"color:#d92d20\"><b><span>根据散列函数(mod之后的数字作为查找失败地址的个数)<\/span><\/b><b>的。<\/b><span class=\"mm-note\">也就是说，<b>该散列函数最多可以散列的长度<\/b>。<\/span>", "expanded": true}]}, {"id": "me3ovGQeVuV", "topic": "知识点回顾：<br><img class=\"mm-img\" src=\"mm-2e644ca4fead36.jpg\" style=\"width:260px;height:149px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}]}}</script>
<script>
(function(){
  var ME = window.MindElixir && (window.MindElixir.default || window.MindElixir);
  var raw = JSON.parse(document.getElementById('data').textContent);
  var data = raw.data, title = raw.title;
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  var mind = new ME({
    el: '#mindex',
    direction: 1,
    editable: false,
    contextMenu: false,
    toolBar: false,
    keypress: false,
    allowUndo: false,
    scaleMin: 0.2,
    scaleMax: 2.4,
    markdown: function(t){ return t; },
    theme: {
      name: 'MubuPaper',
      palette: ['#0e7a52','#1d4ed8','#c2410c','#7c3aed','#b45309','#0f766e','#be123c','#4d7c0f'],
      cssVar: {}
    }
  });
  mind.init({ nodeData: data, direction: 1 });
  // ---- 自由平移：mind-elixir 自带 move() 会把容器中心限制在内容范围内，
  //      手机上表现为「拖到边界就卡住」。这里改成无边界平移。 ----
  var canvas = mind.map;
  var mapEl = document.getElementById('mindex');
  function xyOf(tr){
    var m = /translate3d\((-?[\d.]+)px,\s*(-?[\d.]+)px/.exec(tr || '');
    return { x: m ? parseFloat(m[1]) : 0, y: m ? parseFloat(m[2]) : 0 };
  }
  function applyT(x, y, s){
    canvas.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) scale(' + s + ')';
  }
  // mind-elixir 的 transform-origin 在根节点 X + 画布 50% Y，缩放/居中必须带上它
  function originPx(){
    var o = (canvas.style.transformOrigin || '50% 50%').split(' ');
    function px(v, total){
      if (!v) return total / 2;
      if (v.indexOf('%') > 0) return parseFloat(v) / 100 * total;
      return parseFloat(v) || 0;
    }
    return { x: px(o[0], canvas.offsetWidth), y: px(o[1], canvas.offsetHeight) };
  }
  function contentOf(vx, vy){
    var o = originPx(), p = xyOf(canvas.style.transform), s = mind.scaleVal || 1;
    return { x: o.x + (vx - p.x - o.x) / s, y: o.y + (vy - p.y - o.y) / s };
  }
  mind.move = function(dx, dy){
    var p = xyOf(canvas.style.transform);
    applyT(p.x + dx, p.y + dy, mind.scaleVal);
    return true;
  };

  var userTouched = false;
  // 首屏：保持可读比例，对准根节点；图片加载会改变高度，多点校正几次
  function focusRoot(force){
    var _d = document.getElementById('doc');
    if (_d && _d.classList.contains('on')) return;
    if (userTouched && !force) return;
    var s = window.innerWidth < 520 ? 0.9 : 1;
    try {
      var el = mind.findEle(data.id) || document.querySelector('me-root');
      if (!el) return;
      var c = mind.container.getBoundingClientRect();
      var r = el.getBoundingClientRect();
      var pt = contentOf(r.left + r.width / 2 - c.left, r.top + r.height / 2 - c.top);
      var o = originPx();
      var nx = c.width / 2 - o.x - (pt.x - o.x) * s;
      var ny = c.height / 2 - o.y - (pt.y - o.y) * s;
      mind.scaleVal = s;
      applyT(nx, ny, s);

    var walker = document.createTreeWalker(docInner, NodeFilter.SHOW_TEXT, null), node;
    var nodes = [];
    while ((node = walker.nextNode())) nodes.push(node);
    nodes.forEach(function(nd){
      var text = nd.nodeValue || '';
      var low = text.toLowerCase();
      var idx = low.indexOf(kw), last = 0;
      if (idx < 0) return;
      var frag = document.createDocumentFragment();
      while (idx >= 0) {
        if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
        var m = document.createElement('mark');
        m.className = 'dhit';
        m.textContent = text.substr(idx, kw.length);
        frag.appendChild(m);
        last = idx + kw.length;
        idx = low.indexOf(kw, last);
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      nd.parentNode.replaceChild(frag, nd);
    });
    dHits = [].slice.call(docInner.querySelectorAll('mark.dhit'));
    dqc.textContent = dHits.length ? ('0/' + dHits.length) : '无结果';
    if (dHits.length) docJump(0);
  }
  dq.addEventListener('input', docSearch);
  dq.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); docJump(dIdx + 1); } });
  document.getElementById('dqprev').onclick = function(){ docJump(dIdx - 1); };
  document.getElementById('dqnext').onclick = function(){ docJump(dIdx + 1); };
  document.getElementById('dqclose').onclick = function(){ dq.value = ''; docClear(); dq.blur(); };

  // 默认进入文档视图
  setTimeout(function(){ setView('doc'); }, 80);

  // 超大图初始折叠，避免首屏卡顿
  var _total = (function c(n){ return 1 + (n.children || []).reduce(function(a, b){ return a + c(b); }, 0); })(data);
  if (_total > 500) {
    setTimeout(function(){
      setExpand(2, false);
      tipEl.textContent = '节点较多，已折叠到 2 层 · 点「展开」查看全部';
      tipEl.hidden = false;
      setTimeout(function(){ tipEl.hidden = true; }, 5200);
    }, 1400);
  }
  window.__mind = mind;
  window.__mm = { zoomAt: zoomAt, focusRoot: focusRoot, setView: setView };
})();
</script>
