<script type="application/json" id="data">{"title": "API网关、分布式ID、分布式锁", "data": {"id": "root", "topic": "<b>API网关、分布式ID、分布式锁<\/b>", "children": [{"id": "n1", "topic": "<b>1.API网关<\/b>", "children": [{"id": "n2", "topic": "<b>1.基础知识<\/b>", "children": [{"id": "n3", "topic": "<b>1.什么是网关？<\/b><span class=\"mm-note\">用于<b>在不同网络之间进行通信和数据传输<\/b>。它<b>可以连接不同的网络协议、传输技术或不同的网络结构，起到桥梁和中介的作用<\/b>。 网关（Gateway）通常指的是一个<b>用于管理和协调分布式服务之间通信的组件<\/b>。它不仅在网络层面提供连接功能，还在<b>应用层面提供服务路由、安全、负载均衡<\/b>等关键功能。 <img class=\"mm-img\" src=\"fl-629cdf9f61c5fd.jpg\" style=\"width:320px;height:222px\" loading=\"lazy\" decoding=\"async\"> 微服务背景下，一个系统被拆分为多个服务，但是像安全认证，流量控制，日志，监控等功能是每个服务都需要的，<b>没有网关的话，我们就需要在每个服务中单独实现<\/b>，这使得我们<b>做了很多重复的事情并且没有一个全局的视图来统一管理这些功能<\/b>。 一般情况下，网关可以为我们提供**请求<\/span>", "children": []}, {"id": "n4", "topic": "<b>2.网关提供了哪些功能？<\/b>", "children": [{"id": "n5", "topic": "<b>请求转发<\/b>：将请求转发到目标微服务。", "children": []}, {"id": "n6", "topic": "<b>负载均衡<\/b>：根据各个微服务实例的负载情况或者具体的负载均衡策略配置对请求实现动态的负载均衡。", "children": []}, {"id": "n7", "topic": "<b>安全认证<\/b>：对用户请求进行<b>身份验证并仅允许可信客户端访问 API<\/b>，并且还能够使用类似 RBAC 等方式来授权。", "children": []}, {"id": "n8", "topic": "<b>参数校验<\/b>：支持参数映射与校验逻辑。", "children": []}, {"id": "n9", "topic": "<b>日志记录<\/b>：记录所有请求的行为日志供后续使用。", "children": []}]}]}, {"id": "n10", "topic": "<b>2.常见的网关系统？<\/b>", "children": [{"id": "n11", "topic": "<b>1.SpringCloud Gateway<\/b><span class=\"mm-note\">SpringCloud Gateway 属于 Spring Cloud 生态系统中的网关，其诞生的目标是为了替代老牌网关 <b>Zuul<\/b>。准确点来说，应该是 Zuul 1.x。SpringCloud Gateway 起步要比 Zuul 2.x 更早。 <b>为了提升网关的性能<\/b>，SpringCloud Gateway 基于 Spring WebFlux 。Spring WebFlux 使用 Reactor 库来<b>实现响应式编程模型<\/b>，<b>底层基于 Netty 实现同步非阻塞的 I/O。<\/b><\/span>", "children": []}]}]}, {"id": "n12", "topic": "<b>2.分布式ID<\/b>", "children": [{"id": "n13", "topic": "<b>1.基本内容<\/b>", "children": [{"id": "n14", "topic": "<b>1.什么是分布式ID？<\/b><span class=\"mm-note\"><b>ID 就是数据的唯一标识<\/b>。 分布式 ID 是分布式系统下的 ID。分布式 ID 不存在与现实生活中，属于计算机系统中的一个概念。 我简单举一个分库分表的例子。 我司的一个项目，使用的是单机 MySQL 。但是，没想到的是，项目上线一个月之后，随着使用人数越来越多，整个系统的数据量将越来越大。单机 MySQL 已经没办法支撑了，需要进行<b>分库分表（推荐 Sharding-JDBC）<\/b>。 在分库之后， 数据遍布在不同服务器上的数据库，数据库的自增主键已经没办法满足生成的主键唯一了。<b>我们如何为不同的数据节点生成全局唯一主键呢？<\/b> 这个时候就需要生成<b>分布式 ID<\/b>了。<\/span>", "children": []}, {"id": "n15", "topic": "<b>2.分布式ID需要满足哪些要求？<\/b><span class=\"mm-note\"><img class=\"mm-img\" src=\"fl-553da62c07faa1.jpg\" style=\"width:320px;height:279px\" loading=\"lazy\" decoding=\"async\"> 一个最基本的分布式 ID 需要满足下面这些要求：<\/span>", "children": [{"id": "n16", "topic": "<b>全局唯一<\/b>：ID 的全局唯一性肯定是首先要满足的！", "children": []}, {"id": "n17", "topic": "<b>高性能<\/b>：分布式 ID 的生成速度要快，对本地资源消耗要小。", "children": []}, {"id": "n18", "topic": "<b>高可用<\/b>：生成分布式 ID 的服务要保证可用性无限接近于 100%。", "children": []}, {"id": "n19", "topic": "<b>方便易用<\/b>：拿来即用，使用方便，快速接入！<span class=\"mm-note\">除了这些之外，一个比较好的分布式 ID 还应保证：<\/span>", "children": []}, {"id": "n20", "topic": "<b>安全<\/b>：ID 中不包含敏感信息。", "children": []}, {"id": "n21", "topic": "<b>有序递增<\/b>：如果要把 ID 存放在数据库的话，ID 的有序性可以提升数据库写入速度。并且，很多时候 ，我们还很有可能会直接通过 ID 来进行排序。", "children": []}, {"id": "n22", "topic": "<b>有具体的业务含义<\/b>：生成的 ID 如果能有具体的业务含义，可以让定位问题以及开发更透明化（通过 ID 就能确定是哪个业务）。", "children": []}, {"id": "n23", "topic": "<b>独立部署<\/b>：也就是分布式系统单独有一个发号器服务，专门用来生成分布式 ID。这样就生成 ID 的服务可以和业务相关的服务解耦。不过，这样同样带来了网络调用消耗增加的问题。总的来说，如果需要用到分布式 ID 的场景比较多的话，独立部署的发号器服务还是很有必要的", "children": []}]}]}, {"id": "n24", "topic": "<b>2.分布式ID的常见解决方案？<\/b>", "children": [{"id": "n25", "topic": "<b>1.数据库<\/b>", "children": []}, {"id": "n26", "topic": "<b>2.算法<\/b>", "children": [{"id": "n27", "topic": "<b>1.UUID<\/b><span class=\"mm-note\">UUID 是 Universally Unique Identifier（<b>通用唯一标识符<\/b>） 的缩写。UUID 包含 <b>32 个 16 进制数字（8-4-4-4-12）<\/b>。 JDK 就提供了现成的生成 UUID 的方法，一行代码就行了。 😘 不同的版本对应的 UUID 的生成规则是不同的。 <b>版本 1<\/b> : UUID 是根据<b>时间和节点 ID（通常是 MAC 地址）<\/b>生成； <b>版本 2<\/b> : UUID 是根据<b>标识符（通常是组或用户 ID）、时间和节点 ID<\/b> 生成； <b>版本 3、版本 5<\/b> : 版本 5 - 确定性 UUID 通过散列（hashing）名字空间（namespace）标识符和名称生成；<\/span>", "children": [{"id": "n28", "topic": "数据库主键要尽量越短越好，而 <b>UUID 的消耗的存储空间比较大<\/b>（32 个字符串，<b>128 位<\/b>）。", "children": []}, {"id": "n29", "topic": "<b>UUID 是无顺序的<\/b>，InnoDB 引擎下，数据库主键的无序性会严重影响数据库性能。<span class=\"mm-note\">最后，我们再简单分析一下 <b>UUID 的优缺点<\/b> （面试的时候可能会被问到的哦！） :<\/span>", "children": []}, {"id": "n30", "topic": "<b>优点<\/b>：生成速度比较快、简单易用", "children": []}, {"id": "n31", "topic": "<b>缺点<\/b>：<b>存储消耗空间大<\/b>（32 个字符串，128 位）、 <b>不安全<\/b>（基于 MAC 地址生成 UUID 的算法会造成 MAC 地址泄露)、<b>无序<\/b>（非自增）、<b>没有具体业务含义<\/b>、<b>需要解决重复 ID 问题<\/b>（当机器时间不对的情况下，可能导致会产生重复 ID）", "children": []}]}, {"id": "n32", "topic": "<b>2.Snowflake(雪花算法)<\/b><span class=\"mm-note\">Snowflake 是 <b>Twitter 开源的分布式 ID 生成算法<\/b>。Snowflake 由 <b>64 bit 的二进制数字组成<\/b>，这 64bit 的二进制被分成了几部分，<b>每一部分存储的数据都有特定的含义。<\/b> <img class=\"mm-img\" src=\"fl-cc8317cbf8d9ec.jpg\" style=\"width:320px;height:63px\" loading=\"lazy\" decoding=\"async\"><\/span>", "children": [{"id": "n33", "topic": "<b>sign(1bit)<\/b>:<b>符号位<\/b>（标识正负），始终为 0，代表生成的 ID 为正数。", "children": []}, {"id": "n34", "topic": "<b>timestamp (41 bits)<\/b>:一共 41 位，用来表示<b>时间戳<\/b>，单位是毫秒，可以支撑 2 ^41 毫秒（约 69 年）", "children": []}, {"id": "n35", "topic": "<b>datacenter id + worker id (10 bits)<\/b>:一般来说，前 5 位表示<b>机房 ID<\/b>，后 5 位表示<b>机器 ID<\/b>（实际项目中可以根据实际情况调整）。这样就可以区分不同集群/机房的节点。", "children": []}, {"id": "n36", "topic": "<b>sequence (12 bits)<\/b>:一共 12 位，用来表示<b>序列号<\/b>。 序列号为自增值，代表单台机器每毫秒能够产生的最大 ID 数(2^12 = 4096),也就是说单台机器每毫秒最多可以生成 4096 个 唯一 ID。<span class=\"mm-note\">在实际项目中，我们一般也会对 Snowflake 算法进行改造，最常见的就是在 Snowflake 算法生成的 ID 中加入业务类型信息。 我们再来看看 Snowflake 算法的优缺点：<\/span>", "children": []}, {"id": "n37", "topic": "<b>优点<\/b>：<b>生成速度比较快、生成的 ID 有序递增、比较灵活<\/b>（可以对 Snowflake 算法进行简单的改造比如加入业务 ID）", "children": []}, {"id": "n38", "topic": "<b>缺点<\/b>：<b>需要解决重复 ID 问题<\/b>（ID 生成依赖时间，在获取时间的时候，可能会出现时间回拨的问题，也就是服务器上的时间突然倒退到之前的时间，进而导致会产生重复 ID）、<b>依赖机器 ID 对分布式环境不友好<\/b>（当需要自动启停或增减机器时，固定的机器 ID 可能不够灵活）。<span class=\"mm-note\">如果你想要使用 Snowflake 算法的话，一般不需要你自己再造轮子。有很多基于 Snowflake 算法的开源实现比如美团 的 Leaf、百度的 UidGenerator（后面会提到），并且这些开源实现对原有的 Snowflake 算法进行了优化，性能更优秀，还解决了 Snowflake 算法的时间回拨问题和依赖机器 ID 的问题。<\/span>", "children": []}]}]}]}]}, {"id": "n39", "topic": "<b>3.分布式锁<\/b>", "children": [{"id": "n40", "topic": "<b>1.为何需要分布式锁？<\/b><span class=\"mm-note\">在多线程环境中，如果<b>多个线程同时访问共享资源（例如商品库存、外卖订单）<\/b>，会发生数据竞争，可能会导致<b>出现脏数据或者系统问题<\/b>，威胁到程序的正常运行。 😘 <b>举个例子，超卖问题<\/b>：<b>（共享资源未互斥访问）<\/b> 假设现在有 100 个用户参与某个限时秒杀活动，每位用户限购 1 件商品，且商品的数量只有 3 个。如果不对共享资源进行互斥访问，就可能出现以下情况： 线程 1、2、3 等多个线程同时进入抢购方法，每一个线程对应一个用户。 线程 1 查询用户已经抢购的数量，发现当前用户尚未抢购且商品库存还有 1 个，因此认为可以继续执行抢购流程。 线程 2 也执行查询用户已经抢购的数量，发现当前用户尚未抢购且商品库存还有 1<\/span>", "children": [{"id": "n41", "topic": "在<b>单机服务<\/b>上，可以使用<b>独占锁<\/b>来实现同一时刻只有一个线程获取到本地锁访问共享资源。", "children": []}, {"id": "n42", "topic": "但是<b>在分布式系统上<\/b>，<b>不同的服务/客户端通常运行在独立的 JVM 进程上<\/b>。如果<b>多个 JVM 进程共享同一份资源<\/b>的话，使用<b>本地锁就没办法实现资源的互斥访问<\/b>了。于是，<b>分布式锁<\/b> 就诞生了。<span class=\"mm-note\"><img class=\"mm-img\" src=\"fl-d709f46f7f6bab.jpg\" style=\"width:320px;height:229px\" loading=\"lazy\" decoding=\"async\"> 从图中可以看出，这些<b>独立的进程中的线程访问共享资源是互斥的<\/b>，同一时刻只有一个线程可以获取到分布式锁访问共享资源。<\/span>", "children": []}]}, {"id": "n43", "topic": "<b>2.分布式锁应该具备哪些条件？<\/b><span class=\"mm-note\">一个最基本的分布式锁需要满足：<\/span>", "children": [{"id": "n44", "topic": "<b>互斥<\/b>：任意一个时刻，锁只能被一个线程持有。", "children": []}, {"id": "n45", "topic": "<b>高可用<\/b>：锁服务是高可用的，当<b>一个锁服务出现问题，能够自动切换到另外一个锁服务<\/b>。<span class=\"mm-note\">并且，即使客户端的释放锁的代码逻辑出现问题，锁最终一定还是会被释放，不会影响其他线程对共享资源的访问。这一般是通过超时机制实现的。<\/span>", "children": []}, {"id": "n46", "topic": "<b>可重入<\/b>：一个节点获取了锁之后，还<b>可以再次获取锁<\/b>。<span class=\"mm-note\">除了上面这三个基本条件之外，一个好的分布式锁还需要满足下面这些条件：<\/span>", "children": []}, {"id": "n47", "topic": "<b>高性能<\/b>：获取和释放锁的操作应该快速完成，并且不应该对整个系统的性能造成过大影响。", "children": []}, {"id": "n48", "topic": "<b>非阻塞<\/b>：如果获取不到锁，<b>不能无限期等待<\/b>，避免对系统正常运行造成影响。", "children": []}]}, {"id": "n49", "topic": "<b>3.分布式锁的常见实现方案？<\/b><span class=\"mm-note\">常见分布式锁实现方案如下：<\/span>", "children": [{"id": "n50", "topic": "基于关系型数据库比如 <b>MySQL 实现分布式锁<\/b>。", "children": []}, {"id": "n51", "topic": "基于<b>分布式协调服务 ZooKeeper 实现分布式锁<\/b>。", "children": []}, {"id": "n52", "topic": "基于<b>分布式键值存储系统比如 Redis 、Etcd 实现分布式锁<\/b>。<span class=\"mm-note\">关系型数据库的方式一般是通过<b>唯一索引或者排他锁实现<\/b>。不过，一般不会使用这种方式，问题太多比如性能太差、不具备锁失效机制。 基于 ZooKeeper 或者 Redis 实现分布式锁这两种实现方式要用的更多一些，我专门写了一篇文章来详细介绍这两种方案：[分布式锁常见实现方案总结](/distributed-system/distributed-lock-implementations.html)。<\/span>", "children": []}]}]}, {"id": "n53", "topic": "<b>4.基于Redis实现分布式锁<\/b><span class=\"mm-note\"><b>性能较好。<\/b><\/span>", "children": [{"id": "n54", "topic": "<b>1.Redis如何解决集群情况下分布式锁的可靠性？<\/b><span class=\"mm-note\">为了避免单点故障，生产环境下的 Redis 服务通常是<b>集群化部署<\/b>的。 😘 Redis 集群下，上面介绍到的分布式锁的实现会存在一些问题： 由于 <b>Redis 集群数据同步到各个节点时是异步的<\/b>，<b>如果在 Redis 主节点获取到锁后<\/b>，<b>在没有同步到其他节点时，Redis 主节点宕机了<\/b>，此时<b>新的 Redis 主节点依然可以获取锁，所以多个应用服务就可以同时获取到锁。<\/b> <img class=\"mm-img\" src=\"fl-839d909decda31.jpg\" style=\"width:320px;height:119px\" loading=\"lazy\" decoding=\"async\"> 针对这个问题，Redis 之父 antirez 设计了 <b>RedLock算法<\/b> 来解决。 😘 Redlock 算法的思想：**让客户端向 Redis 集群中的多个独立的 Red<\/span>", "children": []}]}, {"id": "n55", "topic": "<b>5.基于Zookeeper实现分布式锁？<\/b><span class=\"mm-note\"><b>Redis 实现分布式锁性能较高<\/b>，<b>ZooKeeper 实现分布式锁可靠性更高<\/b>。实际项目中，我们应该根据业务的具体需求来选择。<\/span>", "children": [{"id": "n56", "topic": "<b>1.如何实现？<\/b><span class=\"mm-note\">ZooKeeper 分布式锁是基于 <b>临时顺序节点<\/b> 和 <b>Watcher（事件监听器）<\/b> 实现的。<\/span>", "children": [{"id": "n57", "topic": "<b>获取锁：<\/b>", "children": [{"id": "n58", "topic": "首先我们要有一个持久节点<code>/locks<\/code>，客户端获取锁就是在<code>locks<\/code>下创建临时顺序节点。", "children": []}, {"id": "n59", "topic": "假设客户端 1 创建了<code>/locks/lock1<\/code>节点，创建成功之后，会判断 <code>lock1<\/code>是否是 <code>/locks<\/code> 下最小的子节点。", "children": []}, {"id": "n60", "topic": "如果 <code>lock1<\/code>是最小的子节点，则获取锁成功。否则，获取锁失败。", "children": []}, {"id": "n61", "topic": "如果获取锁失败，则说明有其他的客户端已经成功获取锁。客户端 1 并不会不停地循环去尝试加锁，而是在前一个节点比如<code>/locks/lock0<\/code>上注册一个事件监听器。这个监听器的作用是当前一个节点释放锁之后通知客户端 1（避免无效自旋），这样客户端 1 就加锁成功了。", "children": []}]}, {"id": "n62", "topic": "<b>释放锁：<\/b>", "children": [{"id": "n63", "topic": "成功获取锁的客户端在执行完业务流程之后，会将对应的子节点删除。", "children": []}, {"id": "n64", "topic": "成功获取锁的客户端在出现故障之后，对应的子节点由于是临时顺序节点，也会被自动删除，避免了锁无法被释放。", "children": []}, {"id": "n65", "topic": "我们前面说的事件监听器其实监听的就是这个子节点删除事件，子节点删除就意味着锁被释放。", "children": []}]}]}]}], "expanded": true}}</script>
<script>
(function(){
  var ME = window.MindElixir && (window.MindElixir.default || window.MindElixir);
  var raw = JSON.parse(document.getElementById('data').textContent);
  var data = raw.data, title = raw.title;
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  var mind = new ME({
    el: '#mindex',
    direction: 1,
    editable: false,
    contextMenu: false,
    toolBar: false,
    keypress: false,
    allowUndo: false,
    scaleMin: 0.2,
    scaleMax: 2.4,
    markdown: function(t){ return t; },
    theme: {
      name: 'MubuPaper',
      palette: ['#0e7a52','#1d4ed8','#c2410c','#7c3aed','#b45309','#0f766e','#be123c','#4d7c0f'],
      cssVar: {}
    }
  });
  mind.init({ nodeData: data, direction: 1 });
  // ---- 自由平移：mind-elixir 自带 move() 会把容器中心限制在内容范围内，
  //      手机上表现为「拖到边界就卡住」。这里改成无边界平移。 ----
  var canvas = mind.map;
  var mapEl = document.getElementById('mindex');
  function xyOf(tr){
    var m = /translate3d\((-?[\d.]+)px,\s*(-?[\d.]+)px/.exec(tr || '');
    return { x: m ? parseFloat(m[1]) : 0, y: m ? parseFloat(m[2]) : 0 };
  }
  function applyT(x, y, s){
    canvas.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) scale(' + s + ')';
  }
  // mind-elixir 的 transform-origin 在根节点 X + 画布 50% Y，缩放/居中必须带上它
  function originPx(){
    var o = (canvas.style.transformOrigin || '50% 50%').split(' ');

  docClose.onclick = function(){
    var all = docInner.querySelectorAll('details');
    all.forEach(function(d, i){ d.open = i < 3; });
  };
  // 文档里单击图片 → 放大查看
  docEl.addEventListener('click', function(e){
    var img = e.target && e.target.tagName === 'IMG' ? e.target : null;
    if (!img) return;
    e.preventDefault(); e.stopPropagation();
    var host = img.closest('summary, .dleaf, details');
    var name = host ? (host.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40) : '';
    lbOpen(img.getAttribute('src'), name, img.getBoundingClientRect());
  }, true);
  // 文档内搜索
  var dq = document.getElementById('dq'), dqc = document.getElementById('dqc');
  var dHits = [], dIdx = -1;
  function docClear(){ docInner.innerHTML = docHTML; dHits = []; dIdx = -1; dqc.textContent = ''; }
  function docJump(i){
    if (!dHits.length) return;
    dIdx = (i + dHits.length) % dHits.length;
    dHits.forEach(function(m){ m.classList.remove('cur'); });
    var m = dHits[dIdx];
    m.classList.add('cur');
    var p = m.parentElement;
    while (p && p !== docInner) { if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement; }
    setTimeout(function(){ m.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 20);
    dqc.textContent = (dIdx + 1) + '/' + dHits.length;
  }
  function docSearch(){
    var kw = dq.value.trim().toLowerCase();
    if (!kw) { docClear(); return; }
    if (!docHTML) return;
    docInner.innerHTML = docHTML;
    dHits = []; dIdx = -1;
    var walker = document.createTreeWalker(docInner, NodeFilter.SHOW_TEXT, null), node;
    var nodes = [];
    while ((node = walker.nextNode())) nodes.push(node);
    nodes.forEach(function(nd){
      var text = nd.nodeValue || '';
      var low = text.toLowerCase();
      var idx = low.indexOf(kw), last = 0;
      if (idx < 0) return;
      var frag = document.createDocumentFragment();
      while (idx >= 0) {
        if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
        var m = document.createElement('mark');
        m.className = 'dhit';
        m.textContent = text.substr(idx, kw.length);
        frag.appendChild(m);
        last = idx + kw.length;
        idx = low.indexOf(kw, last);
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      nd.parentNode.replaceChild(frag, nd);
    });
    dHits = [].slice.call(docInner.querySelectorAll('mark.dhit'));
    dqc.textContent = dHits.length ? ('0/' + dHits.length) : '无结果';
    if (dHits.length) docJump(0);
  }
  dq.addEventListener('input', docSearch);
  dq.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); docJump(dIdx + 1); } });
  document.getElementById('dqprev').onclick = function(){ docJump(dIdx - 1); };
  document.getElementById('dqnext').onclick = function(){ docJump(dIdx + 1); };
  document.getElementById('dqclose').onclick = function(){ dq.value = ''; docClear(); dq.blur(); };

  // 默认进入文档视图
  setTimeout(function(){ setView('doc'); }, 80);

  // 超大图初始折叠，避免首屏卡顿
  var _total = (function c(n){ return 1 + (n.children || []).reduce(function(a, b){ return a + c(b); }, 0); })(data);
  if (_total > 500) {
    setTimeout(function(){
      setExpand(2, false);
      tipEl.textContent = '节点较多，已折叠到 2 层 · 点「展开」查看全部';
      tipEl.hidden = false;
      setTimeout(function(){ tipEl.hidden = true; }, 5200);
    }, 1400);
  }
  window.__mind = mind;
  window.__mm = { zoomAt: zoomAt, focusRoot: focusRoot, setView: setView };
})();
</script>
</body></html>
