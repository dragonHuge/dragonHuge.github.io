    <text font-size="14" font-weight="bold" fill="#94A3B8">
     
     
     
     公众号：     <tspan fill="#005D7B">
      
      
      
      JavaGuide
     </tspan>
    </text>
    <text y="20" font-size="14" font-weight="bold" fill="#94A3B8">
     
     
     
     网站：     <tspan fill="#005D7B">
      
      
      
      javaguide.cn
     </tspan>
    </text>
   </g>
