<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">

<title>第三章-栈、队列、数组 · 知识导图</title>
<link rel="stylesheet" href="mind-elixir.css">
<style>
:root{
  --paper:#fbfaf6; --ink:#1b1d1c; --mut:#6b6f6d; --line:#e6e4dc; --green:#0e7a52;
  --hd: calc(56px + env(safe-area-inset-top));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
body{overflow:hidden;overscroll-behavior:none}
.hd{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(251,250,246,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ic{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;
  font-size:15px;line-height:1;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.ttl{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
.ttl b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-size:10px;color:var(--mut);letter-spacing:.02em}
.acts{display:flex;gap:6px;flex:0 0 auto}
.acts button{border:1px solid var(--line);background:#fff;color:#3c403e;border-radius:9px;
  font-size:11.5px;height:30px;padding:0 9px;cursor:pointer}
.acts button:active{transform:scale(.97)}
#qbar{position:fixed;left:0;right:0;top:var(--hd);z-index:55;display:flex;gap:6px;align-items:center;
  padding:7px 10px;background:rgba(251,250,246,.97);border-bottom:1px solid var(--line)}
#qbar[hidden]{display:none}
#q{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:9px;padding:0 10px;
  font-size:13px;background:#fff;color:var(--ink);outline:none}
#q:focus{border-color:#b9d8c9}
#qres{font-size:11px;color:var(--mut);min-width:44px;text-align:center}
#qbar button{height:32px;width:32px;border:1px solid var(--line);background:#fff;border-radius:9px;
  color:var(--mut);font-size:13px;cursor:pointer}
.tip{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:50;font-size:10.5px;color:var(--mut);background:rgba(251,250,246,.9);border:1px solid var(--line);
  border-radius:99px;padding:4px 12px;pointer-events:none;white-space:nowrap}
#map{position:fixed;top:0;right:0;bottom:0;left:0;padding-top:var(--hd)}
#mindex{width:100%;height:100%}
.map-container{background:var(--paper)!important;
  --bgcolor:var(--paper); --color:#1b1d1c; --main-color:#0e7a52;
  --main-bgcolor:#eef5f1; --main-border:1px solid #cfe3d9;
  --root-color:#fff; --root-bgcolor:#0e7a52; --root-border-color:#0e7a52;
  --root-radius:12px; --main-radius:10px; --topic-padding:5px 9px;
  --node-gap-x:22px; --node-gap-y:5px; --main-gap-x:54px; --main-gap-y:26px;
  --map-padding:60px 80px 120px;
  font-size:14px;
}
.map-container me-root me-tpc{font-size:20px;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 18px rgba(14,122,82,.18)}
.map-container me-parent me-tpc{line-height:1.55;white-space:normal;max-width:30em}
.map-container me-tpc .text{max-width:30em}
.map-container b,.map-container strong{font-weight:700}
.map-container mark{background:#fff0b8;color:inherit;padding:0 2px;border-radius:3px}
.map-container u{text-decoration:underline;text-underline-offset:2px}
.map-container .mm-note{display:block;margin-top:5px;padding:3px 0 1px 7px;border-left:2px solid #d9d6cb;
  color:#6f736f;font-size:11.5px;line-height:1.5;white-space:pre-wrap}
.map-container .mm-tbl{display:block;margin-top:6px;max-width:360px;overflow-x:auto}
.map-container table{border-collapse:collapse;font-size:11px;line-height:1.4;background:#fff}
.map-container th,.map-container td{border:1px solid #e2e2da;padding:3px 6px;text-align:left;vertical-align:top}
.map-container th{background:#f6f4ec;font-weight:600}
.map-container .mm-img{border-radius:8px;margin-top:4px;max-width:100%;display:block;
  pointer-events:auto;cursor:zoom-in}
.map-container me-epd{transform:scale(1.15)}
.me-hit{outline:2px solid #f0b429!important;outline-offset:3px;border-radius:6px}
/* 图片灯箱 */
.lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;background:rgba(12,14,13,.96);
  display:flex;flex-direction:column;opacity:0;transition:opacity .18s ease}
.lb.on{opacity:1}
.lb[hidden]{display:none}
.lb-top{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.lb-top span{flex:1;min-width:0;color:#cfd6d1;font-size:11.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.lb-top button{height:30px;min-width:34px;padding:0 8px;border:1px solid rgba(255,255,255,.18);
  background:transparent;color:#e8eae8;border-radius:8px;font-size:11.5px;cursor:pointer}
.lb-stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.lb-stage:active{cursor:grabbing}
.lb-stage img{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;
  will-change:transform;user-select:none;-webkit-user-drag:none}
.lb-tip{text-align:center;color:rgba(255,255,255,.4);font-size:10.5px;
  padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
/* 文档视图 */
#doc{position:fixed;top:var(--hd);left:0;right:0;bottom:0;overflow:auto;background:var(--paper);
  padding:18px 16px calc(48px + env(safe-area-inset-bottom));display:none;--dstep:16px}
#doc.on{display:block}
#doc[hidden]{display:none}
.doc-inner{max-width:760px;margin:0 auto;font-size:14.5px;line-height:1.75}
.doc-root{font-family:"Songti SC","Noto Serif SC",serif;font-size:21px;font-weight:700;
  padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
#doc details{margin:0}
#doc summary{list-style:none;cursor:pointer;border-radius:7px;position:relative;
  padding:4px 8px 4px calc(10px + var(--d,0) * var(--dstep));line-height:1.65}
#doc summary:hover{background:#f5f3ec}
#doc summary::-webkit-details-marker{display:none}
#doc summary:before{content:"▸";position:absolute;left:calc(var(--d,0) * var(--dstep) - 1px);top:5px;
  font-size:10px;color:#9aa39d;transition:transform .15s}
#doc details[open]>summary:before{transform:rotate(90deg)}
#doc summary:hover{background:#f2f0e8}
#doc .dleaf{padding:3px 4px 3px calc(14px + var(--d,0) * var(--dstep));position:relative}
#doc .dleaf:before{content:"";position:absolute;left:calc(4px + var(--d,0) * var(--dstep));top:12px;width:4px;height:4px;
  border-radius:50%;background:#c9cec9}
#doc details details summary{font-weight:500}
#doc .dtext img{display:block;max-width:min(100%,340px);border-radius:8px;margin:6px 0}
#doc .mm-note{display:block;margin:4px 0 2px;padding:3px 0 1px 8px;border-left:2px solid #d9d6cb;
  color:#6f736f;font-size:12.5px;line-height:1.65;white-space:pre-wrap}
#doc mark{background:#fff0b8;color:inherit;padding:0 2px;border-radius:3px}
#doc u{text-decoration:underline;text-underline-offset:2px}
#doc code{background:#f1efe6;padding:1px 4px;border-radius:4px;font-size:12.5px}
#doc table{border-collapse:collapse;font-size:12px;margin:6px 0;background:#fff}
#doc th,#doc td{border:1px solid #e2e2da;padding:4px 7px;text-align:left;vertical-align:top}
#doc th{background:#f6f4ec}
#doc a{color:#1d4ed8}
#doc .mm-tbl{display:block;max-width:100%;overflow-x:auto}
@media(max-width:520px){#doc{padding:14px 12px 60px;--dstep:13px}.doc-inner{font-size:14px}}
#doc summary.lv1{font-size:18px;font-weight:700;margin-top:16px;color:#14181a;
  border-bottom:1px solid var(--line);padding-bottom:6px}
#doc summary.lv2{font-size:16px;font-weight:650;margin-top:8px;color:#1b1f1d}
#doc summary.lv3{font-size:14.5px;font-weight:600;color:#2a2f2c}
#doc .dleaf.lv3{font-size:14px}
#doc .dleaf.lv4,#doc .dleaf.lv5{font-size:13.5px;color:#3a3f3c}
#doc img{cursor:zoom-in}
.dsearch{position:sticky;top:0;z-index:12;display:flex;gap:6px;align-items:center;
  padding:8px 0 10px;background:linear-gradient(var(--paper) 80%,transparent);max-width:760px;margin:0 auto}
.dsearch input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:9px;
  padding:0 10px;font-size:13px;background:#fff;outline:none}
.dsearch input:focus{border-color:#b9d8c9}
.dsearch span{font-size:10.5px;color:var(--mut);min-width:46px;text-align:center}
.dsearch button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;
  color:var(--mut);font-size:12px;cursor:pointer}
#doc mark.dhit{background:#ffe58a;color:inherit;border-radius:2px}
#doc mark.dhit.cur{background:#f5b942}
.dt-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.dt-head h3{margin:0}
#docTocClose{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;
  font-size:16px;color:var(--mut);cursor:pointer}
#docTocBtn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:130;
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;
  box-shadow:0 6px 18px rgba(20,30,25,.12);color:#3c403e;font-size:11px;cursor:pointer;display:none}
#docTocBtn.on{display:block}
#docMask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,14,12,.35);z-index:140;
  display:none}
#docMask.on{display:block}
#docToc{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:330px;background:#fff;z-index:150;
  transform:translateX(102%);transition:transform .22s ease;overflow:auto;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
  box-shadow:-12px 0 30px rgba(0,0,0,.12)}
#docToc.on{transform:none}
#docToc h3{font-size:13px;margin:0 0 10px;color:var(--mut);font-weight:600;letter-spacing:.04em}
.toc-i{display:block;padding:7px 6px;border-radius:7px;text-decoration:none;color:#22282a;
  font-size:13px;line-height:1.45}
.toc-i:hover{background:#f4f2ea}
.toc-i.t2{padding-left:20px;font-size:12.5px;color:#3d4441}
.toc-i.t3{padding-left:34px;font-size:12px;color:#5b625e}
@media(max-width:520px){#doc{padding:14px 12px 60px}.doc-inner{font-size:14px}}
@media (max-width:520px){
  .acts button{padding:0 7px;font-size:11px}
  .map-container{font-size:13px;--map-padding:40px 46px 96px;--main-gap-x:44px}
  .map-container me-root me-tpc{font-size:18px}
  .tip{display:none}
}
</style>
</head>

<script type="application/json" id="data">{"title": "第三章-栈、队列、数组", "data": {"id": "mvirtual-root", "topic": "<b>第三章-栈、队列、数组<\/b>", "expanded": true, "children": [{"id": "m4erJI2dwSG", "topic": "<b>一、栈<\/b>", "expanded": true, "children": [{"id": "mlgtS2x3bxO", "topic": "<b>一、基本概念<\/b>", "expanded": true, "children": [{"id": "mGpPejTyVsx", "topic": "1、<b>定义<\/b><br><img class=\"mm-img\" src=\"mm-3df59686385369.jpg\" style=\"width:260px;height:140px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\"><b>只允许在一端<\/b>进行插入与删除的<b>线性表<\/b>。<\/span>", "expanded": false, "children": [{"id": "mVSpyJPg2Dj", "topic": "1、栈顶", "expanded": true}, {"id": "mr0aMWsngyS", "topic": "2、栈底", "expanded": true}, {"id": "mSzzFV6mCci", "topic": "3、空栈<span class=\"mm-note\">栈顶指针 top = -1<\/span>", "expanded": true}]}, {"id": "mKROlTN9sC2", "topic": "2、操作特性：<span style=\"color:#b45309\"><b><span>LIFO<\/span><\/b><b>（后进先出<\/b>）", "expanded": true}, {"id": "m9m8r1iy0DD", "topic": "3、数学性质：<span style=\"color:#1d4ed8\"><b><span>卡特兰数<\/span><\/b><br><img class=\"mm-img\" src=\"mm-c7e644c8dfc35d.jpg\" style=\"width:260px;height:85px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": false, "children": [{"id": "miOJo9mMLpH", "topic": "<b>n个不同的元素进栈<\/b>，<span style=\"color:#1d4ed8\"><b><span>出栈元素不同的排列个数<\/span><\/b>为：<br><img class=\"mm-img\" src=\"mm-46e121924afa81.jpg\" style=\"width:100px;height:72px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}]}, {"id": "mKnWPcbxq2q", "topic": "二、栈的<b>顺序存储<\/b>结构 — <span style=\"color:#b45309\"><b><span>顺序栈<\/span><\/b><span class=\"mm-note\">采用顺序存储的栈称为<b>顺序栈。<\/b>也就是说<b>用静态数组存放栈中元素。<\/b><\/span>", "expanded": false, "children": [{"id": "mwK7SKqoCde", "topic": "1、<b>顺序栈<\/b>的实现<br><img class=\"mm-img\" src=\"mm-bb451698de0e49.jpg\" style=\"width:260px;height:147px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true, "children": [{"id": "myxo0liYzpA", "topic": "1、<b>地址连续<\/b>存储", "expanded": true}, {"id": "mfNTuJ3vdSa", "topic": "2、<span style=\"color:#1d4ed8\"><b><span>栈顶指针(<\/span><\/b><a href=\"http://s.top/\" target=\"_blank\" rel=\"noopener\">S.top<\/a><span style=\"color:#1d4ed8\"><b><span>)<\/span><\/b>：<b><mark>永远指向栈顶元素的数组下标<\/mark><\/b>。<span class=\"mm-note\">因此就有了后边入栈、出栈操作上细节的不同。<\/span>", "expanded": true}, {"id": "mnBNWGql4kF", "topic": "3、<b>栈空条件<\/b>：<a href=\"http://S.top\" target=\"_blank\" rel=\"noopener\">S.top<\/a><span style=\"color:#b45309\"><b><span>== -1<\/span><\/b>", "expanded": true}, {"id": "mJbDq3GkWYE", "topic": "4、<b>栈长<\/b>：<a href=\"http://s.top/\" target=\"_blank\" rel=\"noopener\">S.top<\/a><span style=\"color:#b45309\"><b><span>+1<\/span><\/b><b>.<\/b>", "expanded": true}, {"id": "mNkHylvtdjB", "topic": "5、入栈操作<b>受数组上界的约束<\/b>", "expanded": true}]}, {"id": "mSKbZlpWS5u", "topic": "2、顺序栈的基本运算", "expanded": true, "children": [{"id": "m7S91xrsa8N", "topic": "1、<b>初始化<\/b>：<a href=\"http://s.top/\" target=\"_blank\" rel=\"noopener\">S.top<\/a><b>=-1<\/b><span class=\"mm-note\">栈顶指针初始化为-1<\/span>", "expanded": true}, {"id": "m3AYXnc6gje", "topic": "<b>2、判断栈空：栈顶指针是否 = -1<\/b>", "expanded": true}, {"id": "mUlxuZ0pyPR", "topic": "3、<b>入栈<\/b>：<span style=\"color:#1d4ed8\"><b><span>先<\/span><\/b><a href=\"http://s.top/\" target=\"_blank\" rel=\"noopener\">S.top<\/a><span style=\"color:#1d4ed8\"><b><span>+1，再入栈<\/span><\/b><br><img class=\"mm-img\" src=\"mm-303ccb33676608.jpg\" style=\"width:260px;height:151px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">意思是：先指向一块新的空地方，再将新元素放到这个空地方上。<\/span>", "expanded": true}, {"id": "mtT3R0o9Qsi", "topic": "4、<b>出栈<\/b>：<span style=\"color:#1d4ed8\"><b><span>先出栈，再<\/span><\/b><a href=\"http://s.top/\" target=\"_blank\" rel=\"noopener\">S.top<\/a><span style=\"color:#1d4ed8\"><b><span>-1<\/span><\/b><br><img class=\"mm-img\" src=\"mm-01dfd43299515b.jpg\" style=\"width:260px;height:146px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">意思是：先将栈顶元素弹出去，再改变栈顶指针。<\/span>", "expanded": true}, {"id": "mCM2OpoTabT", "topic": "5、读栈顶元素<span class=\"mm-note\">只返回栈顶元素，而不删除栈顶元素。<\/span>", "expanded": true}]}, {"id": "mqcIrySaCVe", "topic": "3、<span style=\"color:#d92d20\"><b><span>共享栈<\/span><\/b><br><img class=\"mm-img\" src=\"mm-ee1a8b17a1775a.jpg\" style=\"width:260px;height:149px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true, "children": [{"id": "mz6s8w6gfSj", "topic": "1、栈底位置相对不变，两个顺序栈共享一个一维数组空间", "expanded": true}, {"id": "meoGjEXiiQ1", "topic": "2、两个<b>栈底设在两端<\/b>，两个<b>栈顶向中间延伸<\/b><span class=\"mm-note\">一个栈底 = 0 ； 一个栈底 = Maxsize-1。<\/span>", "expanded": true}, {"id": "mgOIV2JscsT", "topic": "3、<b>初始化：<\/b><span style=\"color:#1d4ed8\"><b><span>top2 = maxSize ; top1 = -1<\/span><\/b>", "expanded": true}, {"id": "mGzRM4Wr7tn", "topic": "3、<b>栈满判断<\/b>：<span style=\"color:#1d4ed8\"><b><span>top2 =<\/span><\/b><span style=\"color:#1d4ed8\"><span> <\/span><span style=\"color:#1d4ed8\"><b><span>top1 + 1<\/span><\/b>", "expanded": true}, {"id": "mSerWlSArDe", "topic": "4、优点：更<b>有效利用存储<\/b>空间，<span style=\"color:#d92d20\"><b><span>减少上溢风险<\/span><\/b><span class=\"mm-note\">对存储效率没什么影响，依旧为O(1).<\/span>", "expanded": true}, {"id": "m5riHmqTuRz", "topic": "示意图：<br><img class=\"mm-img\" src=\"mm-2b4963031d76ca.jpg\" style=\"width:260px;height:70px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mt7bymgOyWk", "topic": "知识点回顾：<br><img class=\"mm-img\" src=\"mm-b5eba87734f439.jpg\" style=\"width:260px;height:161px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mrxxyya69C7", "topic": "三、栈的<b>链式存储<\/b>结构 —<span style=\"color:#b45309\"><span> <\/span><span style=\"color:#b45309\"><b><span>链式栈<\/span><\/b><span class=\"mm-note\">叫链栈<\/span>", "expanded": true, "children": [{"id": "mipiUDJG4qD", "topic": "<b>1、优点<\/b>", "expanded": true, "children": [{"id": "mwjbDTrrGbI", "topic": "1、便于多个栈共享存储空间", "expanded": true}, {"id": "mqO9hlm0d5g", "topic": "2、提高效率<span class=\"mm-note\">便于结点的插入与删除<\/span>", "expanded": true}, {"id": "mRcROXE8wWb", "topic": "3、<b>不存在栈满上溢<\/b>的情况", "expanded": true}]}, {"id": "mVjgQHDaS6b", "topic": "<b>2、实现<\/b>", "expanded": true, "children": [{"id": "mDaBP28uFHf", "topic": "1、通常使用<b>单链表实现<\/b><span class=\"mm-note\">当然也可以双链表等<\/span>", "expanded": true}, {"id": "mNNeRuHKi13", "topic": "2、所有的<b>操作都在单链表的<\/b><b><mark>表头进行<\/mark><\/b>", "expanded": true}]}, {"id": "mDAY0dcXeIV", "topic": "3、注意：对于带头结点和不带头结点的链栈，具体实现有所差异。", "expanded": true}, {"id": "m2C3NzJYH77", "topic": "<br><img class=\"mm-img\" src=\"mm-edefd43eecd8af.jpg\" style=\"width:260px;height:41px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mhVL3M1q882", "topic": "<b>四、栈和队列<\/b>", "expanded": true, "children": [{"id": "m0OngsQFWjN", "topic": "1、栈和队列<b>具有相同的<\/b><span style=\"color:#1d4ed8\"><b><span>逻辑结构<\/span><\/b>，均为线性表<span class=\"mm-note\">两者只是<b>数据的运算不同<\/b>。<\/span>", "expanded": true}]}, {"id": "mhufVhgKaCz", "topic": "<b>五、补充知识<\/b>", "expanded": true, "children": [{"id": "mZ4uD8caCz9", "topic": "<b>1、<\/b><b><mark>栈的混洗<\/mark><\/b>", "expanded": true, "children": [{"id": "m3JXdQfDcnz", "topic": "<b>1、概念：<\/b><br><img class=\"mm-img\" src=\"mm-b8951653a7af53.jpg\" style=\"width:260px;height:142px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">将栈A的顶元素弹出并压入栈S，或将栈S的顶元素弹出并压入栈B中，经过一系列的操作后，A中元素全部转入B中，则称之为A的一个栈混洗。\n​这里标记  尖括号&lt;：栈顶，方括号 ] ：栈底 ，两个栈的弹出与压入次序不一样由此产生了在B栈的不同排序方式<\/span>", "expanded": true}, {"id": "miEyxcr91ry", "topic": "<b>2、个人理解：就是<\/b><span style=\"color:#1d4ed8\"><b><span>用一个辅助栈S<\/span><\/b><b>，<\/b><span style=\"color:#1d4ed8\"><b><span>只能使用push()/pop()<\/span><\/b><b>将<\/b><span style=\"color:#1d4ed8\"><b><span>栈A中的元素放入栈B中<\/span><\/b><b>，这就叫栈的混洗<\/b>", "expanded": true}]}]}]}, {"id": "mnAjb6X2sRk", "topic": "<b>二、队列<\/b><span class=\"mm-note\">Queue<\/span>", "expanded": false, "children": [{"id": "mziLhJ6x0mP", "topic": "<b>一、概念<\/b>", "expanded": true, "children": [{"id": "mmKy9yHQnDs", "topic": "1、定义<br><img class=\"mm-img\" src=\"mm-ad12f1df74e418.jpg\" style=\"width:260px;height:179px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">一种操作受限的线性表<\/span>", "expanded": true, "children": [{"id": "mgyAFIaKD2e", "topic": "<b>1、队头(Front)<\/b><span class=\"mm-note\">允许删除的一端<\/span>", "expanded": true}, {"id": "mIweibTDOv1", "topic": "<b>2、队尾(Rear)<\/b><span class=\"mm-note\">允许插入的一端<\/span>", "expanded": true}, {"id": "msRs6gHF3SU", "topic": "3、空队列", "expanded": true}]}, {"id": "maH7LFDqQby", "topic": "2、基本操作<br><img class=\"mm-img\" src=\"mm-b41c5aff9f0cd8.jpg\" style=\"width:260px;height:103px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true, "children": [{"id": "mIZAslX6sxM", "topic": "1、初始化", "expanded": true}, {"id": "mGG2Hx9vtyC", "topic": "2、判断队空", "expanded": true}, {"id": "mtdh1G0sbVO", "topic": "3、入队", "expanded": true}, {"id": "mfYVJSbQkjW", "topic": "4、出队", "expanded": true}, {"id": "mzcrVI0Em6M", "topic": "5、读队头元素", "expanded": true}]}]}, {"id": "maw5Ku4XyRC", "topic": "二、队列的<b>顺序存储<\/b>结构<span class=\"mm-note\">用数组存<\/span>", "expanded": true, "children": [{"id": "mXmn4Knm53d", "topic": "<b>1、顺序存储<\/b>", "expanded": true, "children": [{"id": "msRGkic25bJ", "topic": "1、分配<b>连续的存储单元<\/b>存放队列中的元素", "expanded": true}, {"id": "mMXIExuKhQm", "topic": "2、队首指针(<b>Front<\/b>)：<span style=\"color:#b45309\"><b><span>指向<\/span><\/b><span style=\"color:#d92d20\"><b><span>队首元素<\/span><\/b><span class=\"mm-note\">指向队首元素。<\/span>", "expanded": true}, {"id": "meSXBgarWGI", "topic": "3、队尾指针(<b>Rear<\/b>)：<span style=\"color:#b45309\"><b><span>指向<\/span><\/b><span style=\"color:#d92d20\"><b><span>队尾元素的下一个位置<\/span><\/b><span class=\"mm-note\">也就是说<b>：<\/b>​<\/span>", "expanded": true}, {"id": "mL88NDbSkCC", "topic": "<b>4、操作：<\/b>", "expanded": true, "children": [{"id": "m3oECQbLBiV", "topic": "1、<b>初始化：Front = Rear = 0.<\/b>", "expanded": true}, {"id": "mIaKWUC4kiI", "topic": "2、<b>进队：<\/b><span style=\"color:#1d4ed8\"><b><span>先入再++<\/span><\/b><span class=\"mm-note\">先将值送到队尾元素，再将Rear+1.\n因为：<b>Rear指向的就是要放新元素的空区域<\/b>。<\/span>", "expanded": true}, {"id": "mKup1qhZf52", "topic": "<b>3、出队：<\/b><span style=\"color:#1d4ed8\"><b><span>先出再--<\/span><\/b><span class=\"mm-note\">向将队尾元素出队，再将Front--。\n因为：<\/span>", "expanded": true}, {"id": "mONiKENK0Ba", "topic": "4、<b>队列判空：<\/b><span style=\"color:#1d4ed8\"><b><span>Front == Rear == 0<\/span><\/b>", "expanded": true}, {"id": "mtMUKhDrHvg", "topic": "<b>5、<\/b><b><mark>假溢出<\/mark><\/b><b>：<\/b><br><img class=\"mm-img\" src=\"mm-47af37175b3d3f.jpg\" style=\"width:116px;height:141px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\"><b>Rear == Maxsize-1<\/b> 并<b>不能作为判满的条件<\/b>。\n如上图所示：\n此时入队出现<b>上溢出<\/b>现象，但是队列中依旧存在\n可以存放元素的位置。<\/span>", "expanded": true}]}, {"id": "mhBjttvmGUh", "topic": "<br><img class=\"mm-img\" src=\"mm-f75846c3733c3c.jpg\" style=\"width:112px;height:158px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mvEGd5Jsy9L", "topic": "注意：不同地方对Front和Rear的定义不同。<span class=\"mm-note\">因此实际计算时，按条件来。<\/span>", "expanded": true}]}, {"id": "mJdCQZDJqvG", "topic": "2、<b>循环队列<\/b>", "expanded": true, "children": [{"id": "mkQcrWeTReg", "topic": "1、定义：将存储队列元素的表从<b>逻辑上看作一个环<\/b>。", "expanded": true}, {"id": "mmacmPy5Rca", "topic": "2、<b>取余(%)<\/b>:辅助实现循环队列。", "expanded": true}, {"id": "m57muzQEcL5", "topic": "3、操作", "expanded": true, "children": [{"id": "miMqQWgQpgM", "topic": "1、初始化：Front = Rear = 0", "expanded": true}, {"id": "mYcp1p3xd35", "topic": "2、队首指针进1：<b>Front = (Front+1)%maxSize<\/b>", "expanded": true}, {"id": "mmGYye2RwAg", "topic": "3、队尾指针进1：<b>Rear = (Rear+1)%maxSize<\/b>", "expanded": true}, {"id": "m7bSkHLpsih", "topic": "4、<b>队列长度<\/b>：<span style=\"color:#d92d20\"><b><span>(Rear+maxSize-Front)%maxSize<\/span><\/b><span class=\"mm-note\"><b>不要忽略这里的+maxSize<\/b>。\n是为了<b>避免当尾指针索引小于头指针时，(Rear - Front )为负<\/b>的情况。<\/span>", "expanded": true}, {"id": "mH6Qfi7WsgG", "topic": "<span style=\"color:#d92d20\"><span>4、<\/span><span style=\"color:#d92d20\"><b><span>判断队空：Front == Rear<\/span><\/b><span class=\"mm-note\">但是在队满时，条件依旧为Front == Rear，\n因此<b>为了区分两者，有下边的处理方式<\/b>。<\/span>", "expanded": true}]}, {"id": "mfREqIF7lWb", "topic": "4、<span style=\"color:#1d4ed8\"><b><span>区分 队空 与 队满<\/span><\/b>(三种处理)<span class=\"mm-note\">一般都是使用第一种方式。<\/span>", "expanded": true, "children": [{"id": "mkMxDRhYfXJ", "topic": "1、<span style=\"color:#b45309\"><b><span>牺牲一个单元(<\/span><\/b><b><mark>循环队列方式<\/mark><\/b><span style=\"color:#b45309\"><b><span>)：<\/span><\/b><b>也就是上边所讲的方式<\/b><br><img class=\"mm-img\" src=\"mm-806aabd8a6e5fe.jpg\" style=\"width:157px;height:184px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-a024d9a173252b.jpg\" style=\"width:260px;height:147px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">即<b>入队时少用一个存储单元<\/b>。为了可以让逻辑判断队满队空。\n在<b>判空时<\/b>，依旧是判断：<b>front == rear<\/b>\n在<b>判满时<\/b>：那就变成了判断：<b>(Rear+1)%maxSize ==  Front<\/b><\/span>", "expanded": true, "children": [{"id": "muKIx2k3QV6", "topic": "(1)初始化：<br><img class=\"mm-img\" src=\"mm-4436411cc838f7.jpg\" style=\"width:181px;height:182px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">初始化时，指向同一个位置。<\/span>", "expanded": true}, {"id": "mtkahdVdS9X", "topic": "(2)<b>队满：<\/b><span style=\"color:#d92d20\"><b><span>(Rear+1)%maxSize= Front<\/span><\/b><span class=\"mm-note\">即：<b>队头指针在队尾指针的下一位置<\/b>作为队满的标志。<\/span>", "expanded": true}, {"id": "m8kwF119sg9", "topic": "(3)<b>队空<\/b>：(<span style=\"color:#d92d20\"><b><span>Front == Rear<\/span><\/b>)", "expanded": true}]}, {"id": "mjxTJm8PCvE", "topic": "2、<span style=\"color:#b45309\"><b><span>增设数据成员size<\/span><\/b><br><img class=\"mm-img\" src=\"mm-39f939fd2a8dee.jpg\" style=\"width:260px;height:137px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">标记quque中的<b>元素个数<\/b>。<\/span>", "expanded": true, "children": [{"id": "mdKtFrSrmXX", "topic": "(1)队空：size == 0", "expanded": true}, {"id": "mHgypNoZXuv", "topic": "(2)队满：size == maxSize", "expanded": true}]}, {"id": "mjphSbK7wuA", "topic": "3、<span style=\"color:#b45309\"><b><span>增设数据成员<\/span><\/b><span style=\"color:#d92d20\"><b><span>tag<\/span><\/b><br><img class=\"mm-img\" src=\"mm-0ae6336d91faba.jpg\" style=\"width:260px;height:138px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">就是一个标记位。<\/span>", "expanded": true, "children": [{"id": "mG0frTWFTO1", "topic": "<b>作用：标记<\/b><b><mark>最近进行的操作是删除还是插入<\/mark><\/b>", "expanded": true}, {"id": "mKYNUswFq4a", "topic": "<b>tag == 0：删除<\/b><span class=\"mm-note\">若因<b>删除导致<\/b> Front == Rear，则为队空。<\/span>", "expanded": true}, {"id": "mehGmAVF3Jx", "topic": "<b>tag == 1：插入<\/b><span class=\"mm-note\">若因<b>插入导致<\/b> Front == Rear，则为队满。<\/span>", "expanded": true}]}, {"id": "myfvO2FEHWe", "topic": "(4<b>)元素个数<\/b>：<span style=\"color:#d92d20\"><b><span>(Rear-Front+maxSize)%maxSize<\/span><\/b>", "expanded": true}]}, {"id": "mflXc0dyLWV", "topic": "5、循环队列的操作", "expanded": true, "children": [{"id": "mIhXhgdiL2b", "topic": "1、初始化", "expanded": true}, {"id": "mbNu53Dinav", "topic": "2、判断队空", "expanded": true}, {"id": "mrVIWGJF0ED", "topic": "3、入队", "expanded": true}, {"id": "me7frhE5yC9", "topic": "4、出队", "expanded": true}]}]}, {"id": "mKChghSkhsL", "topic": "知识点回顾：<br><img class=\"mm-img\" src=\"mm-d52185103c541c.jpg\" style=\"width:260px;height:185px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">注意几个点：\n1、<b>看清楚题目中队首、队尾指针的含义<\/b>，<b>到底指向的是哪里<\/b>。\n2、根据题目所描绘的实现，确定<b>判空、判满的方法<\/b><\/span>", "expanded": true}]}, {"id": "mK0aX1gqNay", "topic": "三、队列的<b>链式存储<\/b>结构<span class=\"mm-note\">用链表存。<\/span>", "expanded": true, "children": [{"id": "mqiKfFdtB9n", "topic": "1、链式存储：<span style=\"color:#1d4ed8\"><b><span>头结点作为队首，尾结点作为队尾<\/span><\/b><br><img class=\"mm-img\" src=\"mm-7d26fb2ac2c436.jpg\" style=\"width:260px;height:178px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">称为链队列。\n即：<b>从链表尾巴入队，从链表头部出队<\/b>。<\/span>", "expanded": true, "children": [{"id": "mrrSesOsiuZ", "topic": "<span style=\"color:#1d4ed8\"><b><span>不带头结点<\/span><\/b><b> — front和Rear都初始化为null<\/b><br><img class=\"mm-img\" src=\"mm-873ba677caf606.jpg\" style=\"width:260px;height:164px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">注意，这里虽然不带头节点，但是实际运用中，多数是设计为<b>带头结点的单链表<\/b>。<\/span>", "expanded": true, "children": [{"id": "mttSoiVFIMB", "topic": "<b>因此：在<\/b><b><mark>第一次插入时，首/尾指针都会变<\/mark><\/b><b>；而在<\/b><b><mark>后续插入时，就不会变了<\/mark><\/b><b>。<\/b><span class=\"mm-note\"><b>初始时，首尾指针都指向NULL。第一次插入一个结点后，就会讲首尾指针都指向这个结点。<\/b><\/span>", "expanded": true}]}, {"id": "mRe8qny3Q3K", "topic": "<span style=\"color:#1d4ed8\"><b><span>带头结点<\/span><\/b><b> - front和Rear都初始化为头结点<\/b><br><img class=\"mm-img\" src=\"mm-47f87884d856ee.jpg\" style=\"width:260px;height:151px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "monW1mXeVv1", "topic": "1、<b>本质<\/b>：<span style=\"color:#b45309\"><b><span>同时<\/span><\/b><b><mark>带有队头指针和队尾指针的单链表<\/mark><\/b><b>。<\/b><span class=\"mm-note\">头指针指向队头结点，尾指针指向队尾节点。<\/span>", "expanded": true}]}, {"id": "mpb3mN7pCOb", "topic": "2、基本操作", "expanded": true, "children": [{"id": "maNieeVoyp0", "topic": "1、初始化<span class=\"mm-note\">记得<b>建立头结点<\/b>。<\/span>", "expanded": true}, {"id": "mLbxyPWWOzu", "topic": "2、<b>判空<\/b>：<b>Front == NULL &amp;&amp; Rear == NULL<\/b><span class=\"mm-note\">两者均为空。<\/span>", "expanded": true}, {"id": "mNaLCUF4inx", "topic": "3、<b>入队<\/b>：创建新节点，插入链表<span class=\"mm-note\">并且同步更新Rear指针，指向这个新节点。<\/span>", "expanded": true}, {"id": "mmuNJ08WsQ4", "topic": "4、<b>出队<\/b>：摘除队头元素。<span class=\"mm-note\">1、先判断队列是否为空。\n2、更新Front，使其指向下一个结点。\n3、注意<b>临界条件<\/b>：当队列中只剩一个元素，出队后将front与rear均设置为NULL。<\/span>", "expanded": true}]}]}, {"id": "mOOOv1XMGtq", "topic": "<b>四、双端队列<\/b><span class=\"mm-note\">两端都可以进行出队和入队操作的队列。<\/span>", "expanded": true, "children": [{"id": "mhXxBRiJJw7", "topic": "1、<span style=\"color:#1d4ed8\"><b><span>输出受限<\/span><\/b>的双端队列：<b>只有一端可以输出<\/b><br><img class=\"mm-img\" src=\"mm-32563d6b78afa2.jpg\" style=\"width:260px;height:70px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">允许在一端进行插入和删除，但是在<b>另一端只允许插入<\/b>。<\/span>", "expanded": true}, {"id": "mgyu2FumEPg", "topic": "2、<span style=\"color:#1d4ed8\"><b><span>输入受限<\/span><\/b>的双端队列：<b>只有一端可以输入<\/b><br><img class=\"mm-img\" src=\"mm-92480f4b67e8ed.jpg\" style=\"width:260px;height:71px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">允许在一端进行插入和删除，但是在<b>另一端只允许删除<\/b>。<\/span>", "expanded": true}, {"id": "mML2I9bZIZJ", "topic": "<b>3、栈中合法的序列，在双端队列中也一定合法<\/b>。<b>反过来就不对了。<\/b>", "expanded": true}, {"id": "m8skjvWSycC", "topic": "示意图：<br><img class=\"mm-img\" src=\"mm-f58d37013fb040.jpg\" style=\"width:260px;height:68px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mFhnMXSdcQU", "topic": "<br><img class=\"mm-img\" src=\"mm-a0267815281faa.jpg\" style=\"width:260px;height:83px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}]}, {"id": "mshAfa0InJF", "topic": "<b>三、栈和队列的应用<\/b>", "expanded": false, "children": [{"id": "mcIF0IVAyYl", "topic": "1、栈", "expanded": true, "children": [{"id": "m67WbyDcVaf", "topic": "<b>1、括号匹配<\/b><br><img class=\"mm-img\" src=\"mm-042f1c5e3768b5.jpg\" style=\"width:260px;height:291px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "m94XUuDF9W1", "topic": "<a href=\"https://blog.csdn.net/sgbfblog/article/details/8001651?ydreferer=aHR0cHM6Ly9jbi5iaW5nLmNvbS8%3D\" target=\"_blank\" rel=\"noopener\">2、后缀表达式求值<\/a><br><img class=\"mm-img\" src=\"mm-ea83f415b662e6.jpg\" style=\"width:260px;height:246px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">后缀表达式(逆波兰表达式)。<\/span>", "expanded": true}, {"id": "m0f7sUmxUxQ", "topic": "3、<b>中缀转为后缀表达式<\/b>", "expanded": true, "children": [{"id": "mOSVTZTt5Na", "topic": "要点：<span style=\"color:#1d4ed8\"><b><span>栈中存储操作符，<\/span><\/b><span style=\"color:#d92d20\"><b><span>后缀表达式中无括号符，<\/span><\/b><span style=\"color:#1d4ed8\"><b><span>优先级高的先计算（弹栈）。<\/span><\/b><br><img class=\"mm-img\" src=\"mm-4ca0b770a85c93.jpg\" style=\"width:260px;height:98px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">思路：<b>用栈<\/b>来显示<b>运算符的优先级<\/b>。\n\n具体实现：只要<b>栈顶的优先级大于等于当前运算符<\/b>，那就<b>弹栈，使之优先计算<\/b> ！<\/span>", "expanded": true}, {"id": "mBK85ojJSYZ", "topic": "代码实现：<br><img class=\"mm-img\" src=\"mm-ea83f415b662e6.jpg\" style=\"width:260px;height:246px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "m61GQZhkBO7", "topic": "<b>注意点：<\/b>", "expanded": true, "children": [{"id": "m5sRSQraYoe", "topic": "1. <b>右括号<\/b>是<span style=\"color:#1d4ed8\"><b><span>始终不入栈<\/span><\/b>的<span class=\"mm-note\">在遇到右括号时，一直弹栈，直到遇到左括号或者栈空。<\/span>", "expanded": true}, {"id": "mPlZxpM9ylM", "topic": "2. 当<b>栈中操作符<\/b><b><mark>优先级 ≥ <\/mark><\/b><b>当前扫描的操作符时<\/b>，就出栈。<span class=\"mm-note\">一定注意：是大于等于。<\/span>", "expanded": true}]}]}, {"id": "mDwCdVoqKhi", "topic": "<b>3、在递归中的应用<\/b><span class=\"mm-note\"><b>裴波那契数<\/b><\/span>", "expanded": true, "children": [{"id": "m8500gly7sU", "topic": "(1)递归模型不能循环定义<span class=\"mm-note\">否则导致栈溢出<\/span>", "expanded": true}, {"id": "mO5TwHDmRMo", "topic": "(2)递归效率低<span class=\"mm-note\">有许多重复的运算<\/span>", "expanded": true}]}, {"id": "mn13dgSnWUI", "topic": "4. <b>递归程序对比非递归程序，<\/b><span style=\"color:#1d4ed8\"><b><span>效率较低<\/span><\/b><span class=\"mm-note\">因为递归算法在计算机执行过程中，会有很多重复计算。<\/span>", "expanded": true}]}, {"id": "malrTaZLInk", "topic": "<b>2、队列<\/b>", "expanded": true, "children": [{"id": "m9BsTl0uaYb", "topic": "<b>1、层次遍历<\/b><span class=\"mm-note\">队列作为辅助队列<\/span>", "expanded": true}, {"id": "mYBPyJ6bYXB", "topic": "2、<span style=\"color:#1d4ed8\"><b><span>在计算机系统中的应用<\/span><\/b>", "expanded": true, "children": [{"id": "mKwdq24ZoiO", "topic": "1、解决主机与外部设备之间<span style=\"color:#d92d20\"><b><span>速度不匹配的问题<\/span><\/b>", "expanded": true, "children": [{"id": "mUOeeJtavfn", "topic": "解决方法：<b>设置打印缓冲区<\/b>", "expanded": true}]}, {"id": "md5BbyjXbZb", "topic": "2、解决由多用户引起的<span style=\"color:#d92d20\"><b><span>资源竞争问题<\/span><\/b><span class=\"mm-note\">如CPU资源竞争<\/span>", "expanded": true}]}]}]}, {"id": "mAhAoRHRH1c", "topic": "<b>四、数组与特殊矩阵<\/b>", "expanded": false, "children": [{"id": "mPrvNhqpwAy", "topic": "<b>1、数组<\/b>", "expanded": true, "children": [{"id": "mOsriGEAoc5", "topic": "1、定义：n个<b>相同类型数据元素<\/b>构成的<b>有限序列<\/b>。", "expanded": true}, {"id": "m98gdUmviTT", "topic": "2、与线性表的关系：数组是线性表的推广。<span class=\"mm-note\"><b>二维数组(多阶<\/b>)也可以视为：<b>元素是定长线性表的线性表<\/b>。<\/span>", "expanded": true}, {"id": "miT3IJXGTPg", "topic": "3、<b>维界<\/b>:下标的取值范围。", "expanded": true}, {"id": "mZFtpPUs2gF", "topic": "<b>4、存储结构<\/b>：数组在内存中占用<b>一段连续的存储空间<\/b><span class=\"mm-note\">连续存放<\/span>", "expanded": true, "children": [{"id": "mgIs4ow2VZX", "topic": "<br><img class=\"mm-img\" src=\"mm-765fcf7cf9b237.jpg\" style=\"width:260px;height:28px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">L是每个数组元素所占的存储单元。<\/span>", "expanded": true}]}, {"id": "mRjGQdC9cj7", "topic": "<b>5、两种映射方法<\/b>", "expanded": true, "children": [{"id": "m1zN5OWTD0O", "topic": "1、行优先<span class=\"mm-note\">先存第一行、再存第二行以此类推<\/span>", "expanded": true}, {"id": "m3sTlbnvutY", "topic": "2、列优先<span class=\"mm-note\">先存第一列、再存第二列以此类推<\/span>", "expanded": true}]}]}, {"id": "mOMadxQAfKa", "topic": "<b>2、特殊矩阵的压缩存储<\/b>", "expanded": true, "children": [{"id": "mYAmpfNIuZC", "topic": "1、<b>压缩存储<\/b>：<span style=\"color:#1d4ed8\"><b><span>多个相同的元素只分配一个存储空间<\/span><\/b><span style=\"color:#0e7a52\"><span>，<\/span><b>对<\/b><span style=\"color:#1d4ed8\"><b><span>0元素不分配存储空间<\/span><\/b><span style=\"color:#0e7a52\"><b><span>。<\/span><\/b>", "expanded": true}, {"id": "mA35yEPyNGx", "topic": "2<b>、特殊矩阵<\/b>：<span class=\"mm-note\">指具有许多相同矩阵元素或零元素，且相同矩阵或零元素的分布有一定规律。\nP101<\/span>", "expanded": true, "children": [{"id": "mO3jEMQVFXa", "topic": "1、<span style=\"color:#1d4ed8\"><b><span>对称矩阵<\/span><\/b>:<b>下三角区+行优先<\/b> 推导公式<br><img class=\"mm-img\" src=\"mm-44cbbb4af362ed.jpg\" style=\"width:260px;height:162px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">A[i,j] = A[j,i]<\/span>", "expanded": true, "children": [{"id": "mz6LhqAqs7P", "topic": "1、一维数组大小：<span style=\"color:#1d4ed8\"><b><span>n*(n+1)/2<\/span><\/b>", "expanded": true}, {"id": "mfEmwfl6czc", "topic": "2、矩阵下标与数组下标的转换<span class=\"mm-note\">此种情况：数组下标从0开始，矩阵下标从1开始<\/span>", "expanded": true}, {"id": "mTmUq2lQav2", "topic": "3、计算A[i,j]在数组中的下标，也就是计算A[j,i]的存储下标<span class=\"mm-note\">有的题目就需要这种思路，如P102第11题。<\/span>", "expanded": true}, {"id": "mc8KlZTMOSL", "topic": "4、<b>想访问上三角区的元素<\/b>怎么办？：<b>对称性<\/b><span class=\"mm-note\">虽然上三角区并没有进行存储，但是由于对称矩阵的特性，a[i] [j] = a[j] [i]，我们可以进行转换，相当于我们访问的仍然是下三角区的元素<\/span>", "expanded": true}]}, {"id": "mVRivVSCLdJ", "topic": "2、<span style=\"color:#1d4ed8\"><b><span>三角矩阵<\/span><\/b><br><img class=\"mm-img\" src=\"mm-0fa82a5db04cf4.jpg\" style=\"width:260px;height:145px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">上三角/下三角<\/span>", "expanded": true, "children": [{"id": "mQZvHONlVud", "topic": "1、一维数组大小：<span style=\"color:#1d4ed8\"><b><span>n*(n+1)/2+1<\/span><\/b><span class=\"mm-note\">加1是因为：<b>最后多了一个位置存放常量C（常量的数组下标：n*(n+1)/2）<\/b><\/span>", "expanded": true}, {"id": "m8lfPc4Oxg0", "topic": "2、压缩方法(坐标转换)：<b>行/列优先，并且<\/b><span style=\"color:#1d4ed8\"><b><span>最后一个位置存放常量C<\/span><\/b><span class=\"mm-note\">这里最后一个位置就是数组下标为n*(n+1)/2的位置\n且行/列优先的推导式有所不同，务必注意<\/span>", "expanded": true}, {"id": "mKTVhktD09l", "topic": "<b>3、下三角— 行优先：<\/b><br><img class=\"mm-img\" src=\"mm-af9e6f7e0c0e88.jpg\" style=\"width:260px;height:146px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">就是<b>包括对角线的下半部分有不同元素<\/b>。<\/span>", "expanded": true}, {"id": "mRisqRyGVQn", "topic": "<b>4、上三角— 行优先：<\/b><br><img class=\"mm-img\" src=\"mm-f4055e7cf6f9ad.jpg\" style=\"width:260px;height:142px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\"><b>包括对角线的上半部分有不同元素。<\/b><\/span>", "expanded": true}]}, {"id": "msUFWijmTAx", "topic": "3、<span style=\"color:#1d4ed8\"><b><span>三对角矩阵<\/span><\/b><br><img class=\"mm-img\" src=\"mm-ce110a83f1faa3.jpg\" style=\"width:260px;height:162px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">也叫<b>带状矩阵<\/b><\/span>", "expanded": true, "children": [{"id": "muMujCfAPDU", "topic": "1、特点：<b>|i-j| &gt; 1时，有A[i,j]=0.<\/b>", "expanded": true}, {"id": "mXNPGTgMteo", "topic": "2、坐标转换: <span style=\"color:#1d4ed8\"><b><span>k = 2i+j-3<\/span><\/b><span class=\"mm-note\">行优先。<\/span>", "expanded": true}, {"id": "my90jNe8cCN", "topic": "3、注意：<span style=\"color:#1d4ed8\"><b><span>已知数组下标，反推矩阵坐标<\/span><\/b>的方法<span class=\"mm-note\">已知k，反推i,j<\/span>", "expanded": true}, {"id": "mz0efIVRXaj", "topic": "4、一维数组大小：<b>3n-2<\/b>", "expanded": true}, {"id": "mqYGQy5Z42A", "topic": "<b>特点： <\/b><span style=\"color:#d92d20\"><b><span>第一行和最后一行两个元素，其余都是三个元素<\/span><\/b>", "expanded": true}]}]}, {"id": "mkcvtNOqtFu", "topic": "注意点：<b><mark>观察题目中矩阵下标和数组下标是从0开始还是从1开始<\/mark><\/b><span class=\"mm-note\">开始下标不同，对应转换公式需要重新推导<\/span>", "expanded": true}]}, {"id": "mtaH6A38jmt", "topic": "3、<b>稀疏矩阵<\/b>", "expanded": true, "children": [{"id": "mg6TyovTPO9", "topic": "1、定义：矩阵中<b>非零元素个数远少于零元素个数<\/b><br><img class=\"mm-img\" src=\"mm-92217c9fc2b5ac.jpg\" style=\"width:260px;height:145px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">且<b>非0元素的分布没有规律<\/b>。<\/span>", "expanded": true}, {"id": "m20aLmhL6U7", "topic": "<b>2、压缩存储方法：<\/b>", "expanded": true, "children": [{"id": "m9OA04vbbfE", "topic": "<b>1、顺序存储<\/b><span style=\"color:#1d4ed8\"><b><span>：<\/span><\/b><span style=\"color:#b45309\"><b><span>三元组<\/span><\/b><span style=\"color:#1d4ed8\"><b><span>(行标、列标、值)<\/span><\/b><br><img class=\"mm-img\" src=\"mm-291304b9c208f7.jpg\" style=\"width:260px;height:70px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\"><b>仅存储非零元素<\/b>​<\/span>", "expanded": true, "children": [{"id": "mSilCAFZVP7", "topic": "缺点：<b>失去了随机存取的特性。<\/b>", "expanded": true}]}, {"id": "mkUYNxbTRnU", "topic": "2、<b>十字链表法：<\/b><br><img class=\"mm-img\" src=\"mm-fa252ebf9a3b63.jpg\" style=\"width:260px;height:135px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">即：数组为行，该数组每一个元素是一个<b>指针，作为列<\/b>。\n<b>指针中存储了：行号，列号，值<\/b><\/span>", "expanded": true}]}]}, {"id": "m4GlfHo1GqD", "topic": "4、考点/易错点：", "expanded": true, "children": [{"id": "mDeKyWHxjvS", "topic": "做题时一定辨别：<span style=\"color:#d92d20\"><b><span>矩阵/数组下标从哪里开始(0/1)<\/span><\/b><br><img class=\"mm-img\" src=\"mm-bfc71be7ef2996.jpg\" style=\"width:260px;height:117px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-4f997bca125a0a.jpg\" style=\"width:260px;height:127px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">等差数列求和掌握清楚<\/span>", "expanded": true}]}]}, {"id": "m9l7Df72bIE", "topic": "<b>五、广义表<\/b>", "expanded": false, "children": [{"id": "my9VP1oqNXa", "topic": "1、定义：<br><img class=\"mm-img\" src=\"mm-a5262decfaa889.jpg\" style=\"width:260px;height:89px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mQivRnpqXu6", "topic": "<b>2、原子与子表：<\/b><br><img class=\"mm-img\" src=\"mm-cade9a2dc858c8.jpg\" style=\"width:260px;height:132px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mJwBrfAuofl", "topic": "<b>3、表头与表尾：<\/b><br><img class=\"mm-img\" src=\"mm-7e39f484a54b10.jpg\" style=\"width:260px;height:53px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "m8G13YWHTTR", "topic": "<b>4、表长：<\/b><br><img class=\"mm-img\" src=\"mm-8774f33769c832.jpg\" style=\"width:260px;height:51px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mEqT9gaOwfk", "topic": "<b>5、深度：<\/b><br><img class=\"mm-img\" src=\"mm-66191b51d7f701.jpg\" style=\"width:260px;height:103px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}]}}</script>
<script>
(function(){
  var ME = window.MindElixir && (window.MindElixir.default || window.MindElixir);
  var raw = JSON.parse(document.getElementById('data').textContent);
  var data = raw.data, title = raw.title;
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  var mind = new ME({
    el: '#mindex',
    direction: 1,
    editable: false,
    contextMenu: false,
    toolBar: false,
    keypress: false,
    allowUndo: false,
    scaleMin: 0.2,
    scaleMax: 2.4,
    markdown: function(t){ return t; },
    theme: {
      name: 'MubuPaper',
      palette: ['#0e7a52','#1d4ed8','#c2410c','#7c3aed','#b45309','#0f766e','#be123c','#4d7c0f'],
      cssVar: {}
    }
  });
  mind.init({ nodeData: data, direction: 1 });
  // ---- 自由平移：mind-elixir 自带 move() 会把容器中心限制在内容范围内，
  //      手机上表现为「拖到边界就卡住」。这里改成无边界平移。 ----
  var canvas = mind.map;
  var mapEl = document.getElementById('mindex');
  function xyOf(tr){
    var m = /translate3d\((-?[\d.]+)px,\s*(-?[\d.]+)px/.exec(tr || '');
    return { x: m ? parseFloat(m[1]) : 0, y: m ? parseFloat(m[2]) : 0 };
  }
  function applyT(x, y, s){
    canvas.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) scale(' + s + ')';
  }
  // mind-elixir 的 transform-origin 在根节点 X + 画布 50% Y，缩放/居中必须带上它
  function originPx(){
    var o = (canvas.style.transformOrigin || '50% 50%').split(' ');
    function px(v, total){
      if (!v) return total / 2;
      if (v.indexOf('%') > 0) return parseFloat(v) / 100 * total;
      return parseFloat(v) || 0;
    }
    return { x: px(o[0], canvas.offsetWidth), y: px(o[1], canvas.offsetHeight) };
  }
  function contentOf(vx, vy){
    var o = originPx(), p = xyOf(canvas.style.transform), s = mind.scaleVal || 1;
    return { x: o.x + (vx - p.x - o.x) / s, y: o.y + (vy - p.y - o.y) / s };
  }
  mind.move = function(dx, dy){
    var p = xyOf(canvas.style.transform);
    applyT(p.x + dx, p.y + dy, mind.scaleVal);
    return true;
  };

  var userTouched = false;
  // 首屏：保持可读比例，对准根节点；图片加载会改变高度，多点校正几次
  function focusRoot(force){
    var _d = document.getElementById('doc');
    if (_d && _d.classList.contains('on')) return;
    if (userTouched && !force) return;
    var s = window.innerWidth < 520 ? 0.9 : 1;
    try {
      var el = mind.findEle(data.id) || document.querySelector('me-root');
      if (!el) return;
      var c = mind.container.getBoundingClientRect();
      var r = el.getBoundingClientRect();
      var pt = contentOf(r.left + r.width / 2 - c.left, r.top + r.height / 2 - c.top);
      var o = originPx();
      var nx = c.width / 2 - o.x - (pt.x - o.x) * s;
      var ny = c.height / 2 - o.y - (pt.y - o.y) * s;
      mind.scaleVal = s;
      applyT(nx, ny, s);
    } catch(e){}
  }
  setTimeout(focusRoot, 80);
  setTimeout(focusRoot, 500);
  setTimeout(focusRoot, 1500);
  window.addEventListener('resize', function(){ setTimeout(focusRoot, 120); });
  ['pointerdown','wheel'].forEach(function(ev){
    mapEl.addEventListener(ev, function(){ userTouched = true; }, {passive:true});
  });

  // ---- 以双指中点为锚缩放（自带 scale() 的偏移算法在 WebView 里会跳） ----
  function zoomAt(newS, cx, cy){
    newS = Math.max(0.2, Math.min(2.4, newS));
    var c = mind.container.getBoundingClientRect();
    var p = xyOf(canvas.style.transform);
    var k = newS / mind.scaleVal;
    var o = originPx();
    var x = cx - c.left, y = cy - c.top;
    applyT(x - o.x - (x - p.x - o.x) * k, y - o.y - (y - p.y - o.y) * k, newS);
    mind.scaleVal = newS;
  }

  // 返回：优先浏览器返回，直接打开时回 App 知识页
  document.getElementById('back').onclick = function(){
    if (history.length > 1 && document.referrer) { history.back(); }
    else { location.href = '/app/#kb'; }
  };
  document.getElementById('fit').onclick = function(){ mind.scaleFit(); };

  // 折叠 / 展开（数据级操作，保留原折叠状态）
  function setExpand(minDepth, open){
    var d = clone(data);
    (function walk(n, depth){
      if (depth >= minDepth && (n.children||[]).length) n.expanded = open;
      (n.children||[]).forEach(function(c){ walk(c, depth+1); });
    })(d, 0);
    mind.refresh({ nodeData: d, direction: 1 });
    setTimeout(function(){ focusRoot(true); }, 80);
  }
  var acts = document.querySelector('.acts');
  var bFold = document.createElement('button'); bFold.textContent = '收起'; bFold.onclick = function(){ setExpand(2, false); };
  var bOpen = document.createElement('button'); bOpen.textContent = '展开'; bOpen.onclick = function(){ setExpand(0, true); };
  acts.insertBefore(bFold, document.getElementById('fit'));
  acts.insertBefore(bOpen, document.getElementById('fit'));

  // 搜索
  var qbar = document.getElementById('qbar'), q = document.getElementById('q'),
      qres = document.getElementById('qres'), hits = [], idx = -1, last = '';
  document.getElementById('qbtn').onclick = function(){
    if (isDocView) {
      var db = document.getElementById('dbar');
      db.hidden = !db.hidden;
      if (!db.hidden) document.getElementById('dq').focus();
      return;
    }
    qbar.hidden = !qbar.hidden;
    if (!qbar.hidden) { q.focus(); }
  };
  document.getElementById('qclose').onclick = function(){ qbar.hidden = true; clearHit(); };

  function textOf(html){
    var d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function collect(){
    var arr = [];
    (function walk(n, path){

  dq.addEventListener('input', docSearch);
  dq.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); docJump(dIdx + 1); } });
  document.getElementById('dqprev').onclick = function(){ docJump(dIdx - 1); };
  document.getElementById('dqnext').onclick = function(){ docJump(dIdx + 1); };
  document.getElementById('dqclose').onclick = function(){ dq.value = ''; docClear(); dq.blur(); };

  // 默认进入文档视图
  setTimeout(function(){ setView('doc'); }, 80);

  // 超大图初始折叠，避免首屏卡顿
  var _total = (function c(n){ return 1 + (n.children || []).reduce(function(a, b){ return a + c(b); }, 0); })(data);
  if (_total > 500) {
    setTimeout(function(){
      setExpand(2, false);
      tipEl.textContent = '节点较多，已折叠到 2 层 · 点「展开」查看全部';
      tipEl.hidden = false;
      setTimeout(function(){ tipEl.hidden = true; }, 5200);
    }, 1400);
  }
  window.__mind = mind;
  window.__mm = { zoomAt: zoomAt, focusRoot: focusRoot, setView: setView };
})();
</script>
</body></html>
