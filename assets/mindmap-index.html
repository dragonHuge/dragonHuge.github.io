<script>
(function(){
  var q=document.getElementById('q'), qc=document.getElementById('qc');
  if(!q) return;
  function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var dataEl=document.getElementById('mmdata');
  var DATA=dataEl?JSON.parse(dataEl.textContent):null;
  q.addEventListener('input', function(){
    var kw=q.value.trim().toLowerCase(), n=0;
    if (DATA) {
      var home=document.getElementById('home'), box=document.getElementById('results');
      if(!kw){ box.hidden=true; box.innerHTML=''; if(home)home.hidden=false; qc.textContent=''; return; }
      var hits=DATA.filter(function(d){return (d.kw||'').indexOf(kw)>=0;});
      if(home)home.hidden=true;
      box.hidden=false;
      box.innerHTML=hits.slice(0,80).map(function(d){
        return '<a class="card" href="'+d.url+'"><b>'+esc(d.title)+'</b>'
          +'<span>'+esc(d.folder)+' · '+d.count+' 个节点</span></a>';
      }).join('');
      qc.textContent=hits.length+' 个结果';
      return;
    }
    document.querySelectorAll('.card').forEach(function(c){
      var hit=!kw || (c.getAttribute('data-kw')||'').indexOf(kw)>=0;
      c.hidden=!hit;
      if(hit) n++;
    });
    document.querySelectorAll('.grp').forEach(function(g){
      g.hidden = !g.querySelector('.card:not([hidden])');
    });
    document.querySelectorAll('section.sec').forEach(function(s){
      s.hidden = !s.querySelector('.card:not([hidden])');
    });
    qc.textContent = kw ? (n + ' 个结果') : '';
  });
})();
</script>
