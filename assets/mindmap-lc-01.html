<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#fbfaf6">
<title>二叉树篇 · 知识导图</title>
<link rel="stylesheet" href="mind-elixir.css">
<style>
:root{
  --paper:#fbfaf6; --ink:#1b1d1c; --mut:#6b6f6d; --line:#e6e4dc; --green:#0e7a52;
  --hd: calc(56px + env(safe-area-inset-top));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
body{overflow:hidden;overscroll-behavior:none}
.hd{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(251,250,246,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ic{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;
  font-size:15px;line-height:1;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.ttl{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
.ttl b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-size:10px;color:var(--mut);letter-spacing:.02em}
.acts{display:flex;gap:6px;flex:0 0 auto}
.acts button{border:1px solid var(--line);background:#fff;color:#3c403e;border-radius:9px;
  font-size:11.5px;height:30px;padding:0 9px;cursor:pointer}
.acts button:active{transform:scale(.97)}
#qbar{position:fixed;left:0;right:0;top:var(--hd);z-index:55;display:flex;gap:6px;align-items:center;
  padding:7px 10px;background:rgba(251,250,246,.97);border-bottom:1px solid var(--line)}
#qbar[hidden]{display:none}
#q{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:9px;padding:0 10px;
  font-size:13px;background:#fff;color:var(--ink);outline:none}
#q:focus{border-color:#b9d8c9}
#qres{font-size:11px;color:var(--mut);min-width:44px;text-align:center}
#qbar button{height:32px;width:32px;border:1px solid var(--line);background:#fff;border-radius:9px;
  color:var(--mut);font-size:13px;cursor:pointer}
.tip{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:50;font-size:10.5px;color:var(--mut);background:rgba(251,250,246,.9);border:1px solid var(--line);
  border-radius:99px;padding:4px 12px;pointer-events:none;white-space:nowrap}
#map{position:fixed;top:0;right:0;bottom:0;left:0;padding-top:var(--hd)}
#mindex{width:100%;height:100%}
.map-container{background:var(--paper)!important;
  --bgcolor:var(--paper); --color:#1b1d1c; --main-color:#0e7a52;
  --main-bgcolor:#eef5f1; --main-border:1px solid #cfe3d9;
  --root-color:#fff; --root-bgcolor:#0e7a52; --root-border-color:#0e7a52;
  --root-radius:12px; --main-radius:10px; --topic-padding:5px 9px;
  --node-gap-x:22px; --node-gap-y:5px; --main-gap-x:54px; --main-gap-y:26px;
  --map-padding:60px 80px 120px;
  font-size:14px;
}
.map-container me-root me-tpc{font-size:20px;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 18px rgba(14,122,82,.18)}
.map-container me-parent me-tpc{line-height:1.55;white-space:normal;max-width:30em}
.map-container me-tpc .text{max-width:30em}
.map-container b,.map-container strong{font-weight:700}
.map-container mark{background:#fff0b8;color:inherit;padding:0 2px;border-radius:3px}
.map-container u{text-decoration:underline;text-underline-offset:2px}
.map-container .mm-note{display:block;margin-top:5px;padding:3px 0 1px 7px;border-left:2px solid #d9d6cb;
  color:#6f736f;font-size:11.5px;line-height:1.5;white-space:pre-wrap}
.map-container .mm-tbl{display:block;margin-top:6px;max-width:360px;overflow-x:auto}
.map-container table{border-collapse:collapse;font-size:11px;line-height:1.4;background:#fff}
.map-container th,.map-container td{border:1px solid #e2e2da;padding:3px 6px;text-align:left;vertical-align:top}
.map-container th{background:#f6f4ec;font-weight:600}
.map-container .mm-img{border-radius:8px;margin-top:4px;max-width:100%;display:block;
  pointer-events:auto;cursor:zoom-in}
.map-container me-epd{transform:scale(1.15)}
.me-hit{outline:2px solid #f0b429!important;outline-offset:3px;border-radius:6px}
/* 图片灯箱 */
.lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;background:rgba(12,14,13,.96);
  display:flex;flex-direction:column;opacity:0;transition:opacity .18s ease}
.lb.on{opacity:1}
.lb[hidden]{display:none}
.lb-top{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.lb-top span{flex:1;min-width:0;color:#cfd6d1;font-size:11.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.lb-top button{height:30px;min-width:34px;padding:0 8px;border:1px solid rgba(255,255,255,.18);
  background:transparent;color:#e8eae8;border-radius:8px;font-size:11.5px;cursor:pointer}
.lb-stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.lb-stage:active{cursor:grabbing}
.lb-stage img{max-width:none;max-height:none;transform-origin:0 0;will-change:transform;
  user-select:none;-webkit-user-drag:none}
.lb-tip{text-align:center;color:rgba(255,255,255,.4);font-size:10.5px;
  padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
/* 文档视图 */
#doc{position:fixed;top:var(--hd);left:0;right:0;bottom:0;overflow:auto;background:var(--paper);
  padding:18px 16px calc(48px + env(safe-area-inset-bottom));display:none;--dstep:16px}
#doc.on{display:block}
#doc[hidden]{display:none}
.doc-inner{max-width:760px;margin:0 auto;font-size:14.5px;line-height:1.75}
.doc-root{font-family:"Songti SC","Noto Serif SC",serif;font-size:21px;font-weight:700;
  padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
#doc details{margin:0}
#doc summary{list-style:none;cursor:pointer;border-radius:7px;position:relative;
  padding:4px 8px 4px calc(10px + var(--d,0) * var(--dstep));line-height:1.65}
#doc summary:hover{background:#f5f3ec}
#doc summary::-webkit-details-marker{display:none}
#doc summary:before{content:"▸";position:absolute;left:calc(var(--d,0) * var(--dstep) - 1px);top:5px;
  font-size:10px;color:#9aa39d;transition:transform .15s}
#doc details[open]>summary:before{transform:rotate(90deg)}
#doc summary:hover{background:#f2f0e8}
#doc .dleaf{padding:3px 4px 3px calc(14px + var(--d,0) * var(--dstep));position:relative}
#doc .dleaf:before{content:"";position:absolute;left:calc(4px + var(--d,0) * var(--dstep));top:12px;width:4px;height:4px;
  border-radius:50%;background:#c9cec9}
#doc details details summary{font-weight:500}
#doc .dtext img{display:block;max-width:min(100%,340px);border-radius:8px;margin:6px 0}
#doc .mm-note{display:block;margin:4px 0 2px;padding:3px 0 1px 8px;border-left:2px solid #d9d6cb;
  color:#6f736f;font-size:12.5px;line-height:1.65;white-space:pre-wrap}
#doc mark{background:#fff0b8;color:inherit;padding:0 2px;border-radius:3px}
#doc u{text-decoration:underline;text-underline-offset:2px}
#doc code{background:#f1efe6;padding:1px 4px;border-radius:4px;font-size:12.5px}
#doc table{border-collapse:collapse;font-size:12px;margin:6px 0;background:#fff}
#doc th,#doc td{border:1px solid #e2e2da;padding:4px 7px;text-align:left;vertical-align:top}
#doc th{background:#f6f4ec}
#doc a{color:#1d4ed8}
#doc .mm-tbl{display:block;max-width:100%;overflow-x:auto}
@media(max-width:520px){#doc{padding:14px 12px 60px;--dstep:13px}.doc-inner{font-size:14px}}
#doc summary.lv1{font-size:18px;font-weight:700;margin-top:16px;color:#14181a;
  border-bottom:1px solid var(--line);padding-bottom:6px}
#doc summary.lv2{font-size:16px;font-weight:650;margin-top:8px;color:#1b1f1d}
#doc summary.lv3{font-size:14.5px;font-weight:600;color:#2a2f2c}
#doc .dleaf.lv3{font-size:14px}
#doc .dleaf.lv4,#doc .dleaf.lv5{font-size:13.5px;color:#3a3f3c}
#doc img{cursor:zoom-in}
.dsearch{position:sticky;top:0;z-index:12;display:flex;gap:6px;align-items:center;
  padding:8px 0 10px;background:linear-gradient(var(--paper) 80%,transparent);max-width:760px;margin:0 auto}
.dsearch input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:9px;
  padding:0 10px;font-size:13px;background:#fff;outline:none}
.dsearch input:focus{border-color:#b9d8c9}
.dsearch span{font-size:10.5px;color:var(--mut);min-width:46px;text-align:center}
.dsearch button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;
  color:var(--mut);font-size:12px;cursor:pointer}
#doc mark.dhit{background:#ffe58a;color:inherit;border-radius:2px}
#doc mark.dhit.cur{background:#f5b942}
.dt-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.dt-head h3{margin:0}
#docTocClose{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;
  font-size:16px;color:var(--mut);cursor:pointer}
#docTocBtn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:130;
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;
  box-shadow:0 6px 18px rgba(20,30,25,.12);color:#3c403e;font-size:11px;cursor:pointer;display:none}
#docTocBtn.on{display:block}
#docMask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,14,12,.35);z-index:140;
  display:none}
#docMask.on{display:block}
#docToc{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:330px;background:#fff;z-index:150;
  transform:translateX(102%);transition:transform .22s ease;overflow:auto;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
  box-shadow:-12px 0 30px rgba(0,0,0,.12)}
#docToc.on{transform:none}
#docToc h3{font-size:13px;margin:0 0 10px;color:var(--mut);font-weight:600;letter-spacing:.04em}
.toc-i{display:block;padding:7px 6px;border-radius:7px;text-decoration:none;color:#22282a;
  font-size:13px;line-height:1.45}
.toc-i:hover{background:#f4f2ea}
.toc-i.t2{padding-left:20px;font-size:12.5px;color:#3d4441}
.toc-i.t3{padding-left:34px;font-size:12px;color:#5b625e}
@media(max-width:520px){#doc{padding:14px 12px 60px}.doc-inner{font-size:14px}}
@media (max-width:520px){
  .acts button{padding:0 7px;font-size:11px}
  .map-container{font-size:13px;--map-padding:40px 46px 96px;--main-gap-x:44px}
  .map-container me-root me-tpc{font-size:18px}
  .tip{display:none}
}
</style>
</head>
<body>
<div class="hd">
  <button class="ic" id="back" aria-label="返回">←</button>
  <div class="ttl"><b>二叉树篇</b><small>幕布导图 · 246 个节点</small></div>
  <div class="acts">
    <button id="viewToggle">文档</button>
    <button id="qbtn">搜索</button>
    <button id="fit">适应</button>
    <button id="docOpen" hidden>展开</button>
    <button id="docClose" hidden>收起</button>
  </div>
</div>
<div id="qbar" hidden>
  <input id="q" placeholder="搜索节点内容…" autocomplete="off" enterkeyhint="search">
  <span id="qres"></span>
  <button id="qprev" aria-label="上一个">↑</button>
  <button id="qnext" aria-label="下一个">↓</button>
  <button id="qclose" aria-label="关闭搜索">×</button>
</div>
<div id="map"><div id="mindex"></div></div>
<div id="doc">
  <div id="dbar" hidden><div class="dsearch"><input id="dq" placeholder="在本文档中搜索…" autocomplete="off"><span id="dqc"></span><button id="dqprev" type="button">↑</button><button id="dqnext" type="button">↓</button><button id="dqclose" type="button">×</button></div></div>
  <div class="doc-inner" id="docInner"></div>
</div>
<button id="docTocBtn" type="button">目录</button>
<div id="docMask"></div>
<aside id="docToc"><div class="dt-head"><h3>本篇目录</h3><button id="docTocClose" type="button" aria-label="关闭目录">×</button></div><nav id="docTocList"></nav></aside>
<div class="tip">单指拖动 · 双指缩放 · 双击图片放大 · 点圆点收起/展开</div>
<div class="lb" id="lb" hidden>
  <div class="lb-top"><span id="lbname"></span>
    <button id="lbfit" type="button">适应</button>
    <button id="lb1x" type="button">1:1</button>
    <button id="lbclose" type="button" aria-label="关闭">×</button></div>
  <div class="lb-stage" id="lbstage"><img id="lbimg" alt=""></div>
  <div class="lb-tip">双指缩放 · 拖动移动 · 双击复位</div>
</div>

<script type="application/json" id="data">{"title": "二叉树篇", "data": {"id": "mvirtual-root", "topic": "<b>二叉树篇<\/b>", "expanded": true, "children": [{"id": "mDv4FcGQUul", "topic": "<b>一、常用方法：<\/b>", "expanded": true, "children": [{"id": "mJCsyHuG6tx", "topic": "<b>1、递归三部曲：<\/b><span class=\"mm-note\">1、确定递归终止条件\n        2、单层递归逻辑\n        3、下次递归<\/span>", "expanded": true}, {"id": "mnBLP8JsHme", "topic": "<b>2、迭代遍历：<\/b>", "expanded": false, "children": [{"id": "mOREfJeDomB", "topic": "①<b>先序<\/b>遍历 ---&gt; 访问<b>中<\/b>，且<b>入栈顺序：右 左<\/b><br><img class=\"mm-img\" src=\"mm-15bd7d40bd97e0.jpg\" style=\"width:260px;height:173px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mCyEy0syQUl", "topic": "②<b>后序<\/b>遍历", "expanded": false, "children": [{"id": "mJDKga1QYHv", "topic": "<b>实现1<\/b>： (<span style=\"color:#1d4ed8\"><b><span>搭乘前序遍历的顺风车<\/span><\/b><b>)<\/b> 访问<b>中<\/b>，且<b>入栈顺序:    左 右<\/b>，再将整个<b>遍历序列反转<\/b>", "expanded": true}, {"id": "mZhcBAn9hwg", "topic": "<b>实现2：直接迭代<\/b><br><img class=\"mm-img\" src=\"mm-dc8db5f0cd2ae3.jpg\" style=\"width:260px;height:64px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-ff4c230371e100.jpg\" style=\"width:260px;height:274px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "muCyqPUHDU1", "topic": "③<b>中序<\/b>遍历 ---&gt; <b>先将所有左孩子压入栈<\/b>，所有左孩子压入后，<b>逐个弹栈，记录弹出结点后<\/b>，<b>再将其右结点压入<\/b>.......直到栈空。<br><img class=\"mm-img\" src=\"mm-6a1d83921e810d.jpg\" style=\"width:260px;height:283px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "myd3l4Av08P", "topic": "④<b>层序<\/b>遍历 ---&gt; 用<b>队列<\/b>，并且用<b>size<\/b>记录每一层的结点个数。<br><img class=\"mm-img\" src=\"mm-b07f6de1487785.jpg\" style=\"width:260px;height:249px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mqFD8ShAJ7i", "topic": "<b>3、在计算深度、高度<\/b>等时，一般<b>：<\/b><span style=\"color:#1d4ed8\"><b><span>维护一个全局变量<\/span><\/b>", "expanded": true}, {"id": "mx5cqemWX0m", "topic": "<b>4、求解<\/b><span style=\"color:#1d4ed8\"><b><span>BST<\/span><\/b><b>的问题时，优先考虑利用它 “<\/b><b><mark>中序遍历序列有序(升序)<\/mark><\/b><b>”的特性解决问题<\/b>", "expanded": true}, {"id": "m1eyK3NczvB", "topic": "<span style=\"color:#d92d20\"><b><span>递归关键：<\/span><\/b><b><mark>只关注单层逻辑即可！！！！<\/mark><\/b>", "expanded": true}]}, {"id": "m5GNSeXAcwO", "topic": "<b>二、题目总结：<\/b>", "expanded": true, "children": [{"id": "mQeliSO0lHn", "topic": "<b>1、98-验证二叉搜索树(BST)-中等<\/b>", "expanded": false, "children": [{"id": "m9Yy95wmbq9", "topic": "思路1：<b>转换有序数组判断法<\/b>  ---基于BST的特性构建，中序遍历构建有序数组，最后判断数组是否真的有序即可。", "expanded": true}, {"id": "mdoRb6jye1o", "topic": "思路2：<b>递归(<\/b><b><mark>中序遍历<\/mark><\/b><b>)   \t<\/b>\t\t --- 注意这里！！需要维护一个<span style=\"color:#1d4ed8\"><b><span>preNode。<\/span><\/b><span class=\"mm-note\">根据中序遍历进行递归，<b>如果在途中 preNode.val &gt; curNode.val<\/b>，那就直接返回False；\n<b>否则<\/b>就将<b>左右子树的搜查结果相与<\/b>。\n注意：<b>递归函数返回值：bool<\/b><\/span>", "expanded": true, "children": [{"id": "mr6vJwyJyFS", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-f8c5e51c958c80.jpg\" style=\"width:260px;height:136px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mL2xK5QXDSE", "topic": "思路3：<b>迭代<\/b>             ---有树就离不开递归和迭代", "expanded": true}, {"id": "m55gsZiQJQv", "topic": "<b>注意：二叉搜索树可以为空！<\/b>", "expanded": true}]}, {"id": "mI3IKvZEX1r", "topic": "<b>2、100-相同的树-简单<\/b>", "expanded": false, "children": [{"id": "m7IWsrtWmjJ", "topic": "直接递归判断两者即可，<span style=\"color:#1d4ed8\"><b><span>左右子树的判断结果相与<\/span><\/b><b>。<\/b>", "expanded": true}, {"id": "mABy7E311Ue", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-51cec13422cd98.jpg\" style=\"width:260px;height:143px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mH2KsxSlMQt", "topic": "<b>3、101-对称的二叉树-简单<\/b>", "expanded": false, "children": [{"id": "mGxHr95Vulz", "topic": "注意：若当前比较的两结点相等，那么在之后的比较中，要遵守：<span style=\"color:#1d4ed8\"><b><span>内侧比较 与 外侧比较<\/span><\/b> 的方法来找下一次比较的两个结点。", "expanded": true}, {"id": "mphDMgdRMKc", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-977085d8e1eca6.jpg\" style=\"width:260px;height:281px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mEMcig50bae", "topic": "<b>4、104-二叉树的最大深度-简单<\/b>", "expanded": true, "children": [{"id": "mGejSyLColJ", "topic": "<b>维护一个全局变量<\/b>即可，找到<span style=\"color:#1d4ed8\"><b><span>左右子树中较高的高度<\/span><\/b>。", "expanded": true}, {"id": "mc38lgoqJlj", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-2b56f2eea63be2.jpg\" style=\"width:260px;height:181px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mo7rdKza71y", "topic": "<b>5、106-从后序与中序遍历构建二叉树-中等<\/b>", "expanded": false, "children": [{"id": "mPtnMkxaFje", "topic": "思路：<span class=\"mm-note\"><b>算法思路：<\/b>\n对当前层来说。\n<b>我们首先可以从每一次的后序数组中，找到当前根节点(也就是后序数组的最后一个元素)。<\/b>\n<b>然后拿着这个根节点，就能将中序数组切割为左右两部分(切割成当前这个根节点的左右子树)<\/b>\n<b>接着我们拿着切割好的中前序/中后序，再去切割后序数组，切割为左后序/右后序。<\/b>\n<b>最后分别递归处理左右两部分子树，直到完成。<\/b><\/span>", "expanded": true}, {"id": "moTEJwHnh2b", "topic": "* 后序数组：最后一个元素是当前根节点。", "expanded": true}, {"id": "ma2FBn5dpT1", "topic": "* 中序数组：用当前根节点将数组分为左右两个部分(分别对应当前根节点的左子树中序数组、右子树中序数组)", "expanded": true}]}, {"id": "m1loR1BGuT2", "topic": "<b>6、105-从前序与中序遍历构建二叉树-中等<\/b>", "expanded": false, "children": [{"id": "m3PF2liqbsY", "topic": "解法2：<br><img class=\"mm-img\" src=\"mm-eba3834866d68c.jpg\" style=\"width:260px;height:334px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mIcX0se4cuk", "topic": "<b>7、107.二叉树的层次遍历II-中等<\/b>", "expanded": false, "children": [{"id": "mOOQ87TXnu6", "topic": "题目描述：<span class=\"mm-note\">给你二叉树的根节点 root ，返回其节点值 <b>自底向上<\/b>的层序遍历 。 （即按从叶子节点所在层到根节点所在的层，逐层从左向右遍历）<\/span>", "expanded": true}, {"id": "muvJWZ266tS", "topic": "思路：<b>用<\/b><span style=\"color:#1d4ed8\"><b><span>栈作为辅助<\/span><\/b><b>,将自上向下层序遍历的每一次结果压入栈，<\/b><span style=\"color:#1d4ed8\"><b><span>全部结束后再逐个弹栈<\/span><\/b>", "expanded": true}, {"id": "mm1xwwLGLVd", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-3498899b9f1fe2.jpg\" style=\"width:260px;height:251px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mWMIIPLZbKg", "topic": "<b>8、108-将有序数组转换为二叉搜索树-简单<\/b>", "expanded": false, "children": [{"id": "mG7RLLLFMh4", "topic": "思路：1、找在<span style=\"color:#1d4ed8\"><b><span>当前区间里的中间节点作为当前根<\/span><\/b>；2、然后<span style=\"color:#1d4ed8\"><b><span>递归处理左右子区间<\/span><\/b>。", "expanded": true}, {"id": "mWMMl2lygne", "topic": "注意：<b>控制循环不变量<\/b>", "expanded": true}, {"id": "myCG6ABvh3j", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-64362cdfe7c3f4.jpg\" style=\"width:260px;height:285px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "m9sdllAoeGT", "topic": "<b>9、110.平衡二叉树(AVL)的判定-简单<\/b>", "expanded": false, "children": [{"id": "mRuO3QfdayJ", "topic": "题目：<span class=\"mm-note\">判断是否为平衡二叉树？<\/span>", "expanded": true}, {"id": "m86vLfYFKoJ", "topic": "思路：注意这里<b>使用<\/b><span style=\"color:#1d4ed8\"><b><span>-1来表示不是平衡二叉树的情况<\/span><\/b><b>。<\/b>递归单层逻辑（<b>getHeight()<\/b>）：<b>求出左右子树的高度差<\/b>，判断。<span class=\"mm-note\">递归判断即可。<b>平衡二叉树的定义：左右子树高度相差不大于1<\/b>。<\/span>", "expanded": true}, {"id": "mLGQQzyfb5m", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-f666e2fdbba044.jpg\" style=\"width:260px;height:174px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mVSxBXhdl2E", "topic": "<b>10、111.二叉树的最小深度-简单<\/b>", "expanded": true, "children": [{"id": "m95P1nlYApt", "topic": "<b>解法1：递归DFS <\/b><br><img class=\"mm-img\" src=\"mm-f8c8a514f30077.jpg\" style=\"width:260px;height:197px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "m0zrYPzL8jT", "topic": "<b>解法2：层序 ----- <\/b>如果<b>首次遇到叶子结点<\/b>，那就<b>说明已经找到了最小高度<\/b><br><img class=\"mm-img\" src=\"mm-f16e22667d1ac7.jpg\" style=\"width:260px;height:245px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "m2Aedx4OUyx", "topic": "<b>11、112.路径总和-简单<\/b>", "expanded": true, "children": [{"id": "m0ZdkhWMXn8", "topic": "<b>题目：<\/b><span class=\"mm-note\">给你二叉树的根节点 root 和一个表示目标和的整数 targetSum 。\n判断该树中是否存在 <b>根节点到叶子节点<\/b> 的路径，这条路径上所有节点值相加等于目标和 targetSum 。如果存在，返回 true ；否则，返回 false 。<\/span>", "expanded": true}, {"id": "mGOMYb00Fbs", "topic": "<b>思路<\/b>：对于每一个结点，<span style=\"color:#1d4ed8\"><b><span>同步计算并保存一个从根节点到该节点的路径的和作为value<\/span><\/b>，如果<b>当前结点既是叶子结点，且当前value==targetSum<\/b>，那么就说明找到了，结束递归即可。", "expanded": true}, {"id": "menNYqCv1AX", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-53d85bc62559e5.jpg\" style=\"width:260px;height:208px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "m9xnaSTZvPA", "topic": "<b>12、113.路径总和II-中等<\/b>", "expanded": true, "children": [{"id": "mSUrEd5EubH", "topic": "<b>题目：<\/b><span class=\"mm-note\">给你二叉树的根节点 root 和一个整数目标和 targetSum ，找出所有 <b>从根节点到叶子节点<\/b> <b>路径总和等于给定目标和的路径<\/b>。\n需要求出路径！！！<\/span>", "expanded": true}, {"id": "m5RhT9btwiL", "topic": "<b>思路：<\/b><b><mark>递归+回溯。<\/mark><\/b><b>用一个<\/b><span style=\"color:#1d4ed8\"><b><span>全局path存储当前路径<\/span><\/b><b>，一个<\/b><span style=\"color:#1d4ed8\"><b><span>参数value计算路径总和<\/span><\/b><b>。<\/b>", "expanded": true}, {"id": "mL9ugSOfOR0", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-cd9be10c8f2601.jpg\" style=\"width:260px;height:284px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mweED3bjLX0", "topic": "<b>13、116.填充每个节点的下一个右侧节点指针-中等<\/b>", "expanded": false, "children": [{"id": "mlzpu4t2VVA", "topic": "<b>题目：调整next的指向如下图<\/b><br><img class=\"mm-img\" src=\"mm-6d6e512bb88cc1.jpg\" style=\"width:260px;height:90px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mjeqqtei9Gi", "topic": "<b>思路：<\/b><span style=\"color:#1d4ed8\"><b><span>层序遍历，在每一层遍历时做操作<\/span><\/b><b>即可。<\/b>", "expanded": true}, {"id": "mrMeLMe3i1F", "topic": "代码：<br><img class=\"mm-img\" src=\"mm-50cffd56c42c66.jpg\" style=\"width:260px;height:240px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mHx50t3WpHK", "topic": "<b> 14、117.填充每个节点的下一个右侧节点指针II-中等<\/b>", "expanded": false, "children": [{"id": "mGNKpsvpJfQ", "topic": "<b>题目：与116差不多，只是这里<\/b><span style=\"color:#1d4ed8\"><b><span>树不再是满树<\/span><\/b><b>而已<\/b>", "expanded": true}, {"id": "mBSQk2tldOM", "topic": "思路：<br><img class=\"mm-img\" src=\"mm-ddd8722914b9c8.jpg\" style=\"width:260px;height:244px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mvu2pEueBw3", "topic": "<b> 15、199.二叉树的右视图-中等<\/b>", "expanded": false, "children": [{"id": "mGtVD6K7DWZ", "topic": "<b>题目：<\/b><br><img class=\"mm-img\" src=\"mm-8ca7e4b13bf301.jpg\" style=\"width:260px;height:108px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mmc8DUdC1Fa", "topic": "<b>思路1<\/b>：改进<b>层序遍历<\/b>，将<span style=\"color:#1d4ed8\"><b><span>每一层的结点右孩子先入队列<\/span><\/b>，<b>存储每一层的第一个右结点<\/b>。<br><img class=\"mm-img\" src=\"mm-e4a5918c881afa.jpg\" style=\"width:260px;height:267px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mBNu5bBsDHq", "topic": "<b>思路2：DSF，递归时<\/b><span style=\"color:#1d4ed8\"><b><span>右孩子先搜索<\/span><\/b><b>，再用一个<\/b><span style=\"color:#1d4ed8\"><b><span>depth来判断是否是初次进入下一层<\/span><\/b><b>；如果是初次进入下一层，就记录当前结点<\/b><br><img class=\"mm-img\" src=\"mm-add39774a11752.jpg\" style=\"width:260px;height:142px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mAjweXURgM0", "topic": "<b>16、222.完全二叉树的节点个数-中等<\/b>", "expanded": false, "children": [{"id": "mDdh0jr0LPl", "topic": "思路1：<b>暴力递归<\/b><br><img class=\"mm-img\" src=\"mm-95dcd3b8177c20.jpg\" style=\"width:260px;height:120px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mVkb9E77Amg", "topic": "思路2：<b>利用完全二叉树的特性<\/b><span style=\"color:#1d4ed8\"><b><span>+满二叉树的结点个数计算公式<\/span><\/b><br><img class=\"mm-img\" src=\"mm-15e238c1bd31df.jpg\" style=\"width:260px;height:286px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "m8dqvj9NP8S", "topic": "<b>17、226.翻转二叉树-简单<\/b>", "expanded": false, "children": [{"id": "mQhXobK6k1t", "topic": "题目：<br><img class=\"mm-img\" src=\"mm-074f23497097e5.jpg\" style=\"width:260px;height:88px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "m8NfkUeHyAx", "topic": "<b>思路1：DFS<\/b><br><img class=\"mm-img\" src=\"mm-a80235b2b43151.jpg\" style=\"width:260px;height:282px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "m8g9xX5ycnp", "topic": "<b>思路2：BFS---- 在层序过程中，<\/b><span style=\"color:#1d4ed8\"><b><span>依次交换每一个结点的左右孩子即可<\/span><\/b><br><img class=\"mm-img\" src=\"mm-c43a8423a4bea2.jpg\" style=\"width:260px;height:241px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mRLpKTI9hOR", "topic": "<b>18、236.二叉树的最近公共祖先-中等<\/b>", "expanded": false, "children": [{"id": "mQ8jiAsiVJX", "topic": "题目：<span class=\"mm-note\">给定一个<b>二叉树,<\/b> 找到该树中两个指定节点的<b>最近公共祖先<\/b>。<\/span>", "expanded": true}, {"id": "m9ALzxxH2A2", "topic": "思路：求<b>最小公共祖先<\/b>，需要<span style=\"color:#1d4ed8\"><b><span>从底向上遍历<\/span><\/b>，那么二叉树，只能通过<b><mark>后序遍历<\/mark><\/b><span style=\"color:#1d4ed8\"><b><span>（即：回溯）<\/span><\/b><b>实现从底向上的遍历方式<\/b>。<br><img class=\"mm-img\" src=\"mm-97694551668ba2.jpg\" style=\"width:260px;height:254px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "m7SOGoGjYVk", "topic": "<b>19、235.二叉搜索树(BST)的最近公共祖先-中等<\/b>", "expanded": false, "children": [{"id": "mbxiVHRwwS1", "topic": "题目：<span class=\"mm-note\">给定一个<b>二叉搜索树<\/b>, 找到该树中两个指定节点的最近公共祖先。<\/span>", "expanded": true}, {"id": "mQaO0pebOCH", "topic": "<b>思路1：与236思路一致 —— <\/b><span style=\"color:#1d4ed8\"><b><span>后序遍历(回溯)<\/span><\/b><br><img class=\"mm-img\" src=\"mm-53182b1da315c7.jpg\" style=\"width:260px;height:183px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mrba3kgnWoK", "topic": "<b>思路2：利用BST的特性 ---- <\/b><span style=\"color:#1d4ed8\"><b><span>左 &lt; 中 &lt; 右<\/span><\/b><b>，则：<\/b><b><mark>公共祖先结点必然在[p,q]区间内<\/mark><\/b><b>，因此：<\/b><span style=\"color:#1d4ed8\"><b><span>找到第一个符合条件的点<\/span><\/b><b>即可。<\/b><br><img class=\"mm-img\" src=\"mm-db4ae18ad668ae.jpg\" style=\"width:260px;height:97px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-14a0cab801c68d.jpg\" style=\"width:260px;height:126px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mYc40NJKZel", "topic": "<b>20、257.二叉树的所有路径-简单<\/b>", "expanded": false, "children": [{"id": "mpGapHSqaum", "topic": "1、题目：<br><img class=\"mm-img\" src=\"mm-61e329b8431dfa.jpg\" style=\"width:260px;height:133px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">算出<b>根节点到叶结点的所有路径<\/b>。<\/span>", "expanded": true}, {"id": "m3vM3IdTc3c", "topic": "<b>2、思路：全局路径存储+<\/b><span style=\"color:#1d4ed8\"><b><span>回溯<\/span><\/b>", "expanded": true}, {"id": "mCYwU5tda9H", "topic": "3、代码：<br><img class=\"mm-img\" src=\"mm-38cc14cc28cef9.jpg\" style=\"width:260px;height:274px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mo2apDZZy04", "topic": "<b>21、404.左叶子结点之和-简单<\/b>", "expanded": false, "children": [{"id": "mOfPNauRuCi", "topic": "1、题目：<br><img class=\"mm-img\" src=\"mm-9309b5db4ad5bc.jpg\" style=\"width:260px;height:133px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">收集<b>所有左叶子结点的数值和<\/b>。<\/span>", "expanded": true}, {"id": "mnwTFHS3pyB", "topic": "2、思路：平时我们解二叉树的题目时，已经习惯了通过节点的左右孩子判断本节点的属性，而<b><mark>本题我们要通过节点的父节点判断本节点的属性<\/mark><\/b>。<span class=\"mm-note\">核心：判断<b>当前结点的左孩子是否为叶子结点<\/b>。<\/span>", "expanded": true}, {"id": "mtutJU31SP9", "topic": "3、代码：<br><img class=\"mm-img\" src=\"mm-3509698a4c5338.jpg\" style=\"width:260px;height:178px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mKc3ViLM5pX", "topic": "<b>22、429.n叉树的层序遍历-中等<\/b>", "expanded": false, "children": [{"id": "mb7FpbZg36y", "topic": "1、题目：<br><img class=\"mm-img\" src=\"mm-24b9289e91b265.jpg\" style=\"width:260px;height:172px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">字面意思，求出层序遍历序列即可<\/span>", "expanded": true}, {"id": "mmU1ySSMQ1x", "topic": "2、思路：<span style=\"color:#1d4ed8\"><b><span>层序遍历的变种<\/span><\/b>写法", "expanded": true}, {"id": "mkqFaD0RlBy", "topic": "3、代码：<br><img class=\"mm-img\" src=\"mm-7df47e596ebe01.jpg\" style=\"width:260px;height:253px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "m3q4YGo5R1f", "topic": "<b>23、450.删除BST中的结点-中等<\/b>", "expanded": false, "children": [{"id": "m9GbxTXidT9", "topic": "1、题目：<br><img class=\"mm-img\" src=\"mm-5db32131e586fa.jpg\" style=\"width:260px;height:121px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">给定一个二叉搜索树的根节点 <b>root<\/b> 和一个值 <b>key<\/b>，删除二叉搜索树中的 <b>key<\/b> 对应的节点，并保证二叉搜索树的性质不变。返回二叉搜索树（有可能被更新）的根节点的引用。<\/span>", "expanded": true}, {"id": "m28q1wfp4Wv", "topic": "2、思路：", "expanded": false, "children": [{"id": "mKeB6hom9lG", "topic": "① <b>只考虑单层递归逻辑<\/b>，且<span style=\"color:#d92d20\"><b><span>明确递归返回值的含义<\/span><\/b>：<b>返回在<\/b><span style=\"color:#1d4ed8\"><b><span>当前层根节点上做了删除操作之后的新根节点<\/span><\/b><b>！！！！<\/b><span class=\"mm-note\">因此，<b>只考虑当前结点做了删除之后，根节点变成了什么即可<\/b>！！！<\/span>", "expanded": true}, {"id": "m59vKw0CxJv", "topic": "②<mark> <\/mark><b><mark>BST的删除结点处理逻辑<\/mark><\/b>：<br><img class=\"mm-img\" src=\"mm-59172ae8bece8f.jpg\" style=\"width:260px;height:202px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "miq5lSQ8BNu", "topic": "3、代码：这里当要删除结点有两个孩子时，是用<b>直接后继顶替，并且是 <\/b><span style=\"color:#1d4ed8\"><b><span>直接令当前结点的右孩子作为新的根节点<\/span><\/b><b>了（与王道书上有点出入）<\/b><br><img class=\"mm-img\" src=\"mm-a8e1c10debfd11.jpg\" style=\"width:260px;height:293px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">这样做：<b>不会改变BST性质，与王道书上的实现相比，只是树不太平衡<\/b>罢了。<\/span>", "expanded": true}]}, {"id": "m5WRjpikp3e", "topic": "<b>24、501.二叉搜索树(BST)中的众数-简单<\/b>", "expanded": false, "children": [{"id": "myD1rHtywPk", "topic": "1、题目：<span class=\"mm-note\">给你一个含重复值的二叉搜索树（BST）的根节点 root ，找出并<b>返回 BST 中的所有<\/b> <a href=\"https://baike.baidu.com/item/%E4%BC%97%E6%95%B0/44796\" target=\"_blank\" rel=\"noopener\">众数<\/a>（即，出现频率最高的元素）。\n如果树中有不止一个众数，可以按 <b>任意顺序<\/b> 返回。<\/span>", "expanded": true}, {"id": "m1WIykN8Aga", "topic": "2、思路：<span style=\"color:#1d4ed8\"><b><span>中序遍历使之有序<\/span><\/b><b>，然后<\/b><span style=\"color:#1d4ed8\"><b><span>保存前一个结点<\/span><\/b><b>，然后用辅助全局变量，在有序序列中，<\/b><span style=\"color:#1d4ed8\"><b><span>一边统计连续相同数的个数<\/span><\/b><b>并且<\/b><span style=\"color:#1d4ed8\"><b><span>更新众数队列<\/span><\/b>。<span class=\"mm-note\">要点就是在<b>全局中维护四个数据<\/b>（一个数组,两个int,一个node）:\n       <b>modeList：当前众数数组(存储所有众数值)<\/b>\n       <b>maxCount：众数的最多个数<\/b> \n       <b>count：当前数的出现次数<\/b>\n       <b>preNode<\/b>：<b>前一个节点<\/b><\/span>", "expanded": true}, {"id": "mSwj3Tu4exW", "topic": "3、代码：", "expanded": false, "children": [{"id": "mvyWkZ2XiaO", "topic": "<b>① 四个辅助全局变量<\/b><br><img class=\"mm-img\" src=\"mm-9a82e392b2612b.jpg\" style=\"width:260px;height:110px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mouGlhP5EyW", "topic": "② 递归函数(<b><mark>核心函数<\/mark><\/b>)<br><img class=\"mm-img\" src=\"mm-f574db5bcc8c4b.jpg\" style=\"width:260px;height:397px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}]}, {"id": "mDN8pSEu5IE", "topic": "<b>25、513.找树左下角的值-中等<\/b>", "expanded": false, "children": [{"id": "m05ty396gHR", "topic": "1、题目：<b>最左 <\/b>且<b> 最下<\/b><br><img class=\"mm-img\" src=\"mm-2822bbc2dc2bed.jpg\" style=\"width:260px;height:180px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mNioRvfQlpe", "topic": "<b>2、思路1(<\/b><b><mark>递归<\/mark><\/b><b>)：<\/b><span style=\"color:#1d4ed8\"><b><span>优先遍历左子树<\/span><\/b><b>，同时<\/b><span style=\"color:#1d4ed8\"><b><span>记录深度<\/span><\/b><b>，找到<\/b><span style=\"color:#1d4ed8\"><b><span>深度最大的左叶子结点<\/span><\/b><b>即可。<\/b><br><img class=\"mm-img\" src=\"mm-86a1fb2cb73e77.jpg\" style=\"width:260px;height:247px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mVpyq3aQ9Lk", "topic": "<b>3、思路2(<\/b><b><mark>层序遍历<\/mark><\/b><b>)：找到<\/b><span style=\"color:#1d4ed8\"><b><span>最后一层的从左向右的第一个结点值<\/span><\/b><b>即可。<\/b><br><img class=\"mm-img\" src=\"mm-ee488f1597e930.jpg\" style=\"width:260px;height:202px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "moz2kp5C92C", "topic": "<b>26、515.在每个树行中找最大值-中等<\/b>", "expanded": false, "children": [{"id": "mRAQJLw6Hi1", "topic": "1、题目：<br><img class=\"mm-img\" src=\"mm-eaf7fed20cda20.jpg\" style=\"width:260px;height:136px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><span class=\"mm-note\">将每一层的最大值组织为数组，并返回。<\/span>", "expanded": true}, {"id": "mXpiTEsXAZn", "topic": "<b>2、思路：层序遍历的变种<\/b>", "expanded": true}, {"id": "mNn30pQjd9I", "topic": "3、代码<br><img class=\"mm-img\" src=\"mm-43ed09f25f963a.jpg\" style=\"width:260px;height:196px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mBM5noI31vW", "topic": "<b>27、530.二叉搜索树(BST)的最小绝对值差-简单<\/b>", "expanded": false, "children": [{"id": "mh6dwN5JoVj", "topic": "1、题目：<span class=\"mm-note\">给你一个二叉搜索树的根节点 root ，返回 <b>树中任意两不同节点值之间的最小差值<\/b> 。<\/span>", "expanded": true}, {"id": "m8us68Rv71A", "topic": "2、思路：<mark>BST<\/mark><b><mark>中序遍历有序<\/mark><\/b>，因此：<b>中序遍历，<\/b><span style=\"color:#1d4ed8\"><b><span>维护preNode<\/span><\/b><b>，计算<\/b><span style=\"color:#1d4ed8\"><b><span>有序数组相邻元素的差值<\/span><\/b><b>，找到最小差值<\/b>。", "expanded": true}, {"id": "mcKOFXRnY1e", "topic": "3、代码：<br><img class=\"mm-img\" src=\"mm-dc4939e4f447c8.jpg\" style=\"width:260px;height:199px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "m3KLgqFrPAV", "topic": "<b>28、538.把二叉搜索树(BST)转换为累加树-中等<\/b>", "expanded": false, "children": [{"id": "mBDN1Eefn0r", "topic": "1、题目：<span class=\"mm-note\">给出二叉 <b>搜索<\/b> 树的根节点，该树的节点值各不相同，请你将其转换为累加树（Greater Sum Tree），使<b>每个节点 node 的新值等于原树中大于或等于 node.val 的值之和<\/b>。<\/span>", "expanded": true}, {"id": "myvIy0fgieK", "topic": "2、分析：由<b>BST特性可知<\/b>，<span style=\"color:#d92d20\"><b><span>所有大于node.val的结点都位于node的右子树上<\/span><\/b>。", "expanded": true}, {"id": "mKtPnquQE1P", "topic": "3、因此我们的<b>思路<\/b>：<span style=\"color:#1d4ed8\"><b><span>以<\/span><\/b><b><mark>右中左(反中序遍历)<\/mark><\/b><span style=\"color:#1d4ed8\"><b><span>的遍历顺序累加结点值<\/span><\/b><b>即可。<\/b>且此时需要维护一个<b>preNode<\/b>。", "expanded": true}, {"id": "mmzSJG2208x", "topic": "4、代码：<br><img class=\"mm-img\" src=\"mm-4197c3fa763b58.jpg\" style=\"width:260px;height:236px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mxqB9hShFYb", "topic": "<b>29、559.n叉树的最大深度-简单<\/b>", "expanded": false, "children": [{"id": "m1B7U1Akd3 ；否则，<b>不为<\/b> null 的节点将直接作为新二叉树的节点。\n返回合并后的二叉树。<\/span>", "expanded": true}, {"id": "mWJRXPvAycM", "topic": "2、思路：<b>递归函数返回值的含义<\/b>：<span style=\"color:#1d4ed8\"><b><span>返回当前两节点合并后的根节点<\/span><\/b>。<b>往root1上累加。<\/b>", "expanded": true}, {"id": "mUbGGaPDPYT", "topic": "3、代码：<br><img class=\"mm-img\" src=\"mm-8f2b789030c73d.jpg\" style=\"width:260px;height:109px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mTGnaXM6hKb", "topic": "<b>32、637.二叉树层的平均值-简单<\/b>", "expanded": false, "children": [{"id": "m4jO5W3YFkw", "topic": "1、题目：<span class=\"mm-note\">给定一个非空二叉树的根节点 root , 以<b>数组的形式返回每一层节点的平均值<\/b><\/span>", "expanded": true}, {"id": "mCRvkE1TTDw", "topic": "2、思路：<b>简单层序遍历，每一层计算平均值<\/b>即可", "expanded": true}, {"id": "mCPCG4mVo7y", "topic": "3、代码：<br><img class=\"mm-img\" src=\"mm-e04bc1d4ed1ff8.jpg\" style=\"width:260px;height:201px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mdTWHVyPvE7", "topic": "<b>33、654.最大二叉树-中等<\/b>", "expanded": false, "children": [{"id": "m7YgdB4oigb", "topic": "1、题目：<span class=\"mm-note\">给定一个不重复的整数数组 nums 。 <b>最大二叉树<\/b> 可以用下面的算法从 nums 递归地构建:\n          创建一个根节点，其值为 nums 中的最大值。\n          递归地在最大值 <b>左边<\/b> 的 <b>子数组前缀上<\/b> 构建左子树。\n          递归地在最大值 <b>右边<\/b> 的 <b>子数组后缀上<\/b> 构建右子树。\n返回 <i>nums 构建的<\/i> *<b>最大二叉树*<\/b> 。<\/span>", "expanded": true}, {"id": "m3sQqLSOPGu", "topic": "<b>2、思路1(递归构建)：具体思路类似于105题/106题的树的构建，<\/b><span style=\"color:#1d4ed8\"><b><span> 坚持左闭右开原则<\/span><\/b><br><img class=\"mm-img\" src=\"mm-a49eb448807ef8.jpg\" style=\"width:260px;height:315px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mnshdOELRnH", "topic": "3、思路2(<b><mark>单调栈)<\/mark><\/b>", "expanded": true}]}, {"id": "mfKA8XitI3N", "topic": "<b>34、669.修剪二叉搜索树(BST)-中等<\/b>", "expanded": false, "children": [{"id": "m5wzpB0LueS", "topic": "1、题目：<span class=\"mm-note\">给你二叉搜索树的根节点 root ，同时给定<b>最小边 e=\"width:260px;height:102px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mMoPFMNAYCO", "topic": "<b>7 <\/b><span style=\"color:#d92d20\"><b><span>❤<\/span><\/b><b>写出在中序线索二叉树中查找指定结点在后序的前驱结点<\/b>", "expanded": false, "children": [{"id": "msqqI6jyCTJ", "topic": "思路：<br><img class=\"mm-img\" src=\"mm-c120cd8d334dd0.jpg\" style=\"width:260px;height:90px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mjmsfEe5JxA", "topic": "<b>代码：<\/b><br><img class=\"mm-img\" src=\"mm-25fbd0e2bc7bfa.jpg\" style=\"width:260px;height:291px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mclC9QRlHy2", "topic": "<b>9<\/b> <span style=\"color:#d92d20\"><b><span>❤ <\/span><\/b><b>将指定的二叉树转换为中缀表达式<\/b>", "expanded": false, "children": [{"id": "m1LFDx2XpGV", "topic": "1、题目：<br><img class=\"mm-img\" src=\"mm-93450b95d6fc42.jpg\" style=\"width:260px;height:98px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\"><br><img class=\"mm-img\" src=\"mm-59bf69ec7b9c87.jpg\" style=\"width:260px;height:75px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "mMHXncNjoO4", "topic": "2、思路：<br><img class=\"mm-img\" src=\"mm-d0c67c06df1163.jpg\" style=\"width:260px;height:80px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}, {"id": "m3uLce22di0", "topic": "3、代码：<br><img class=\"mm-img\" src=\"mm-419b485c439736.jpg\" style=\"width:260px;height:223px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mKFMqCVQWzX", "topic": "<b>11<\/b><span style=\"color:#d92d20\"><b><span>❤  <\/span><\/b><b>n个有序数组的合并<\/b>", "expanded": false, "children": [{"id": "m4SJy2fTveg", "topic": "<b>合并：<\/b><b><mark>哈夫曼树合并法<\/mark><\/b>", "expanded": true}, {"id": "m4o99j5l33L", "topic": "<b>合并两个长度为m与n的有序数组，最多比较次数：<\/b><b><mark>n+m-1<\/mark><\/b><br><img class=\"mm-img\" src=\"mm-55c5304165b35d.jpg\" style=\"width:260px;height:295px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mUQRMwUXsKj", "topic": "<b>12<\/b><span style=\"color:#d92d20\"><b><span>❤<\/span><\/b><b> 前缀码的存储结构与前缀特性的检验<\/b>", "expanded": false, "children": [{"id": "mvk4d4zdaGL", "topic": "<b>存储结构：<\/b><b><mark>二叉树<\/mark><\/b>", "expanded": true}, {"id": "mpxoDM9Xh4w", "topic": "<b>前缀特性检验：<\/b><b><mark>二叉树的构建过程<\/mark><\/b><br><img class=\"mm-img\" src=\"mm-cbffc491ee0b7b.jpg\" style=\"width:260px;height:225px\" loading=\"lazy\" decoding=\"async\" referrerpolicy=\"no-referrer\">", "expanded": true}]}, {"id": "mk93Ujnm4Np", "topic": "14 <span style=\"color:#d92d20\"><span>❤ <\/span><b>满二叉树<\/b>中，<b>前序+后序序列可以构造二叉树<\/b>", "expanded": true}, {"id": "m3WHU0e8C23", "topic": "15 <span style=\"color:#d92d20\"><span>❤<\/span><span style=\"color:#d92d20\"><b><span> 二叉树只有度为2和0的节点的情况下，前序和后序可以确定一棵树！！！！<\/span><\/b>", "expanded": false, "children": [{"id": "mIPxEvTEXzI", "topic": "大体思路：<b>如果只有一个儿子结点<\/b>的话，在<b>递归判断的时候无法知道是否是左儿子还是右儿子<\/b>；但是<b>如果有两个或者没有的话<\/b>，是<b>可以判断<\/b>的。<span class=\"mm-note\">具体细节看：<a href=\"https://blog.csdn.net/destiny_balabala/article/details/99352715?app_version=6.2.4&amp;csdn_share_tail=%7B%22type%22%3A%22blog%22%2C%22rType%22%3A%22article%22%2C%22rId%22%3A%2299352715%22%2C%22source%22%3A%22m0_51774360%22%7D&amp;utm_source=app\" target=\"_blank\" rel=\"noopener\">给定二叉树的前序和后序，判断二叉树是否唯一？_二叉树前序和后序确定二叉树-CSDN博客<\/a><\/span>", "expanded": true}, {"id": "mwJwxwERPxh", "topic": "构造步骤：", "expanded": false, "children": [{"id": "mFT46p6FSdq", "topic": "1. 对于前序中的每一个根节点，在后序中去找这个根节点（1号）和根节点后面一个结点（2号）的位置", "expanded": true}, {"id": "mAzMLNRAcq9", "topic": "2. 在后序中，如果1号位置在2号位置之间右边并且二者之间有元素，说明之间的元素都属于1号的右子树，2号位置及以前的元素都属于1号的左子树，如果递归下去都是这样，就是唯一的；如果1号和2号位置之间没有元素，这时就没有办法判断它是属于左子树属于右子树，二叉树也就不唯一了。", "expanded": true}]}]}]}, {"id": "mDlLJufx9dP", "topic": "<b>四、二叉树的线索化<\/b>", "exp   tocBox.addEventListener('touchend', function(){ tocSx = null; }, {passive:true});

  function setView(v){
    isDocView = v === 'doc';
    if (isDocView && !docBuilt) { buildDoc(); docBuilt = true; }
    docEl.classList.toggle('on', isDocView);
    mapElWrap.style.display = isDocView ? 'none' : '';
    tipEl.hidden = isDocView;
    tocBtn.classList.toggle('on', isDocView);
    if (!isDocView) { tocBox.classList.remove('on'); tocMask.classList.remove('on'); }
    viewBtn.textContent = isDocView ? '导图' : '文档';
    document.getElementById('qbtn').hidden = false;
    document.getElementById('fit').hidden = isDocView;
    bFold.hidden = isDocView;
    bOpen.hidden = isDocView;
    docOpen.hidden = !isDocView;
    docClose.hidden = !isDocView;
    if (isDocView) {
      var qb=document.getElementById('qbar'); if(qb) qb.hidden = true;
      document.getElementById('dbar').hidden = true;
    } else {
      document.getElementById('dbar').hidden = true;
      document.getElementById('dq').value = '';
      if (docBuilt) docClear();
      setTimeout(function(){ try { focusRoot(true); } catch(e){} }, 40);
    }
  }
  viewBtn.onclick = function(){ setView(isDocView ? 'map' : 'doc'); };
  docOpen.onclick = function(){ docInner.querySelectorAll('details').forEach(function(d){ d.open = true; }); };
  docClose.onclick = function(){
    var all = docInner.querySelectorAll('details');
    all.forEach(function(d, i){ d.open = i < 3; });
  };
  // 文档里单击图片 → 放大查看
  docEl.addEventListener('click', function(e){
    var img = e.target && e.target.tagName === 'IMG' ? e.target : null;
    if (!img) return;
    e.preventDefault(); e.stopPropagation();
    var host = img.closest('summary, .dleaf, details');
    var name = host ? (host.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40) : '';
    lbOpen(img.getAttribute('src'), name, img.getBoundingClientRect());
  }, true);
  // 文档内搜索
  var dq = document.getElementById('dq'), dqc = document.getElementById('dqc');
  var dHits = [], dIdx = -1;
  function docClear(){ docInner.innerHTML = docHTML; dHits = []; dIdx = -1; dqc.textContent = ''; }
  function docJump(i){
    if (!dHits.length) return;
    dIdx = (i + dHits.length) % dHits.length;
    dHits.forEach(function(m){ m.classList.remove('cur'); });
    var m = dHits[dIdx];
    m.classList.add('cur');
    var p = m.parentElement;
    while (p && p !== docInner) { if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement; }
    setTimeout(function(){ m.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 20);
    dqc.textContent = (dIdx + 1) + '/' + dHits.length;
  }
  function docSearch(){
    var kw = dq.value.trim().toLowerCase();
    if (!kw) { docClear(); return; }
    if (!docHTML) return;
    docInner.innerHTML = docHTML;
    dHits = []; dIdx = -1;
    var walker = document.createTreeWalker(docInner, NodeFilter.SHOW_TEXT, null), node;
    var nodes = [];
    while ((node = walker.nextNode())) nodes.push(node);
    nodes.forEach(function(nd){
      var text = nd.nodeValue || '';
      var low = text.toLowerCase();
      var idx = low.indexOf(kw), last = 0;
      if (idx < 0) return;
      var frag = document.createDocumentFragment();
      while (idx >= 0) {
        if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
        var m = document.createElement('mark');
        m.className = 'dhit';
        m.textContent = text.substr(idx, kw.length);
        frag.appendChild(m);
        last = idx + kw.length;
        idx = low.indexOf(kw, last);
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      nd.parentNode.replaceChild(frag, nd);
    });
    dHits = [].slice.call(docInner.querySelectorAll('mark.dhit'));
    dqc.textContent = dHits.length ? ('0/' + dHits.length) : '无结果';
    if (dHits.length) docJump(0);
  }
  dq.addEventListener('input', docSearch);
  dq.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); docJump(dIdx + 1); } });
  document.getElementById('dqprev').onclick = function(){ docJump(dIdx - 1); };
  document.getElementById('dqnext').onclick = function(){ docJump(dIdx + 1); };
  document.getElementById('dqclose').onclick = function(){ dq.value = ''; docClear(); dq.blur(); };

  // 默认进入文档视图
  setTimeout(function(){ setView('doc'); }, 80);

  // 超大图初始折叠，避免首屏卡顿
  var _total = (function c(n){ return 1 + (n.children || []).reduce(function(a, b){ return a + c(b); }, 0); })(data);
  if (_total > 500) {
    setTimeout(function(){
      setExpand(2, false);
      tipEl.textContent = '节点较多，已折叠到 2 层 · 点「展开」查看全部';
      tipEl.hidden = false;
      setTimeout(function(){ tipEl.hidden = true; }, 5200);
    }, 1400);
  }
  window.__mind = mind;
  window.__mm = { zoomAt: zoomAt, focusRoot: focusRoot, setView: setView };
})();
</script>
</body></html>
