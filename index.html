<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DragonHuge</title>
<meta http-equiv="refresh" content="0; url=/app/">
<link rel="canonical" href="/app/">
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f7f6f1;color:#1f2937}
.card{max-width:420px;margin:24px;padding:34px;border-radius:20px;background:#fff;border:1px solid #e6e4da;box-shadow:0 12px 35px rgba(31,41,55,.08);text-align:center}
h1{margin:0 0 8px;font-size:24px}p{margin:0 0 20px;color:#6b7280;line-height:1.6}a{display:inline-block;padding:11px 22px;border-radius:999px;background:#16a34a;color:#fff;text-decoration:none;font-weight:650}
@media(prefers-color-scheme:dark){body{background:#111214;color:#e5e7eb}.card{background:#191a1c;border-color:#303236}p{color:#9ca3af}}
</style>
</head>
<body><main class="card"><h1>DragonHuge</h1><p>正在进入个人知识 App…</p><a href="/app/">手动进入</a></main><script>location.replace('/app/');</script></body>
</html>
